<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://gl-api.gltransam.workers.dev; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GL Logistics | Invoice</title>
<link rel="icon" type="image/png" href="images/GL_LOGISTICs_line_-09.jpg.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EDF4F4;font-family:'Inter',sans-serif;color:#1E3B42;min-height:100vh;padding:1rem}
.top-bar{background:#fff;border-radius:16px;padding:.6rem 1.4rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 16px rgba(30,59,66,.06)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.95rem;text-decoration:none;color:#0D1F23}
.brand img{height:28px}
.nav-links{display:flex;gap:3px;padding:3px;background:rgba(255,255,255,.7);border-radius:12px;border:1px solid rgba(85,183,189,.15);flex-wrap:wrap}
.nav-links a{color:#5a7a80;padding:6px 12px;border-radius:9px;text-decoration:none;font-size:.75rem;font-weight:600}
.nav-links a:hover{background:#E8F6F6;color:#1E7A80}
.nav-links a.active{background:#55B7BD;color:#fff}
.btn-logout{background:#F5FAFA;color:#1E3B42;border:1.5px solid rgba(85,183,189,.3);border-radius:9px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.78rem}

.layout{display:flex;flex-direction:column;gap:1.2rem}

/* ФОРМА */
.form-panel{background:#fff;border-radius:18px;padding:1.2rem;box-shadow:0 2px 12px rgba(30,59,66,.08);border:1.5px solid rgba(85,183,189,.2);display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-section{font-size:.72rem;font-weight:800;color:#1E3B42;text-transform:uppercase;letter-spacing:.5px;margin:.8rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid rgba(85,183,189,.12)}
label{font-size:.68rem;font-weight:700;color:#5a7a80;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px}
input,select,textarea{width:100%;background:#F0F9F9;border:1.5px solid rgba(85,183,189,.25);border-radius:9px;padding:8px 12px;color:#1E3B42;font-size:.83rem;outline:none;font-family:inherit;transition:.15s}
input:focus,select:focus{border-color:#55B7BD;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}
.mb{margin-bottom:.6rem}

/* Таблица позиций */
.items-hdr{display:grid;grid-template-columns:1fr 60px 90px 90px 30px;gap:4px;margin-bottom:4px}
.items-hdr span{font-size:.62rem;font-weight:700;color:#8fa8ab;text-transform:uppercase;padding:0 4px}
.item-row{display:grid;grid-template-columns:1fr 60px 90px 90px 30px;gap:4px;margin-bottom:4px}
.item-row input{padding:5px 7px;font-size:.78rem}
.btn-add{background:#F0F9F9;color:#1E7A80;border:1.5px dashed rgba(85,183,189,.4);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.72rem;font-weight:700;width:100%;margin:.4rem 0}
.btn-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:.9rem;padding:2px 4px}

.btn-dl{background:#55B7BD;color:#fff;border:none;border-radius:11px;padding:10px;cursor:pointer;font-weight:800;font-size:.85rem;width:100%;margin-top:.6rem}
.btn-dl:hover{background:#3d9da3}
.btn-send{background:#F0F9F9;color:#1E7A80;border:1.5px solid rgba(85,183,189,.3);border-radius:11px;padding:9px;cursor:pointer;font-weight:700;font-size:.82rem;width:100%;margin-top:.4rem}

/* ИНВОЙС ПРЕВЬЮ */
.preview-wrap{width:100%}
#invDoc{background:#fff;padding:36px 40px;font-family:'Arial',Helvetica,sans-serif;font-size:9.5px;color:#1a1a1a;width:794px;min-height:1020px;position:relative;margin:0 auto;box-shadow:0 2px 20px rgba(0,0,0,.15)}

/* Заголовок */
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:12px;border-bottom:2.5px solid #2A6B6B}
.inv-title{font-size:26px;font-weight:900;color:#1a1a1a;letter-spacing:-0.5px;line-height:1}
.inv-subtitle{font-size:10px;font-style:italic;color:#666;margin-top:3px}
.inv-logo-wrap{text-align:right}
.inv-logo-wrap img{height:68px;width:auto;object-fit:contain;display:block;margin-left:auto}
.inv-logo-name{font-size:18px;font-weight:900;color:#1a1a1a;letter-spacing:-0.3px;margin-top:2px}
.inv-logo-sub{font-size:7px;color:#888;letter-spacing:.3px}

/* Три колонки */
.inv-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.inv-col-title{font-size:7.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#1a3a40;border-bottom:1.5px solid #2A6B6B;padding-bottom:3px;margin-bottom:6px}
.inv-field{margin-bottom:3px;font-size:8.5px;line-height:1.5}
.inv-field-label{color:#666;font-size:7.5px}
.inv-field-line{border-bottom:1px solid #ccc;min-height:14px;padding-bottom:1px}

/* DETAILS box */
.inv-details-table{width:100%;border-collapse:collapse;border:1px solid #ccc}
.inv-details-table td{padding:3px 6px;border-bottom:1px solid #ddd;font-size:8px}
.inv-details-table td:first-child{background:#e8f4f4;font-weight:700;width:50%;color:#1a3a40;border-right:1px solid #b0cccc}
.inv-details-table tr:last-child td{border-bottom:none}

/* Таблица позиций инвойса */
.inv-items{width:100%;border-collapse:collapse;margin-bottom:8px}
.inv-items thead tr{background:#dde8e8}
.inv-items th{padding:5px 8px;text-align:left;font-size:7.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#333;border:1px solid #ccc}
.inv-items th:nth-child(2),.inv-items th:nth-child(3),.inv-items th:nth-child(4){text-align:center}
.inv-items td{padding:5px 8px;border:1px solid #ddd;font-size:9px;vertical-align:top}
.inv-items td:nth-child(2){text-align:center}
.inv-items td:nth-child(3),.inv-items td:nth-child(4){text-align:right;font-weight:500}
.inv-items tr:nth-child(even) td{background:#fafafa}

/* Итоги */
.inv-bottom{display:flex;justify-content:flex-end;margin-top:6px}
.inv-totals{width:200px;border:1px solid #ccc}
.inv-total-row{display:flex;border-bottom:1px solid #eee}
.inv-total-row:last-child{border-bottom:none;background:#e8e8e8}
.inv-total-label{padding:4px 8px;flex:1;font-size:8px;color:#444;font-weight:600}
.inv-total-val{padding:4px 10px;font-size:9px;font-weight:700;text-align:right;min-width:75px;border-left:1px solid #eee}

/* Подписи */
.inv-sigs{display:grid;grid-template-columns:120px 1fr 120px;gap:12px;margin:14px 0 10px;align-items:flex-end}
.inv-sig{text-align:center}
.inv-sig-line{border-top:1px solid #333;padding-top:3px;font-size:7px;color:#555;margin-top:30px}
.inv-stamp-area{display:flex;align-items:flex-end;justify-content:flex-start}

/* Notes */
.inv-notes{border:1px solid #b0cccc;padding:7px 9px;font-size:7.5px;line-height:1.8;color:#1a3a40;margin-top:10px;background:#f5fbfb}
.inv-notes-title{font-weight:900;font-size:7.5px;letter-spacing:.5px;display:block;margin-bottom:3px}

/* Водяной знак */
.inv-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-35deg);font-size:70px;font-weight:900;color:rgba(0,0,0,.04);pointer-events:none;z-index:0;white-space:nowrap}
.inv-body{position:relative;z-index:1}
</style>
</head>
<body>
<div class="top-bar">
  <a href="/" class="brand"><img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL">GL Logistics</a>
  <div class="nav-links">
    <a href="staff-dashboard.html">📊 Главная</a>
    <a href="staff-cargo.html">📦 Сделки</a>
    <a href="/invoice" class="active">🧾 Инвойс</a>
    <a href="/clients">👥 Клиенты</a>
    <a href="/files">📁 Файлы</a>
  </div>
  <button class="btn-logout" id="logoutBtn">Выйти</button>
</div>

<div class="layout">
  <!-- ФОРМА -->
  <div class="form-panel">
    <div class="form-section">📋 Инвойс</div>
    <div class="g3 mb">
      <div><label>Invoice №</label><input id="fNum" readonly style="background:#E0F4F5;font-weight:800;color:#1E7A80"></div>
      <div><label>Issue Date</label><input type="date" id="fIssue"></div>
      <div><label>Due Date</label><input type="date" id="fDue"></div>
    </div>
    <div class="mb"><label>Order Number</label><input id="fOrder" placeholder="Номер заказа / CMR"></div>

    <div class="form-section">👤 Клиент</div>
    <div class="mb"><label>Name</label><input id="cName" placeholder="Company Name"></div>
    <div class="mb"><label>Address</label><input id="cAddr" placeholder="Address"></div>
    <div class="g2 mb">
      <div><label>Phone</label><input id="cPhone" placeholder="+1 234 567 890"></div>
      <div><label>Email (PDF придёт сюда)</label><input type="email" id="cEmail" placeholder="client@example.com"></div>
    </div>

    <div class="form-section">📦 Позиции</div>
    <div class="items-hdr">
      <span>Description</span><span>QTY</span><span>Advance</span><span>Total</span><span></span>
    </div>
    <div id="itemsList">
      <div class="item-row">
        <input class="idesc" placeholder="Price for 1(one) truck..."><input class="iqty" type="number" value="1" min="1" style="text-align:center"><input class="iadv" type="number" placeholder="0" step="0.01"><input class="itotal" type="number" placeholder="0.00" step="0.01"><span></span>
      </div>
    </div>
    <button class="btn-add" id="addRow">+ Добавить строку</button>

    <div class="g2 mb">
      <div><label>Валюта</label>
        <select id="fCur"><option value="€">EUR €</option><option value="$">USD $</option><option value="֏">AMD ֏</option><option value="₽">RUB ₽</option></select>
      </div>
      <div><label>MISC</label><input id="fMisc" type="number" placeholder="0" step="0.01"></div>
    </div>

    <div style="grid-column:1/-1;margin-bottom:.4rem">
  <label style="font-size:.68rem;font-weight:700;color:#5a7a80;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px">🏦 Банковские реквизиты</label>
  <select id="fBankSel" style="width:100%;background:#F0F9F9;border:1.5px solid rgba(85,183,189,.25);border-radius:9px;padding:8px 12px;color:#1E3B42;font-size:.83rem;outline:none;font-family:inherit">
    <option value="eur_raiffeisen">EUR — Raiffeisen Bank International (Vienna)</option>
    <option value="eur_delubac">EUR — Banque Delubac &amp; CIE (Paris)</option>
    <option value="usd">USD — Raiffeisen Bank International (Vienna)</option>
    <option value="rub">RUB — Оридж­ин Банк (Москва)</option>
  </select>
</div>
<button class="btn-dl" id="btnDl">⬇ Скачать PDF</button>
    <button class="btn-send" id="btnSend">📧 Отправить клиенту</button>
  </div>

  <!-- ПРЕВЬЮ -->
  <div class="preview-wrap">
    <div id="invDoc">
      <img src="images/gl_logo_icon.png" style="position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:500px;height:auto;opacity:0.10;pointer-events:none;z-index:0">
      <div class="inv-body" id="invBody"></div>
    </div>
  </div>
</div>

<script>
const W = 'https://gl-api.gltransam.workers.dev';

const BANK_DETAILS = {
  eur_raiffeisen: `INTERMEDIARY BANK: RAIFFEISEN BANK INTERNATIONAL AG (Vienna, Austria)
INTERMEDIARY SWIFT: RZBAATW W
BANK BENEFICIARY: EVOCABANK OJSC (Yerevan, Armenia)
BENEFICIARY SWIFT: PRMLAM22
COR. ACC.N: 1-55.080.071
BENEFICIARY: "GL LOGISTICS"
ACCOUNT NUMBER: 1660030207071745
ATTENTION: Please always indicate the purpose of payment/POP/.`,

  eur_delubac: `INTERMEDIARY BANK: BANQUE DELUBAC & CIE (Paris, France)
INTERMEDIARY SWIFT: DELUFR22LCH
BANK BENEFICIARY: EVOCABANK OJSC (Yerevan, Armenia)
BENEFICIARY SWIFT: PRMLAM22
COR. ACC.N: FR761287900001111840620012 5
BENEFICIARY: "GL LOGISTICS"
ACCOUNT NUMBER: 1660030207071745
ATTENTION: Please always indicate the purpose of payment/POP/.`,

  usd: `INTERMEDIARY BANK: RAIFFEISEN BANK INTERNATIONAL AG (Vienna, Austria)
INTERMEDIARY SWIFT: RZBAATW W
BANK BENEFICIARY: EVOCABANK OJSC (Yerevan, Armenia)
BENEFICIARY SWIFT: PRMLAM22
COR. ACC.N: 070-55.080.071
BENEFICIARY: "GL LOGISTICS"
ACCOUNT NUMBER: 1660030207561601
ATTENTION: Please always indicate the purpose of payment/POP/.`,

  rub: `БАНК КОРРЕСПОНДЕНТ: ООО «Оридж­ин Банк» (Российская Федерация)
БИК: 044525340
ИНН: 7750005387
К/С: 30101810000000000340
Адрес: 125047, г. Москва, ул. Гашека, д. 6
SWIFT: LICGRUMM
БАНК ПОЛУЧАТЕЛЬ: ОАО ЭВОКАБАНК
SWIFT: PRMLAM22
Р/С: 30111810000000000002
Адрес: Армения, 0010, г. Ереван, ул. Анрапетутян 44/2
ИНН: 00001182
ПОЛУЧАТЕЛЬ: "GL LOGISTICS"
НОМЕР СЧЕТА: 1660030207071958
Внимание: Просим обязательно указывать назначение платежа`
};
const user = localStorage.getItem('gl_staff_user');
if (!user || (Date.now()-parseInt(localStorage.getItem('gl_staff_login_time')||0))>43200000) { localStorage.removeItem('gl_staff_user'); location.href='staff.html'; }
document.getElementById('logoutBtn').onclick=()=>{ ['gl_staff_user','gl_staff_login_time','gl_staff_token'].forEach(k=>localStorage.removeItem(k)); location.href='staff.html'; };

// Даты
const t=new Date(), ts=t.toISOString().slice(0,10);
document.getElementById('fIssue').value=ts;
const d2=new Date(t); d2.setDate(d2.getDate()+14);
document.getElementById('fDue').value=d2.toISOString().slice(0,10);

// Номер инвойса
// Показываем следующий номер сразу (без инкремента)
fetch(W+'/api/invoice-number/peek').then(r=>r.json()).then(d=>{
  if(document.getElementById('fNum').value===''){
    document.getElementById('fNum').value=d.number||'0434';
    render();
  }
}).catch(()=>{ document.getElementById('fNum').value='0434'; render(); });
document.getElementById('fNum').value='';

const $=id=>document.getElementById(id);
const fv=id=>($( id)?.value||'').trim();
const fmt=(n,c)=>n&&!isNaN(n)?parseFloat(n).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})+c:'';

function items(){ return [...document.querySelectorAll('#itemsList .item-row')].map(r=>({ desc:r.querySelector('.idesc').value, qty:r.querySelector('.iqty').value||'1', adv:r.querySelector('.iadv').value, total:r.querySelector('.itotal').value })).filter(i=>i.desc||i.total); }

function render(){
  const num=fv('fNum'), issue=fv('fIssue'), due=fv('fDue'), order=fv('fOrder');
  const cur=document.getElementById('fCur')?.value||'€';
  const rows=items();
  const misc=parseFloat(fv('fMisc'))||0;
  const sub=rows.reduce((s,r)=>s+(parseFloat(r.total)||0),0);
  const bal=sub+misc;

  $('invBody').innerHTML=`
    <div class="inv-top">
      <div>
        <div class="inv-title">INVOICE No ${num}</div>
        <div class="inv-subtitle">GL Logistics LLC</div>
      </div>
    <!-- Логотип справа -->
    <div class="inv-logo-wrap">
      <img src="images/gl_logo_icon.png" style="height:68px;width:auto;object-fit:contain;display:block;margin-left:auto">
      <div class="inv-logo-name">GL Logistics</div>
      <div class="inv-logo-sub">Your supply chain partner everywhere.</div>
    </div>
    </div>

    <div class="inv-cols">
      <div>
        <div class="inv-col-title">Trucking Company</div>
        <div class="inv-field"><span class="inv-field-label">Name: </span>GL Logistics LLC</div>
        <div class="inv-field"><span class="inv-field-label">Address: </span>99/1 12st 18app<br>Yerevan 0041<br>Armenia</div>
        <div class="inv-field"><span class="inv-field-label">Phone #: </span>+37493661454</div>
        <div class="inv-field"><span class="inv-field-label">Email Address: </span>info@gllogistics.org</div>
      </div>
      <div>
        <div class="inv-col-title">Customer</div>
        <div class="inv-field"><span class="inv-field-label">Name: </span><span class="inv-field-line">${fv('cName')||''}</span></div>
        <div class="inv-field"><span class="inv-field-label">Address: </span><span class="inv-field-line">${fv('cAddr')||''}</span></div>
        <div class="inv-field"><span class="inv-field-label">Phone #: </span><span class="inv-field-line">${fv('cPhone')||''}</span></div>
        <div class="inv-field"><span class="inv-field-label">Email Address: </span><span class="inv-field-line">${fv('cEmail')||''}</span></div>
      </div>
      <div>
        <div class="inv-col-title">Details</div>
        <table class="inv-details-table">
          <tr><td>Issue Date</td><td>${issue}</td></tr>
          <tr><td>Due Date</td><td>${due}</td></tr>
          <tr><td>Invoice #</td><td>${num}</td></tr>
          <tr><td>Order Number</td><td>${order}</td></tr>
        </table>
      </div>
    </div>

    <table class="inv-items">
      <thead><tr><th>Description</th><th>QTY</th><th>Advance</th><th>Total</th></tr></thead>
      <tbody>
        ${rows.length?rows.map(r=>`<tr><td>${r.desc}</td><td>${r.qty}x</td><td style="text-align:right">${r.adv?fmt(r.adv,cur):''}</td><td style="text-align:right;font-weight:700">${fmt(r.total,cur)}</td></tr>`).join(''):`<tr><td colspan="4" style="color:#ccc;text-align:center;padding:20px">Добавьте позиции...</td></tr>`}
        ${Array(Math.max(0,5-rows.length)).fill('<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>').join('')}
      </tbody>
    </table>

    <div class="inv-bottom">
      <div class="inv-totals">
        <div class="inv-total-row"><span class="inv-total-label">SUBTOTAL</span><span class="inv-total-val">${fmt(sub,cur)}</span></div>
        <div class="inv-total-row"><span class="inv-total-label">TAX</span><span class="inv-total-val"></span></div>
        <div class="inv-total-row"><span class="inv-total-label">MISC.</span><span class="inv-total-val">${misc?fmt(misc,cur):''}</span></div>
        <div class="inv-total-row"><span class="inv-total-label">BALANCE DUE</span><span class="inv-total-val">${fmt(bal,cur)}</span></div>
      </div>
    </div>

    <div class="inv-sigs">
      <div class="inv-stamp-area" style="min-height:60px"><img src="images/gl_stamp.png" style="height:135px;width:auto;opacity:0.35"></div>
      <div></div>
      <div class="inv-sig">
        <img src="images/gl_signature.png" style="height:52px;width:auto;display:block;margin-bottom:2px">
        <div class="inv-sig-line">Authorized Signature</div>
      </div>
    </div>

    <div class="inv-notes">
      <span class="inv-notes-title">NOTES:</span>
      ${(BANK_DETAILS[document.getElementById('fBankSel')?.value||'eur_raiffeisen']||'').replace(/\n/g,'<br>')}
    </div>`;
}

// Live update
document.addEventListener('input', render);
document.getElementById('fBankSel')?.addEventListener('change', render);

// Автовыбор реквизитов при смене валюты
document.getElementById('fCur')?.addEventListener('change', function() {
  const cur = this.value;
  const sel = document.getElementById('fBankSel');
  if (!sel) return;
  if (cur === '€') sel.value = 'eur_raiffeisen';
  else if (cur === '$') sel.value = 'usd';
  else if (cur === '₽') sel.value = 'rub';
  else sel.value = 'eur_raiffeisen';
  render();
});
document.getElementById('addRow').addEventListener('click',()=>{
  const div=document.createElement('div');
  div.className='item-row';
  div.innerHTML='<input class="idesc" placeholder="Описание..."><input class="iqty" type="number" value="1" min="1" style="text-align:center"><input class="iadv" type="number" placeholder="0" step="0.01"><input class="itotal" type="number" placeholder="0.00" step="0.01"><button class="btn-del" onclick="this.parentNode.remove();render()">✕</button>';
  $('itemsList').appendChild(div);
});

async function getNextNumber() {
  try {
    // Получаем реальный следующий номер (с инкрементом)
    const r = await fetch(W+'/api/invoice-number');
    const d = await r.json();
    const num = d.number || d.full || '0001';
    document.getElementById('fNum').value = num;
    render();
    // После получения — показываем следующий (peek) для нового инвойса
    setTimeout(async () => {
      try {
        const pr = await fetch(W+'/api/invoice-number/peek');
        const pd = await pr.json();
        // Не меняем текущий номер — он уже зафиксирован
      } catch(_) {}
    }, 500);
    return num;
  } catch(_) {
    const num = '0001';
    document.getElementById('fNum').value = num;
    return num;
  }
}

// После скачивания/отправки — обновляем номер на следующий
async function refreshInvoiceNumber() {
  try {
    const r = await fetch(W+'/api/invoice-number/peek');
    const d = await r.json();
    document.getElementById('fNum').value = d.number || '';
    render();
  } catch(_) {}
}

async function makePdf(){
  const doc=$('invDoc');
  const canvas=await html2canvas(doc,{scale:2,useCORS:true,backgroundColor:'#fff'});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const w=pdf.internal.pageSize.getWidth();
  const h=(canvas.height/canvas.width)*w;
  pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h);
  return pdf;
}

$('btnDl').onclick=async()=>{
  const b=$('btnDl'); b.disabled=true; b.textContent='⏳...';
  try{ await getNextNumber(); const p=await makePdf(); p.save('Invoice-'+fv('fNum')+'.pdf'); await refreshInvoiceNumber(); }
  finally{ b.disabled=false; b.textContent='⬇ Скачать PDF'; }
};

$('btnSend').onclick=async()=>{
  const email=fv('cEmail');
  if(!email){alert('Введите email клиента');return;}
  const b=$('btnSend'); b.disabled=true; b.textContent='⏳ Отправка...';
  try{
    await getNextNumber();
    const pdf=await makePdf();
    const blob=pdf.output('blob');
    const up=await fetch(W+'/api/upload-contract',{method:'POST',headers:{'Content-Type':'application/pdf'},body:blob});
    const ud=await up.json();
    const cur=document.getElementById('fCur')?.value||'€';
    const rows=items();
    const bal=rows.reduce((s,r)=>s+(parseFloat(r.total)||0),0)+(parseFloat(fv('fMisc'))||0);
    await fetch(W+'/api/send-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      to:email, subject:'GL Logistics — Invoice No '+fv('fNum'),
      pdfKey:ud.key, pdfName:'Invoice-'+fv('fNum')+'.pdf',
      html:`<p>Dear ${fv('cName')||'Customer'},</p><p>Please find attached <b>Invoice No ${fv('fNum')}</b> from GL Logistics.</p><p>Amount due: <b>${bal.toLocaleString('en',{minimumFractionDigits:2})}${cur}</b></p><p>Due date: <b>${fv('fDue')}</b></p><hr><p style="color:#888;font-size:11px">GL Logistics LLC · +374 93 66 14 54 · info@gllogistics.org</p>`
    })});
    await fetch(W+'/api/send-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      to:'info@gllogistics.org', subject:'Invoice No '+fv('fNum')+' → '+fv('cName'),
      pdfKey:ud.key, pdfName:'Invoice-'+fv('fNum')+'.pdf',
      html:`<p>Инвойс №${fv('fNum')} отправлен.<br>Клиент: ${fv('cName')}<br>Email: ${email}<br>Сумма: ${bal.toLocaleString('en',{minimumFractionDigits:2})}${cur}</p>`
    })});
    alert('✅ Инвойс отправлен на '+email); await refreshInvoiceNumber();
  }catch(e){alert('Ошибка: '+e.message);}
  finally{b.disabled=false;b.textContent='📧 Отправить клиенту';}
};

render();
</script>
