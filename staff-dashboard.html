<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GL Logistics | Дашборд</title>
  <link rel="icon" type="image/png" href="images/GL_LOGISTICs_line_-09.jpg.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F5FAFA; font-family: 'Inter', sans-serif; padding: 1.5rem; color: #1a1a1a; min-height: 100vh; }
    .app-wrapper { max-width: 1300px; margin: 0 auto; }
    .top-bar { background: #FFFFFF; border-radius: 60px; padding: 0.7rem 2rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(85,183,189,0.25); }
    .top-bar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; color: #1a1a1a; }
    .top-bar .brand img { height: 40px; }
    .btn-logout { background: #1E3B42; color: white; padding: 8px 20px; border-radius: 30px; border: none; cursor: pointer; font-weight: 600; }
    .nav-links { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .nav-links a { background: #FFFFFF; color: #55B7BD; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(85,183,189,0.25); }
    .nav-links a.active, .nav-links a:hover { background: #55B7BD; color: #0D1F23; }
    .bank-accounts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .bank-card { background: #FFFFFF; border-radius: 20px; padding: 1.2rem; border: 1px solid rgba(85,183,189,0.2); }
    .bank-card .bank-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .bank-card .bank-currency { font-size: 1.2rem; font-weight: 800; color: #55B7BD; }
    .bank-card .bank-flag { font-size: 1.5rem; }
    .bank-card .bank-balance { font-size: 1.6rem; font-weight: 800; color: #1E3B42; margin-bottom: 4px; }
    .bank-card .bank-sub { font-size: 0.8rem; color: #8fa8ab; margin-bottom: 8px; }
    .bank-card input { width: 100%; background: #F5FAFA; border: 1px solid rgba(85,183,189,0.25); border-radius: 12px; padding: 8px; font-size: 0.9rem; font-weight: 600; color: #1a1a1a; outline: none; margin-bottom: 6px; }
    .bank-card input:focus { border-color: #55B7BD; }
    .bank-card .btn-save-balance { background: #55B7BD; color: #0D1F23; border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; cursor: pointer; width: 100%; }
    .bank-card .overdraft-label { font-size: 0.65rem; color: #E65100; font-weight: 600; margin-top: 8px; display: block; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: #FFFFFF; border-radius: 16px; padding: 1.2rem; border: 1px solid rgba(85,183,189,0.2); text-align: center; }
    .stat-card .num { font-size: 1.8rem; font-weight: 800; color: #55B7BD; }
    .stat-card .lbl { font-size: 0.65rem; color: #8fa8ab; text-transform: uppercase; }
    .stat-profit { background: #EDF7F7; } .stat-profit .num { color: #3d9aa0; }
    .stat-warning { background: #FFF3E0; } .stat-warning .num { color: #E65100; }
    .stat-danger { background: #FFEBEE; } .stat-danger .num { color: #C62828; }
    .stat-success { background: #E8F5E9; } .stat-success .num { color: #2E7D32; }
    .section-title { color: #55B7BD; font-size: 1rem; margin: 1.5rem 0 0.8rem; text-transform: uppercase; }
    .table-wrap { background: #FFFFFF; border-radius: 20px; padding: 1rem; border: 1px solid rgba(85,183,189,0.2); overflow-x: auto; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { color: #55B7BD; text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(85,183,189,0.2); font-size: 0.65rem; text-transform: uppercase; background: #F5FAFA; }
    td { padding: 8px; border-bottom: 1px solid #EEF4F4; color: #2d3a3d; }
    .profit-positive { color: #3d9aa0; font-weight: 700; }
    .status-badge { padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; display: inline-block; }
    .status-loading { background: #FFF3E0; color: #E65100; }
    .status-onroad { background: #E3F2FD; color: #1565C0; }
    .status-loaded { background: #E8F5F5; color: #3d9aa0; }
    .status-completed { background: #EDE7F6; color: #4527A0; }
    .form-add { background: #FFFFFF; border-radius: 16px; padding: 1rem; margin-bottom: 1rem; border: 1px solid rgba(85,183,189,0.25); display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-add input { background: #F5FAFA; border: 1px solid rgba(85,183,189,0.25); border-radius: 12px; padding: 8px 12px; font-size: 0.85rem; outline: none; flex: 1; min-width: 150px; }
    .pwd-wrap { position: relative; flex: 1; min-width: 150px; }
    .pwd-wrap input { width: 100%; padding-right: 40px; }
    .pwd-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; }
    .btn-sm { background: #55B7BD; color: #0D1F23; border: none; padding: 8px 16px; border-radius: 30px; font-weight: 700; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
    .btn-sm-del { background: #C62828; color: white; border: none; padding: 6px 12px; border-radius: 30px; cursor: pointer; font-size: 0.7rem; }
    .show-pwd { color: #55B7BD; font-weight: 600; cursor: pointer; font-size: 0.75rem; }
    .rate-note { font-size: 0.6rem; color: #8fa8ab; margin-top: 2px; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <a href="/" class="brand"><img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL"><span>GL Logistics • Дашборд</span></a>
    <button class="btn-logout" onclick="doLogout()">Выйти</button>
  </div>
  <div class="nav-links">
    <a href="staff-dashboard.html" class="active">📊 Главная</a>
    <a href="staff-cargo.html">📦 Сделки</a>
    <a href="/rateconfirmation">📋 Заявки</a>
  </div>
  
  <h3 class="section-title">🏦 Банковские счета</h3>
  <div class="bank-accounts" id="bankAccounts"></div>
  
  <div class="stats-row" id="statsRow"></div>
  
  <h3 class="section-title">👥 Управление логистами</h3>
  <div class="form-add">
    <input type="text" id="newLogistName" placeholder="Имя пользователя">
    <div class="pwd-wrap">
      <input type="password" id="newLogistPass" placeholder="Пароль">
      <button class="pwd-toggle" onclick="togglePwd('newLogistPass')">👁️</button>
    </div>
    <button class="btn-sm" onclick="addLogist()">+ Добавить логиста</button>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Логин</th><th>Роль</th><th>Пароль</th><th></th></tr></thead><tbody id="logistListTable"></tbody></table></div>
  
  <h3 class="section-title">💰 Заработок по логистам (AMD)</h3>
  <div class="table-wrap"><table><thead><tr><th>Логист</th><th>Сделок</th><th>Оборот</th><th>Прибыль</th></tr></thead><tbody id="logistTable"></tbody></table></div>
  
  <h3 class="section-title">📦 Последние сделки</h3>
  <div class="table-wrap"><table><thead><tr><th>#</th><th>Клиент</th><th>Перевозчик</th><th>Товар</th><th>Статус</th><th>Прибыль</th><th>Валюта</th><th>Логист</th></tr></thead><tbody id="recentTable"></tbody></table></div>
</div>

<script>
const API_URL = 'https://gl-api.gltransam.workers.dev';
const ADMIN_USER = 'TigranMetspagyan';
const user = localStorage.getItem('gl_staff_user');
if (!user) window.location.href = 'staff.html';
if (user !== ADMIN_USER) window.location.href = 'staff-cargo.html';

function doLogout() { localStorage.removeItem('gl_staff_user'); window.location.href = 'staff.html'; }
function togglePwd(id) { const inp = document.getElementById(id); inp.type = inp.type === 'password' ? 'text' : 'password'; }

let usersList = [];
let exchangeRates = null;
let bankBalances = { USD: 0, EUR: 0, AMD: 0, RUB: 0, overdraftAMD: 0 };

function loadBankBalances() {
  const saved = localStorage.getItem('gl_bank_balances');
  if (saved) bankBalances = JSON.parse(saved);
  else bankBalances = { USD: 0, EUR: 0, AMD: 0, RUB: 0, overdraftAMD: 0 };
}

function saveBankBalances() {
  localStorage.setItem('gl_bank_balances', JSON.stringify(bankBalances));
}

function updateBankBalance(currency, field = 'balance') {
  const inputId = field === 'balance' ? 'bankInput_' + currency : 'overdraftInput_' + currency;
  const input = document.getElementById(inputId);
  const value = parseFloat(input.value) || 0;
  if (field === 'overdraft') bankBalances.overdraftAMD = value;
  else bankBalances[currency] = value;
  saveBankBalances();
  renderBankAccounts(); // обновить все карточки
}

function formatCurrency(amount, currency) {
  const symbols = { USD: '$', EUR: '€', AMD: '֏', RUB: '₽' };
  const sym = symbols[currency] || '$';
  return sym + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderBankAccounts() {
  const accounts = [
    { currency: 'USD', flag: '🇺🇸', label: 'Доллар США' },
    { currency: 'EUR', flag: '🇪🇺', label: 'Евро' },
    { currency: 'AMD', flag: '🇦🇲', label: 'Армянский драм' },
    { currency: 'RUB', flag: '🇷🇺', label: 'Российский рубль' }
  ];
  
  document.getElementById('bankAccounts').innerHTML = accounts.map(acc => {
    const balance = bankBalances[acc.currency] || 0;
    let extraHtml = '';
    if (acc.currency === 'AMD') {
      const overdraft = bankBalances.overdraftAMD || 0;
      const available = balance - overdraft;
      extraHtml = `
        <div class="bank-sub">Доступно: ${formatCurrency(available, 'AMD')}</div>
        <input type="number" id="overdraftInput_AMD" placeholder="Овердрафт" value="${overdraft}" onfocus="this.select()">
        <span class="overdraft-label">Овердрафт (займ)</span>
        <button class="btn-save-balance" onclick="updateBankBalance('AMD', 'overdraft')">💾 Обновить овердрафт</button>
      `;
    }
    return `
      <div class="bank-card">
        <div class="bank-header">
          <span class="bank-currency">${acc.currency}</span>
          <span class="bank-flag">${acc.flag}</span>
        </div>
        <div class="bank-balance" id="bankBalance_${acc.currency}">${formatCurrency(balance, acc.currency)}</div>
        <div class="bank-label">${acc.label}</div>
        <input type="number" id="bankInput_${acc.currency}" placeholder="Новый баланс" value="${balance}" onfocus="this.select()">
        <button class="btn-save-balance" onclick="updateBankBalance('${acc.currency}')">💾 Обновить баланс</button>
        ${extraHtml}
      </div>
    `;
  }).join('');
}

async function fetchExchangeRates() {
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    if (!res.ok) throw new Error('Rate fetch failed');
    const data = await res.json();
    exchangeRates = data.rates;
  } catch (e) {
    console.warn('Резервные курсы');
    exchangeRates = { USD: 1, EUR: 0.92, AMD: 400, RUB: 90 };
  }
}

function convertToUSD(amount, fromCurrency) {
  if (!exchangeRates || !amount) return 0;
  const cur = fromCurrency || 'USD';
  if (cur === 'USD') return amount;
  const rate = exchangeRates[cur];
  if (!rate || rate === 0) return 0;
  return amount / rate;
}

function usdToAMD(usd) {
  return usd * (exchangeRates?.AMD || 400);
}

function currencySymbol(cur) {
  if (cur === 'EUR') return '€';
  if (cur === 'AMD') return '֏';
  return '$';
}

async function loadUsers() {
  try {
    const res = await fetch(API_URL + '/api/users');
    usersList = await res.json();
    renderLogists();
  } catch (err) { console.error(err); }
}

function renderLogists() {
  document.getElementById('logistListTable').innerHTML = usersList.map((u, i) => 
    `<tr>
      <td>${esc(u.username)}</td>
      <td>${u.role === 'admin' ? '👑 Админ' : '👤 Логист'}</td>
      <td>
        <span id="pwd_${i}">••••••</span>
        <span class="show-pwd" onclick="toggleShowPwd(${i})">Показать</span>
      </td>
      <td>${u.role !== 'admin' ? `<button class="btn-sm-del" onclick="deleteLogist('${u.username}')">Удалить</button>` : ''}</td>
    </tr>`
  ).join('');
}

let pwdCache = {};

async function toggleShowPwd(i) {
  const el = document.getElementById('pwd_' + i);
  const btn = event.target;
  if (el.textContent === '••••••') {
    if (!pwdCache[usersList[i].username]) {
      const res = await fetch(API_URL + '/api/user-pwd/' + usersList[i].username);
      const data = await res.json();
      pwdCache[usersList[i].username] = data.password;
    }
    el.textContent = pwdCache[usersList[i].username];
    btn.textContent = 'Скрыть';
  } else {
    el.textContent = '••••••';
    btn.textContent = 'Показать';
  }
}

async function addLogist() {
  const name = document.getElementById('newLogistName').value.trim();
  const pass = document.getElementById('newLogistPass').value.trim();
  if (!name || !pass) return alert('Введите имя и пароль');
  try {
    const res = await fetch(API_URL + '/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name, password: pass, role: 'logist' })
    });
    if (res.ok) {
      pwdCache[name] = pass;
      document.getElementById('newLogistName').value = '';
      document.getElementById('newLogistPass').value = '';
      await loadUsers();
      alert('Логист ' + name + ' добавлен!\nЛогин: ' + name + '\nПароль: ' + pass);
    }
  } catch (err) { alert('Ошибка'); }
}

async function deleteLogist(name) {
  if (name === ADMIN_USER) return alert('Нельзя удалить админа');
  if (!confirm('Удалить ' + name + '?')) return;
  await fetch(API_URL + '/api/users/' + name, { method: 'DELETE' });
  delete pwdCache[name];
  await loadUsers();
}

async function loadData() {
  try {
    const res = await fetch(API_URL + '/api/cargo');
    const cargo = await res.json();
    
    let totalProfitUSD = 0;
    let waitingFromClientsUSD = 0;
    let waitingToCarriersUSD = 0;
    let totalReceivedUSD = 0;
    let totalPaidUSD = 0;
    
    cargo.forEach(c => {
      const clientUSD = convertToUSD(parseFloat(c.client_price || 0), c.currency || 'USD');
      const carrierUSD = convertToUSD(parseFloat(c.carrier_price || 0), c.currency || 'USD');
      const profitUSD = clientUSD - carrierUSD;
      totalProfitUSD += profitUSD;
      if (!c.client_paid) waitingFromClientsUSD += clientUSD;
      else totalReceivedUSD += clientUSD;
      if (!c.carrier_paid) waitingToCarriersUSD += carrierUSD;
      else totalPaidUSD += carrierUSD;
    });
    
    const cashGapUSD = totalPaidUSD - totalReceivedUSD;
    
    // Банковский баланс в AMD
    const amdRate = exchangeRates?.AMD || 400;
    const rubRate = exchangeRates?.RUB || 90;
    const eurRate = exchangeRates?.EUR || 0.92;
    const bankAMD = (bankBalances.USD || 0) * amdRate +
                    (bankBalances.EUR || 0) / eurRate * amdRate +
                    (bankBalances.RUB || 0) / rubRate * amdRate +
                    (bankBalances.AMD || 0) - (bankBalances.overdraftAMD || 0);
    
    const netBalanceAMD = bankAMD + usdToAMD(totalReceivedUSD - totalPaidUSD);
    
    const statsHTML = `
      <div class="stat-card"><div class="num">${cargo.length}</div><div class="lbl">Сделок</div></div>
      <div class="stat-card stat-profit"><div class="num">֏${Math.round(usdToAMD(totalProfitUSD)).toLocaleString()}</div><div class="lbl">Прибыль AMD</div></div>
      <div class="stat-card stat-success"><div class="num">֏${Math.round(usdToAMD(totalReceivedUSD)).toLocaleString()}</div><div class="lbl">✅ Получено</div></div>
      <div class="stat-card stat-warning"><div class="num">֏${Math.round(usdToAMD(totalPaidUSD)).toLocaleString()}</div><div class="lbl">📤 Оплачено</div></div>
      <div class="stat-card ${cashGapUSD > 0 ? 'stat-danger' : 'stat-success'}"><div class="num">֏${Math.round(usdToAMD(Math.abs(cashGapUSD))).toLocaleString()}</div><div class="lbl">${cashGapUSD > 0 ? '⚠️ Кассовый разрыв' : '💰 Свободные средства'}</div></div>
      <div class="stat-card stat-profit"><div class="num">֏${Math.round(bankAMD).toLocaleString()}</div><div class="lbl">🏦 Счета (AMD)</div></div>
      <div class="stat-card ${netBalanceAMD >= 0 ? 'stat-success' : 'stat-danger'}"><div class="num">֏${Math.round(netBalanceAMD).toLocaleString()}</div><div class="lbl">💎 Чистый баланс</div></div>
      <div class="stat-card stat-warning"><div class="num">֏${Math.round(usdToAMD(waitingFromClientsUSD)).toLocaleString()}</div><div class="lbl">🕐 Ждём от клиентов</div></div>
      <div class="stat-card stat-warning"><div class="num">֏${Math.round(usdToAMD(waitingToCarriersUSD)).toLocaleString()}</div><div class="lbl">🕐 Должны перевозчикам</div></div>
    `;
    document.getElementById('statsRow').innerHTML = statsHTML;
    
    // Логисты в AMD
    const lm = {};
    cargo.forEach(c => {
      const l = c.logist || '—';
      if (!lm[l]) lm[l] = { count: 0, turnoverAMD: 0, profitAMD: 0 };
      lm[l].count++;
      const clientAMD = usdToAMD(convertToUSD(parseFloat(c.client_price || 0), c.currency || 'USD'));
      const carrierAMD = usdToAMD(convertToUSD(parseFloat(c.carrier_price || 0), c.currency || 'USD'));
      lm[l].turnoverAMD += clientAMD;
      lm[l].profitAMD += (clientAMD - carrierAMD);
    });
    
    document.getElementById('logistTable').innerHTML = Object.entries(lm)
      .sort((a, b) => b[1].profitAMD - a[1].profitAMD)
      .map(([n, d]) => 
        `<tr><td>${esc(n)}</td><td>${d.count}</td><td>֏${Math.round(d.turnoverAMD).toLocaleString()}</td><td class="profit-positive">֏${Math.round(d.profitAMD).toLocaleString()}</td></tr>`
      ).join('');
    
    const sl = { loading:'На загрузке', onroad:'В пути', loaded:'Загружен', completed:'Завершён' };
    const sc = { loading:'status-loading', onroad:'status-onroad', loaded:'status-loaded', completed:'status-completed' };
    document.getElementById('recentTable').innerHTML = cargo.slice(0, 10).map((c, i) => {
      const p = parseFloat(c.client_price || 0) - parseFloat(c.carrier_price || 0);
      const csym = currencySymbol(c.currency || 'USD');
      return `<tr>
        <td>${i+1}</td><td>${esc(c.client_name||'—')}</td><td>${esc(c.carrier_name||'—')}</td><td>${esc(c.product||'—')}</td>
        <td><span class="status-badge ${sc[c.status]||''}">${sl[c.status]||c.status}</span></td>
        <td class="profit-positive">${csym}${p.toLocaleString()}</td><td>${c.currency||'USD'}</td><td>${esc(c.logist||'—')}</td>
      </tr>`;
    }).join('');
    
  } catch (err) {
    document.getElementById('statsRow').innerHTML = '<p>Ошибка загрузки</p>';
  }
}

function esc(s) { return (s||'').replace(/</g,'&lt;'); }

loadBankBalances();
renderBankAccounts();
fetchExchangeRates().then(() => {
  loadUsers();
  loadData();
});
</script>
</body>
</html>
