<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f0f4f5; color: #1E3B42; min-height: 100vh; }

.app-wrapper { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
.top-bar { background: #fff; border-radius: 0 0 20px 20px; padding: .8rem 1.4rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1.2rem; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.brand { display: flex; align-items: center; gap: .6rem; font-weight: 800; font-size: 1rem; color: #1E3B42; text-decoration: none; }
.brand img { height: 32px; }
.btn-logout { margin-left: auto; background: none; border: 1.5px solid #e0eaeb; border-radius: 10px; padding: 6px 14px; color: #8fa8ab; font-size: .78rem; cursor: pointer; font-family: inherit; }
.nav-links { display: flex; gap: 2px; margin-bottom: 1.4rem; padding: 6px; background: rgba(255,255,255,0.7); border-radius: 16px; width: fit-content; border: 1px solid rgba(85,183,189,0.15); flex-wrap: wrap; }
.nav-links a { background: transparent; color: #5a7a80; padding: 8px 14px; border-radius: 12px; text-decoration: none; font-size: 11px; font-weight: 600; transition: background .2s, color .2s; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; text-align: center; line-height: 1.2; }
.nav-links a svg { opacity: 0.6; transition: opacity .2s; }
.nav-links a:hover { background: #E8F6F6; color: #1E7A80; }
.nav-links a:hover svg { opacity: 1; }
.nav-links a.active { background: #55B7BD; color: #fff; font-weight: 600; }
.nav-links a.active svg { opacity: 1; stroke: #fff; }
.nav-links a:active { transform: none !important; }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: .8rem; margin-bottom: 1.2rem; }
.stat-card { background: #fff; border-radius: 14px; padding: 1rem 1.2rem; border: 1.5px solid #e8f4f5; }
.stat-num { font-size: 1.4rem; font-weight: 800; color: #1E7A80; }
.stat-lbl { font-size: .7rem; color: #8fa8ab; margin-top: 2px; text-transform: uppercase; letter-spacing: .3px; }
.stat-card.green .stat-num { color: #2E7D32; }
.stat-card.orange .stat-num { color: #E65100; }

/* Toolbar */
.toolbar { display: flex; gap: .6rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { background: #fff; border: 1.5px solid #e8f4f5; border-radius: 10px; padding: 8px 12px; color: #1E3B42; font-size: .8rem; outline: none; font-family: inherit; }
.toolbar input:focus, .toolbar select:focus { border-color: #55B7BD; }
.action-btn { background: #2E7D32; color: #fff; border: none; border-radius: 24px; padding: 9px 20px; font-size: .82rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: .2s; }
.action-btn:hover { background: #1B5E20; }

/* Table */
.table-wrap { background: #fff; border-radius: 16px; overflow: hidden; border: 1.5px solid #e8f4f5; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; }
th { padding: .7rem 1rem; font-size: .7rem; font-weight: 700; color: #8fa8ab; text-transform: uppercase; letter-spacing: .5px; text-align: left; border-bottom: 1.5px solid #e8f4f5; background: #f8fbfc; }
td { padding: .7rem 1rem; font-size: .82rem; border-bottom: 1px solid #f0f5f5; color: #1E3B42; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f5fbfb; }
.empty-row { text-align: center; padding: 2.5rem; color: #8fa8ab; font-size: .85rem; }

.status-badge { padding: 3px 10px; border-radius: 20px; font-size: .72rem; font-weight: 700; }
.status-sent     { background: #E3F2FD; color: #1565C0; }
.status-transit  { background: #FFF3E0; color: #E65100; }
.status-delivered{ background: #E8F5E9; color: #2E7D32; }

/* Modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; }
.modal.open { display: flex; }
.modal-box { background: #fff; border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,.15); max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 1rem; font-weight: 700; color: #1E7A80; margin-bottom: 1rem; }
.form-group { margin-bottom: .7rem; }
.form-group label { font-size: .72rem; color: #8fa8ab; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; display: block; margin-bottom: 3px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; background: #f8fbfc; border: 1.5px solid #e8f4f5; border-radius: 10px; padding: 9px 12px; color: #1E3B42; font-size: .85rem; outline: none; font-family: inherit; }
.form-group input:focus, .form-group select:focus { border-color: #55B7BD; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.modal-footer { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1rem; }
.btn-secondary { background: #f0f4f5; color: #5a7a80; border: none; border-radius: 12px; padding: 9px 18px; font-size: .82rem; font-weight: 600; cursor: pointer; font-family: inherit; }

@media (max-width: 768px) {
  .stats-row { grid-template-columns: repeat(2,1fr); }
  .toolbar { flex-direction: column; align-items: stretch; }
  .form-row-2 { grid-template-columns: 1fr; }
  table { font-size: .75rem; }
  th, td { padding: .5rem .6rem; }

@media print {
  .top-bar, .nav-links, .toolbar, .file-actions, button, .modal { display: none !important; }
  body { background: white; }
  .pdf-report { display: block !important; }
}

<script src="/js/emoji-remover.js">
document.getElementById('pdfBtn').addEventListener('click', generatePDF);

async function generatePDF() {
  const start = document.getElementById('filterStart').value;
  const end   = document.getElementById('filterEnd').value;

  // Загружаем данные за период
  let url = '/api/dispatches';
  const params = [];
  if (start) params.push('start=' + start);
  if (end)   params.push('end=' + end);
  if (params.length) url += '?' + params.join('&');
  const data = await api(url).catch(() => []);

  if (!data.length) { alert('Нет данных за выбранный период'); return; }

  const curSign = {EUR:'€', USD:'$', AMD:'֏'};
  const statusMap = {sent:'Отправлена', transit:'В пути', delivered:'Доставлена'};
  const fmt = n => Number(n||0).toLocaleString('ru', {maximumFractionDigits:2});

  // Считаем итоги
  const total = data.length;
  const delivered = data.filter(d=>d.status==='delivered').length;
  const revenue = data.reduce((s,d) => s + (parseFloat(d.rate)||0), 0);
  const mainCur = data[0]?.rate_currency || 'EUR';

  // Генерируем HTML для печати
  const rows = data.map((d, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${d.date || ''}</td>
      <td><b>${d.truck_number || ''}</b></td>
      <td>${d.driver_name || ''}</td>
      <td>${d.route_from||''} → ${d.route_to||''}</td>
      <td>${d.cargo || ''}</td>
      <td style="text-align:right"><b>${curSign[d.rate_currency]||'€'}${fmt(d.rate)}</b></td>
      <td>${statusMap[d.status]||d.status}</td>
    </tr>
  `).join('');

  const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Arial, sans-serif; font-size: 11px; color: #1E3B42; margin: 20px; }

  .logo { font-size: 18px; font-weight: 800; color: #55B7BD; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  th { background: #1E3B42; color: white; padding: 8px 6px; text-align: left; font-size: 10px; }
  td { padding: 6px; border-bottom: 1px solid #e8f4f5; }
  tr:nth-child(even) { background: #f8fbfc; }
  .summary { display: flex; gap: 20px; margin-top: 16px; }
  .summary-box { border: 1.5px solid #e8f4f5; border-radius: 8px; padding: 10px 16px; flex: 1; text-align: center; }
  .summary-box .num { font-size: 20px; font-weight: 800; color: #1E7A80; }
  .summary-box .lbl { font-size: 10px; color: #8fa8ab; margin-top: 2px; }
  .footer { margin-top: 30px; border-top: 1px solid #e8f4f5; padding-top: 10px; color: #8fa8ab; font-size: 10px; display: flex; justify-content: space-between; }
  @media print { body { margin: 10px; } }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="logo">GL Logistics LLC</div>
    <h1>Отчёт по диспатчингу — Prom Group LLC</h1>
    <div class="subtitle">Период: ${start || '—'} — ${end || '—'}</div>
  </div>
  <div style="text-align:right; font-size:10px; color:#8fa8ab">
    Дата формирования: ${new Date().toLocaleDateString('ru')}<br>
    VAT: 00521217
  </div>
</div>

<div class="summary">
  <div class="summary-box"><div class="num">${total}</div><div class="lbl">Всего машин</div></div>
  <div class="summary-box"><div class="num">${delivered}</div><div class="lbl">Доставлено</div></div>
  <div class="summary-box"><div class="num">${total - delivered}</div><div class="lbl">В пути / Отправлено</div></div>
  <div class="summary-box"><div class="num">${curSign[mainCur]||'€'}${fmt(revenue)}</div><div class="lbl">Итого к оплате</div></div>
</div>

<br>
<table>
  <thead>
    <tr>
      <th>#</th><th>Дата</th><th>Машина</th><th>Водитель</th><th>Маршрут</th><th>Груз</th><th>Ставка</th><th>Статус</th>
    </tr>
  </thead>
  <tbody>${rows}</tbody>
  <tfoot>
    <tr style="background:#f0f9f9; font-weight:bold">
      <td colspan="6" style="text-align:right; padding:8px">ИТОГО:</td>
      <td style="text-align:right; padding:8px">${curSign[mainCur]||'€'}${fmt(revenue)}</td>
      <td></td>
    </tr>
  </tfoot>
</table>

<div class="footer">
  <span>GL Logistics LLC · Ереван, Армения · +374 93 69 14 74 · gllogistics.org</span>
  <span>Страница 1</span>
</div>
</body>
</html>`;

  // Открываем в новом окне и печатаем
  const win = window.open('', '_blank', 'width=900,height=700');
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 500);
}

</script>

<script>
const WORKER = 'https://gl-api.gltransam.workers.dev';
const SESSION_MAX = 12 * 60 * 60 * 1000;
const user = localStorage.getItem('gl_staff_user');
const loginTime = parseInt(localStorage.getItem('gl_staff_login_time') || '0');
if (!user || !loginTime || (Date.now() - loginTime) > SESSION_MAX) { window.location.replace('/staff.html'); throw new Error(''); }

function api(path, method='GET', body=null) {
  const opts = {method, headers: {'Content-Type':'application/json'}};
  const token = localStorage.getItem('gl_staff_token');
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  return fetch(WORKER + path, opts).then(r => r.json());
}

const fmt = n => Number(n||0).toLocaleString('ru', {maximumFractionDigits:0});
const statusMap = {sent:'Отправлена', transit:'В пути', delivered:'Доставлена'};
const statusClass = {sent:'status-sent', transit:'status-transit', delivered:'status-delivered'};
const curSign = {EUR:'€', USD:'$', AMD:'֏'};

let allData = [], editingId = null;


// Загружаем список машин и водителей из истории
async function loadSuggestions() {
  const all = await api('/api/dispatches?start=2020-01-01&end=2099-12-31').catch(() => []);
  const trucks = [...new Set(all.map(d => d.truck_number).filter(Boolean))].sort();
  const drivers = [...new Set(all.map(d => d.driver_name).filter(Boolean))].sort();
  
  document.getElementById('truckList').innerHTML = trucks.map(t => `<option value="${t}">`).join('');
  document.getElementById('driverList').innerHTML = drivers.map(d => `<option value="${d}">`).join('');
}

async function load() {
  const start = document.getElementById('filterStart').value;
  const end   = document.getElementById('filterEnd').value;
  const status = document.getElementById('filterStatus').value;

  let url = '/api/dispatches';
  const params = [];
  if (start) params.push('start='+start);
  if (end)   params.push('end='+end);
  if (status) params.push('status='+status);
  if (params.length) url += '?' + params.join('&');

  allData = await api(url).catch(() => []);
  render();
}

function render() {
  const tbody = document.getElementById('dispatchTable');
  if (!allData.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-row">Нет записей за выбранный период</td></tr>';
  } else {
    tbody.innerHTML = allData.map((d, i) => `
      <tr>
        <td style="color:#8fa8ab;font-size:.75rem">${i+1}</td>
        <td>${d.date || ''}</td>
        <td style="font-weight:700">${d.truck_number || ''}</td>
        <td>${d.driver_name || ''}</td>
        <td style="font-size:.78rem">${d.route_from||''} → ${d.route_to||''}</td>
        <td style="font-size:.78rem">${d.cargo || ''}</td>
        <td style="font-weight:700;color:#1E7A80">${curSign[d.rate_currency]||'€'}${fmt(d.rate)}</td>
        <td><span class="status-badge ${statusClass[d.status]||'status-sent'}">${statusMap[d.status]||d.status}</span></td>
        <td>
          <div style="display:flex;gap:4px">
            <button onclick="editDispatch(${d.id})" style="background:#f0f9f9;color:#1E7A80;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.75rem">✏️</button>
            <button onclick="deleteDispatch(${d.id})" style="background:#FEF2F2;color:#C62828;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.75rem">✕</button>
          </div>
        </td>
      </tr>`).join('');
  }

  // Статистика
  const total = allData.length;
  const delivered = allData.filter(d=>d.status==='delivered').length;
  const transit = allData.filter(d=>d.status==='transit').length;
  const revenue = allData.reduce((s,d) => s + (parseFloat(d.rate)||0), 0);
  const mainCur = allData[0]?.rate_currency || 'EUR';

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDelivered').textContent = delivered;
  document.getElementById('statTransit').textContent = transit;
  document.getElementById('statRevenue').textContent = (curSign[mainCur]||'€') + fmt(revenue);
}

function openModal(d=null) {
  editingId = d?.id || null;
  document.getElementById('modalTitle').textContent = d ? 'Редактировать запись' : 'Добавить машину';
  document.getElementById('fDate').value = d?.date || new Date().toISOString().slice(0,10);
  document.getElementById('fTruck').value = d?.truck_number || '';
  document.getElementById('fDriver').value = d?.driver_name || '';
  document.getElementById('fClient').value = d?.client || 'Prom Group LLC';
  document.getElementById('fFrom').value = d?.route_from || '';
  document.getElementById('fTo').value = d?.route_to || '';
  document.getElementById('fCargo').value = d?.cargo || '';
  document.getElementById('fRate').value = d?.rate || '';
  document.getElementById('fCurrency').value = d?.rate_currency || 'EUR';
  document.getElementById('fStatus').value = d?.status || 'sent';
  document.getElementById('fNotes').value = d?.notes || '';
  loadSuggestions();
  document.getElementById('dispatchModal').classList.add('open');
}

window.editDispatch = id => openModal(allData.find(d => d.id === id));
window.deleteDispatch = async id => {
  if (!confirm('Удалить запись?')) return;
  await api('/api/dispatches/' + id, 'DELETE');
  load();
};

document.getElementById('addBtn').addEventListener('click', () => openModal());
document.getElementById('cancelBtn').addEventListener('click', () => document.getElementById('dispatchModal').classList.remove('open'));
document.getElementById('logoutBtn').addEventListener('click', () => {
  ['gl_staff_user','gl_staff_login_time','gl_staff_token'].forEach(k=>localStorage.removeItem(k));
  window.location.href = 'staff.html';
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const body = {
    date: document.getElementById('fDate').value,
    truck_number: document.getElementById('fTruck').value,
    driver_name: document.getElementById('fDriver').value,
    client: document.getElementById('fClient').value,
    route_from: document.getElementById('fFrom').value,
    route_to: document.getElementById('fTo').value,
    cargo: document.getElementById('fCargo').value,
    rate: parseFloat(document.getElementById('fRate').value) || 0,
    rate_currency: document.getElementById('fCurrency').value,
    status: document.getElementById('fStatus').value,
    notes: document.getElementById('fNotes').value,
    created_by: user
  };
  if (editingId) await api('/api/dispatches/' + editingId, 'PUT', body);
  else await api('/api/dispatches', 'POST', body);
  document.getElementById('dispatchModal').classList.remove('open');
  load();
});

['filterStart','filterEnd','filterStatus'].forEach(id => document.getElementById(id).addEventListener('change', load));

// Дефолтный период — текущий месяц
const now = new Date();
document.getElementById('filterStart').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
document.getElementById('filterEnd').value = now.toISOString().slice(0,10);

// Навигация по роли
document.addEventListener('DOMContentLoaded', function() {

document.getElementById('pdfBtn').addEventListener('click', generatePDF);

async function generatePDF() {
  const start = document.getElementById('filterStart').value;
  const end   = document.getElementById('filterEnd').value;

  // Загружаем данные за период
  let url = '/api/dispatches';
  const params = [];
  if (start) params.push('start=' + start);
  if (end)   params.push('end=' + end);
  if (params.length) url += '?' + params.join('&');
  const data = await api(url).catch(() => []);

  if (!data.length) { alert('Нет данных за выбранный период'); return; }

  const curSign = {EUR:'€', USD:'$', AMD:'֏'};
  const statusMap = {sent:'Отправлена', transit:'В пути', delivered:'Доставлена'};
  const fmt = n => Number(n||0).toLocaleString('ru', {maximumFractionDigits:2});

  // Считаем итоги
  const total = data.length;

  const revenue = data.reduce((s,d) => s + (parseFloat(d.rate)||0), 0);
  const mainCur = data[0]?.rate_currency || 'EUR';

  // Генерируем HTML для печати
  const rows = data.map((d, i) => `
    <tr>

      <td>${d.cargo || ''}</td>
      <td style="text-align:right"><b>${curSign[d.rate_currency]||'€'}${fmt(d.rate)}</b></td>
      <td>${statusMap[d.status]||d.status}</td>
    </tr>
  `).join('');

  const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Arial, sans-serif; font-size: 11px; color: #1E3B42; margin: 20px; }

  .summary-box .num { font-size: 20px; font-weight: 800; color: #1E7A80; }
  .summary-box .lbl { font-size: 10px; color: #8fa8ab; margin-top: 2px; }
  .footer { margin-top: 30px; border-top: 1px solid #e8f4f5; padding-top: 10px; color: #8fa8ab; font-size: 10px; display: flex; justify-content: space-between; }
  @media print { body { margin: 10px; } }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="logo">GL Logistics LLC</div>

  </div>
</div>

<div class="summary">
  <div class="summary-box"><div class="num">${total}</div><div class="lbl">Всего машин</div></div>
  <div class="summary-box"><div class="num">${delivered}</div><div class="lbl">Доставлено</div></div>
  <div class="summary-box"><div class="num">${total - delivered}</div><div class="lbl">В пути / Отправлено</div></div>
  <div class="summary-box"><div class="num">${curSign[mainCur]||'€'}${fmt(revenue)}</div><div class="lbl">Итого к оплате</div></div>
</div>

<br>

      <th>#</th><th>Дата</th><th>Машина</th><th>Водитель</th><th>Маршрут</th><th>Груз</th><th>Ставка</th><th>Статус</th>
    </tr>

  <tbody>${rows}</tbody>
  <tfoot>
    <tr style="background:#f0f9f9; font-weight:bold">
      <td colspan="6" style="text-align:right; padding:8px">ИТОГО:</td>

  // Открываем в новом окне и печатаем
