# Еженедельное обновление цен на дизель для калькулятора ТракКост (EC Weekly Oil Bulletin выходит по понедельникам)
name: Diesel prices
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-diesel.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add diesel.json truckcost.html
          git diff --cached --quiet || (git commit -m "TruckCost: diesel prices $(jq -r .date diesel.json)" && git push)
