<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://gl-api.gltransam.workers.dev; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="GL Logistics — управление сделками для персонала.">
  <title>GL Logistics | Сделки</title>
  <link rel="icon" type="image/png" href="images/GL_LOGISTICs_line_-09.jpg.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #EDF4F4; font-family: 'Inter', sans-serif; padding: 1.5rem; color: #1a1a1a; min-height: 100vh; }
    .app-wrapper { max-width: 1600px; margin: 0 auto; }

    .top-bar { background: #FFFFFF; border-radius: 16px; padding: 0.65rem 1.8rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; border: none; box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 4px 16px rgba(30,59,66,0.06); }
    .top-bar .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1rem; text-decoration: none; color: #0D1F23; letter-spacing: -0.2px; }
    .top-bar .brand img { height: 32px; width: auto; }
    .btn-logout { background: #F5FAFA; color: #1E3B42; border: 1.5px solid rgba(85,183,189,0.3); border-radius: 10px; padding: 7px 18px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: all 0.18s; }
    .btn-logout:hover { background: #E0F4F5; border-color: #55B7BD; color: #1E7A80; }
    .user-info { font-size: 0.82rem; color: #55B7BD; font-weight: 600; }
    .admin-badge { background: #55B7BD; color: #0D1F23; padding: 3px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; }

    .nav-links { display: flex; gap: 4px; margin-bottom: 1.4rem; flex-wrap: wrap; padding: 4px; background: rgba(255,255,255,0.7); border-radius: 14px; width: fit-content; border: 1px solid rgba(85,183,189,0.15); }
    .nav-links a { background: transparent; color: #5a7a80; padding: 8px 18px; border-radius: 11px; text-decoration: none; font-size: 0.8rem; font-weight: 600; border: none; transition: all 0.16s; }
    .nav-links a:hover { background: #E8F6F6; color: #1E7A80; }
    .nav-links a.active { background: #55B7BD; color: #fff; font-weight: 700; box-shadow: 0 2px 8px rgba(85,183,189,0.4); }

    .filter-bar { background: #fff; border-radius: 14px; padding: 10px 16px; margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; border: 1px solid rgba(85,183,189,0.15); box-shadow: 0 1px 4px rgba(30,59,66,0.04); font-size: 0.8rem; color: #5a7a80; font-weight: 600; }
    .filter-bar input[type="date"] { background: #F5FAFA; border: 1px solid rgba(85,183,189,0.25); border-radius: 9px; padding: 6px 10px; font-size: 0.8rem; color: #1E3B42; outline: none; cursor: pointer; transition: border-color 0.15s; }
    .filter-bar input[type="date"]:focus { border-color: #55B7BD; box-shadow: 0 0 0 3px rgba(85,183,189,0.1); }
    .filter-bar select { background: #F5FAFA; border: 1px solid rgba(85,183,189,0.25); border-radius: 9px; padding: 6px 10px; font-size: 0.8rem; color: #1E3B42; outline: none; min-width: 120px; cursor: pointer; transition: border-color 0.15s; }
    .filter-bar select:focus { border-color: #55B7BD; box-shadow: 0 0 0 3px rgba(85,183,189,0.1); }
    .btn-reset { background: #F5FAFA; color: #5a7a80; border: 1px solid rgba(85,183,189,0.2); border-radius: 9px; padding: 6px 14px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .btn-reset:hover { background: #E0F4F5; color: #1E7A80; border-color: #55B7BD; }

    .stats-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; }
    .stat-card { background: #fff; border-radius: 16px; padding: 12px 16px; border: 1.5px solid rgba(85,183,189,0.18); flex: 1; min-width: 120px; box-shadow: 0 1px 4px rgba(30,59,66,0.04); transition: transform 0.15s, box-shadow 0.15s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(30,59,66,0.09); }
    .stat-card .num { font-size: 1.35rem; font-weight: 900; color: #55B7BD; letter-spacing: -0.5px; }
    .stat-card .lbl { font-size: 0.6rem; font-weight: 700; color: #8fa8ab; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
    .stat-profit .num { color: #1B5E20; } .stat-profit { background: linear-gradient(135deg,#e8f5e9,#f8fff8); border-color: rgba(46,125,50,0.25); }
    .stat-success .num { color: #145A2E; } .stat-success { background: linear-gradient(135deg,#e0f7e9,#f5fff8); border-color: rgba(27,122,62,0.25); }
    .stat-warning .num { color: #BF360C; } .stat-warning { background: linear-gradient(135deg,#fff3e0,#fffdf8); border-color: rgba(230,81,0,0.2); }
    .stat-danger .num { color: #B71C1C; } .stat-danger { background: linear-gradient(135deg,#ffebee,#fff8f8); border-color: rgba(198,40,40,0.25); }

    #formTitle { font-size: 1rem; font-weight: 800; color: #1E3B42; margin-bottom: 1rem; padding-bottom: 10px; border-bottom: 2px solid rgba(85,183,189,0.2); letter-spacing: -0.2px; }
    #addForm { background: #fff; border-radius: 16px; border: 1.5px solid rgba(85,183,189,0.2); box-shadow: 0 2px 16px rgba(30,59,66,0.06); padding: 1.4rem 1.6rem; margin-bottom: 1.2rem; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; margin-bottom: 12px; }
    .form-row > div { display: flex; flex-direction: column; gap: 5px; }
    .form-row label { font-size: 0.72rem; font-weight: 700; color: #5a7a80; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-row input[type="text"], .form-row input[type="number"], .form-row input[type="date"], .form-row select,
    #addForm input[type="text"], #addForm input[type="number"], #addForm input[type="date"], #addForm select {
      background: #F5FAFA; border: 1.5px solid rgba(85,183,189,0.22); border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 500; color: #1E3B42; outline: none; transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
    }
    #addForm input:focus, #addForm select:focus { border-color: #55B7BD; background: #fff; box-shadow: 0 0 0 3px rgba(85,183,189,0.12); }
    .price-group { display: flex; gap: 6px; align-items: center; }
    .price-group input { flex: 1; }
    .price-group select { width: 60px !important; flex-shrink: 0; padding: 8px 6px !important; text-align: center; font-weight: 700 !important; color: #1E7A80 !important; }
    .commission-auto { background: #EDF9F9 !important; border-color: rgba(85,183,189,0.35) !important; color: #1E7A80 !important; font-weight: 700 !important; cursor: default; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #F5FAFA; border-radius: 10px; border: 1px solid rgba(85,183,189,0.18); cursor: pointer; transition: background 0.15s; user-select: none; }
    .checkbox-row:hover { background: #E8F6F6; }
    .checkbox-row input[type="checkbox"] { width: 16px !important; height: 16px !important; accent-color: #55B7BD; cursor: pointer; flex-shrink: 0; padding: 0 !important; border-radius: 4px !important; }
    .checkbox-row label { font-size: 0.82rem !important; font-weight: 600 !important; color: #1E3B42 !important; text-transform: none !important; letter-spacing: 0 !important; cursor: pointer; }
    #paymentCheckboxes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    #paymentCheckboxes > div { flex: 1; min-width: 180px; }
    .btn-save { background: #55B7BD; color: #0D1F23; border: none; padding: 10px 24px; border-radius: 11px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s, transform 0.1s; box-shadow: 0 3px 10px rgba(85,183,189,0.3); }
    .btn-save:hover { opacity: 0.88; transform: scale(0.98); }
    .btn-cancel { background: #F5FAFA; color: #5a7a80; border: 1.5px solid rgba(85,183,189,0.25); padding: 10px 20px; border-radius: 11px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-left: 8px; transition: all 0.15s; }
    .btn-cancel:hover { background: #E0F4F5; color: #1E7A80; border-color: #55B7BD; }
    .btn-new { background: #55B7BD; color: #0D1F23; border: none; padding: 10px 22px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; margin-bottom: 1rem; box-shadow: 0 3px 10px rgba(85,183,189,0.3); transition: opacity 0.15s, transform 0.1s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-new:hover { opacity: 0.88; transform: scale(0.98); }
    #emptyMsg { text-align: center; padding: 2rem; color: #8fa8ab; font-size: 0.9rem; font-weight: 500; }

    .table-wrap { background: #FFFFFF; border-radius: 16px; border: 1px solid rgba(85,183,189,0.12); box-shadow: 0 1px 8px rgba(30,59,66,0.04); overflow: hidden; margin-bottom: 1.5rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { color: #8fa8ab; text-align: left; font-size: 0.6rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 11px 10px; background: #F7FBFB; border-bottom: 1px solid rgba(85,183,189,0.12); white-space: nowrap; }
    td { padding: 10px 10px; color: #2a4a50; border-bottom: 1px solid rgba(85,183,189,0.07); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: rgba(85,183,189,0.02); }
    tr:hover td { background: #F0F9F9; }
    .profit-positive { color: #1a6b3c; font-weight: 700; }
    .status-badge { padding: 3px 9px; border-radius: 6px; font-size: 0.62rem; font-weight: 700; display: inline-block; white-space: nowrap; }
    .status-loading { background: #FFFBEB; color: #D97706; border: 1px solid #FDE68A; }
    .status-onroad { background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; }
    .status-loaded { background: #F0FDFA; color: #0D9488; border: 1px solid #99F6E4; }
    .status-completed { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
    .btn-pay { background: #55B7BD; color: #0D1F23; border: none; padding: 4px 9px; border-radius: 7px; font-size: 0.68rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
    .btn-pay:hover { opacity: 0.8; }
    .btn-pay.paid { background: #D1FAE5; color: #065F46; }
    .btn-edit { background: none; border: none; cursor: pointer; font-size: 1rem; color: #8fa8ab; transition: color 0.15s; }
    .btn-edit:hover { color: #55B7BD; }
    .btn-del { background: none; border: none; cursor: pointer; font-size: 1rem; color: #8fa8ab; transition: color 0.15s; }
    .btn-del:hover { color: #ef4444; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(85,183,189,0.35); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(85,183,189,0.6); }

    /* ── МОБИЛЬНАЯ ВЕРСИЯ ── */
    @media (max-width: 768px) {
      body { padding: 0.6rem; }
      .app-wrapper { padding: 0; }
      .top-bar { padding: 0.5rem 0.8rem; border-radius: 12px; margin-bottom: 0.6rem; }
      .top-bar .brand span { display: none; }
      .nav-links { flex-wrap: wrap; gap: 3px; margin-bottom: 0.8rem; }
      .nav-links a { padding: 6px 10px; font-size: 0.72rem; }
      .filter-bar { flex-direction: column; gap: 0.5rem; padding: 0.7rem; }
      .filter-bar label { display: none; }
      .filter-bar input[type="date"],
      .filter-bar select,
      #searchInput { width: 100%; font-size: 0.85rem; }
      .stats-row { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 0.8rem; }
      .stat-card { padding: 10px 12px; }
      .stat-card .val { font-size: 1rem; }
      /* Таблица → карточки на мобиле */
      .table-wrap { overflow: visible; background: transparent; border: none; box-shadow: none; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tbody tr {
        background: #fff;
        border-radius: 14px;
        border: 1px solid rgba(85,183,189,0.15);
        margin-bottom: 0.7rem;
        padding: 0.8rem;
        box-shadow: 0 1px 6px rgba(30,59,66,0.06);
      }
      tbody tr td {
        padding: 3px 0;
        border: none;
        font-size: 0.82rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #1E3B42;
      }
      tbody tr td::before {
        content: attr(data-label);
        font-size: 0.65rem;
        font-weight: 700;
        color: #8fa8ab;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        min-width: 90px;
      }
      tbody tr td:empty { display: none; }
      /* Кнопки действий */
      tbody tr td:last-child { justify-content: flex-end; gap: 8px; padding-top: 8px; border-top: 1px solid rgba(85,183,189,0.1); margin-top: 6px; }
      tbody tr td:last-child::before { display: none; }
      .btn-edit, .btn-del { font-size: 1.2rem; padding: 4px; }
      /* Форма добавления */
      .form-row { grid-template-columns: 1fr !important; }
      #dealModal .modal-content { margin: 0.5rem; border-radius: 14px; max-height: 95vh; }
    }

    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .filter-bar > div { display: flex; gap: 6px; flex-wrap: wrap; }
      #exportExcelBtn, #newDealBtn { width: 100%; justify-content: center; }
    }
  </style>
<style>
.dropzone{border:2px dashed rgba(85,183,189,.4);border-radius:12px;padding:1rem;text-align:center;cursor:pointer;transition:.2s;background:#F5FAFA;position:relative}
.dropzone:hover,.dropzone.drag-over{border-color:#55B7BD;background:#E8F6F6}
.dropzone.drag-over{border-style:solid}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dropzone-label{font-size:.78rem;color:#8fa8ab;pointer-events:none}
.dropzone-label .dz-icon{font-size:1.5rem;display:block;margin-bottom:4px}
.dropzone-label strong{color:#1E7A80}
.dropzone-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dropzone-chip{background:#E0F4F5;color:#1E3B42;border-radius:6px;padding:3px 8px;font-size:.72rem;display:flex;align-items:center;gap:4px}
.dropzone-chip button{background:none;border:none;cursor:pointer;color:#C62828;font-size:.8rem;padding:0;line-height:1}
</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#55B7BD">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<div class="app-wrapper">
  <div class="top-bar">
    <a href="/" class="brand"><img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL"><span>GL Logistics • Сделки</span></a>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="user-info" id="userInfo"></span>
      <span class="admin-badge" id="adminBadge" style="display:none;">ADMIN</span>
      <button class="btn-logout" id="logoutBtn">Выйти</button>
    </div>
  </div>
  <div class="nav-links" id="navLinks"></div>
  <div class="filter-bar">
    <label>📅 Период:</label>
    <input type="date" id="filterStart">
    <span>—</span>
    <input type="date" id="filterEnd">
    <label style="margin-left:12px;">👤 Логист:</label>
    <select id="filterLogist"><option value="all">Все</option></select>
    <label style="margin-left:12px;">💳 Оплата:</label>
    <select id="filterPayment">
      <option value="all">Все</option>
      <option value="client_pending">Ждём от клиента</option>
      <option value="client_paid">Клиент оплатил</option>
      <option value="carrier_pending">Ждём перевозчику</option>
      <option value="carrier_paid">Перевозчику оплачено</option>
      <option value="gap">Кассовый разрыв</option>
    </select>
    <input type="text" id="searchInput" placeholder="🔍 Поиск..." style="margin-left:12px;padding:6px 10px;border-radius:8px;border:1px solid #2a4a50;background:#0A1F25;color:#fff;width:160px;font-size:0.8rem;">
    <button id="resetFilterBtn" class="btn-reset">✕ Сбросить</button>
    <button id="exportExcelBtn" class="btn-reset" style="background:#1E7A80;color:#fff;margin-left:6px;">📊 Excel</button>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <button class="btn-new" id="newDealBtn">+ Новая сделка</button>
  <div id="addForm" style="display:none;">
    <h3 id="formTitle">Новая сделка</h3>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div><label>Клиент *</label><input type="text" id="fClient" list="clientList"><datalist id="clientList"></datalist></div>
      <div>
        <label>Перевозчик *</label>
        <input type="text" id="fCarrier" list="carrierList"><datalist id="carrierList"></datalist>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button type="button" id="btnCarrierAM" onclick="setCarrierType('AM')" style="flex:1;padding:5px;border-radius:8px;border:1.5px solid #55B7BD;background:#55B7BD;color:#fff;font-size:.75rem;font-weight:700;cursor:pointer">🇦🇲 Армянский</button>
          <button type="button" id="btnCarrierFR" onclick="setCarrierType('FR')" style="flex:1;padding:5px;border-radius:8px;border:1.5px solid rgba(85,183,189,.3);background:#F5FAFA;color:#5a7a80;font-size:.75rem;font-weight:700;cursor:pointer">🌍 Иностранный</button>
        </div>
        <input type="hidden" id="fCarrierType" value="AM">
      </div>
      <div><label>Товар *</label><input type="text" id="fProduct"></div>
      <div><label>Город загрузки</label><input type="text" id="fCityLoad" placeholder="Москва"></div>
    </div>
    <div class="form-row">
      <div><label>Страна загрузки</label><input type="text" id="fCountryLoad" placeholder="Россия"></div>
      <div><label>Город выгрузки</label><input type="text" id="fCityUnload" placeholder="Ереван"></div>
      <div><label>Страна выгрузки</label><input type="text" id="fCountryUnload" placeholder="Армения"></div>
    </div>
    <div class="form-row">
      <div><label>Дата загрузки</label><input type="date" id="fLoadDate"></div>
      <div><label>Дата выгрузки</label><input type="date" id="fUnloadDate"></div>
      <div><label>Статус</label><select id="fStatus"><option value="loading">На загрузке</option><option value="onroad">В пути</option><option value="loaded">Загружен</option><option value="completed">Завершён</option></select></div>
    </div>
    <div class="form-row">
      <div>
        <label>Цена клиента</label>
        <div class="price-group">
          <input type="number" id="fClientPrice">
          <select id="fClientCurrency">
            <option value="USD">$</option>
            <option value="EUR">€</option>
            <option value="AMD">֏</option>
          </select>
        </div>
      </div>
      <div>
        <label>Цена перевозчика</label>
        <div class="price-group">
          <input type="number" id="fCarrierPrice">
          <select id="fCarrierCurrency">
            <option value="USD">$</option>
            <option value="EUR">€</option>
            <option value="AMD">֏</option>
          </select>
        </div>
      </div>
      <div><label>Прибыль (AMD)</label><input type="text" id="fCommission" readonly class="commission-auto"></div>
      <div><label>Логист</label><input type="text" id="fLogist"></div>
    </div>
    <div id="paymentCheckboxes" style="display:none;">
      <div><div class="checkbox-row"><input type="checkbox" id="fClientPaid"> <label>✅ Клиент оплатил</label></div></div>
      <div><div class="checkbox-row"><input type="checkbox" id="fCarrierPaid"> <label>✅ Перевозчику оплачено</label></div></div>
    </div>

    <!-- Дополнительные перевозчики (сегменты) -->
    <div id="segmentsBlock" style="display:none;margin-top:10px;border-top:1px solid rgba(85,183,189,.2);padding-top:10px">
      <div style="font-size:.72rem;font-weight:700;color:#1E7A80;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">🔀 Дополнительные перевозчики</div>
      <div id="segmentsList"></div>
      <button type="button" id="addSegmentBtn" style="background:#F0F9F9;color:#1E7A80;border:1.5px dashed rgba(85,183,189,.4);border-radius:8px;padding:5px 14px;cursor:pointer;font-size:.75rem;font-weight:700;width:100%;margin-top:6px">+ Добавить перевозчика</button>
    </div>
    <div style="margin-top:6px">
      <button type="button" id="toggleSegmentsBtn" style="background:none;border:none;color:#55B7BD;font-size:.75rem;cursor:pointer;font-weight:600;padding:2px 0">🔀 Добавить второго перевозчика (мультисегмент)</button>
