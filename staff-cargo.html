<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; connect-src *; img-src * data: blob:; font-src * data:">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GL Logistics | Сделки</title>
  <link rel="icon" type="image/png" href="images/GL_LOGISTICs_line_-09.jpg.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F5FAFA; font-family: 'Inter', sans-serif; padding: 1.5rem; color: #1a1a1a; min-height: 100vh; }
    .app-wrapper { max-width: 1600px; margin: 0 auto; }
    .top-bar { background: #FFFFFF; border-radius: 60px; padding: 0.7rem 2rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; border: 1px solid rgba(85,183,189,0.25); }
    .top-bar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.95rem; text-decoration: none; color: #1a1a1a; }
    .top-bar .brand img { height: 40px; width: auto; }
    .btn-logout { background: #1E3B42; border: none; color: white; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: 600; }
    .user-info { font-size: 0.85rem; color: #55B7BD; font-weight: 600; }
    .admin-badge { background: #55B7BD; color: #0D1F23; padding: 3px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: 700; margin-left: 6px; }
    .nav-links { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .nav-links a { background: #FFFFFF; color: #55B7BD; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(85,183,189,0.25); }
    .nav-links a.active, .nav-links a:hover { background: #55B7BD; color: #0D1F23; }
    .filter-bar { background: #FFFFFF; border-radius: 16px; padding: 12px 16px; margin-bottom: 1rem; border: 1px solid rgba(85,183,189,0.2); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .filter-bar label { font-size: 0.7rem; color: #55B7BD; font-weight: 600; }
    .filter-bar input, .filter-bar select { background: #F5FAFA; border: 1px solid rgba(85,183,189,0.25); border-radius: 10px; padding: 6px 10px; font-size: 0.8rem; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1rem; }
    .stat-card { background: #FFFFFF; border-radius: 16px; padding: 1rem; border: 1px solid rgba(85,183,189,0.2); text-align: center; }
    .stat-card .num { font-size: 1.5rem; font-weight: 800; color: #55B7BD; }
    .stat-card .lbl { font-size: 0.6rem; color: #8fa8ab; text-transform: uppercase; }
    .stat-profit { background: #EDF7F7; } .stat-profit .num { color: #3d9aa0; }
    .stat-warning { background: #FFF3E0; } .stat-warning .num { color: #E65100; }
    .stat-danger { background: #FFEBEE; } .stat-danger .num { color: #C62828; }
    .stat-success { background: #E8F5E9; } .stat-success .num { color: #2E7D32; }
    .btn-add { background: #55B7BD; color: #0D1F23; border: none; padding: 10px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; margin-bottom: 1rem; }
    .form-add { background: #FFFFFF; border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem; display: none; border: 1px solid rgba(85,183,189,0.25); }
    .form-add.active { display: block; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .form-row label { font-size: 0.6rem; color: #55B7BD; text-transform: uppercase; display: block; margin-bottom: 3px; font-weight: 700; }
    .form-row input, .form-row select { width: 100%; background: #F5FAFA; border: 1px solid rgba(85,183,189,0.25); border-radius: 16px; padding: 8px 12px; color: #1a1a1a; font-size: 0.85rem; outline: none; }
    .price-group { display: flex; gap: 6px; align-items: center; }
    .price-group input { flex: 1; }
    .price-group select { width: 80px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .checkbox-row input[type="checkbox"] { width: auto; cursor: pointer; }
    .checkbox-row label { font-size: 0.75rem; color: #2d3a3d; cursor: pointer; }
    .drop-zone { border: 2px dashed rgba(85,183,189,0.35); border-radius: 16px; padding: 15px; text-align: center; color: #8fa8ab; font-size: 0.75rem; cursor: pointer; background: #F5FAFA; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    .drop-zone.has-file { border-style: solid; border-color: #55B7BD; background: #E8F5F5; color: #3d9aa0; }
    .btn-save { background: #55B7BD; color: #0D1F23; border: none; padding: 10px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; margin-right: 8px; }
    .btn-cancel { background: #DDE8E9; color: #2d3a3d; border: none; padding: 10px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; }
    .table-wrap { background: #FFFFFF; border-radius: 20px; padding: 1rem; border: 1px solid rgba(85,183,189,0.2); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th { color: #55B7BD; text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(85,183,189,0.2); font-size: 0.6rem; text-transform: uppercase; background: #F5FAFA; }
    td { padding: 6px; border-bottom: 1px solid #EEF4F4; color: #2d3a3d; }
    .status-badge { padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; display: inline-block; }
    .status-loading { background: #FFF3E0; color: #E65100; }
    .status-onroad { background: #E3F2FD; color: #1565C0; }
    .status-loaded { background: #E8F5F5; color: #3d9aa0; }
    .status-completed { background: #EDE7F6; color: #4527A0; }
    .profit-positive { color: #3d9aa0; font-weight: 700; }
    .btn-del { background: none; border: none; color: #C62828; cursor: pointer; font-size: 0.7rem; padding: 4px 6px; }
    .btn-edit { background: none; border: none; color: #55B7BD; cursor: pointer; font-size: 0.7rem; padding: 4px 6px; margin-right: 2px; }
    .btn-toggle-paid { background: none; border: 1px solid #55B7BD; color: #55B7BD; cursor: pointer; font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; margin: 0 2px; }
    .btn-toggle-paid.active { background: #55B7BD; color: white; }
    .commission-auto { background: #EDF7F7 !important; color: #3d9aa0 !important; font-weight: 700; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <a href="/" class="brand"><img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL"><span>GL Logistics • Сделки</span></a>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="user-info" id="userInfo"></span>
      <span class="admin-badge" id="adminBadge" style="display:none;">ADMIN</span>
      <button class="btn-logout" onclick="doLogout()">Выйти</button>
    </div>
  </div>
  <div class="nav-links" id="navLinks"></div>
  <div class="filter-bar">
    <label>📅 Период:</label>
    <input type="date" id="filterStart" onchange="renderAll()">
    <span>—</span>
    <input type="date" id="filterEnd" onchange="renderAll()">
    <label style="margin-left:12px;">👤 Логист:</label>
    <select id="filterLogist" onchange="renderAll()"><option value="all">Все</option></select>
    <label style="margin-left:12px;">💳 Оплата:</label>
    <select id="filterPayment" onchange="renderAll()">
      <option value="all">Все</option>
      <option value="client_pending">Ждём от клиента</option>
      <option value="client_paid">Клиент оплатил</option>
      <option value="carrier_pending">Ждём перевозчику</option>
      <option value="carrier_paid">Перевозчику оплачено</option>
      <option value="gap">Кассовый разрыв</option>
    </select>
    <button onclick="clearFilter()" style="background:#DDE8E9;border:none;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:0.75rem;">✕ Сбросить</button>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <button class="btn-add" onclick="toggleForm()">+ Новая сделка</button>
  <div class="form-add" id="addForm">
    <h3 style="color:#55B7BD;margin-bottom:12px;" id="formTitle">Новая сделка</h3>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div><label>Клиент *</label><input type="text" id="fClient" list="clientList"><datalist id="clientList"></datalist></div>
      <div><label>Перевозчик *</label><input type="text" id="fCarrier" list="carrierList"><datalist id="carrierList"></datalist></div>
      <div><label>Товар *</label><input type="text" id="fProduct"></div>
      <div><label>Город загрузки</label><input type="text" id="fCityLoad" placeholder="Москва"></div>
    </div>
    <div class="form-row">
      <div><label>Страна загрузки</label><input type="text" id="fCountryLoad" placeholder="Россия"></div>
      <div><label>Город выгрузки</label><input type="text" id="fCityUnload" placeholder="Ереван"></div>
      <div><label>Страна выгрузки</label><input type="text" id="fCountryUnload" placeholder="Армения"></div>
    </div>
    <div class="form-row">
      <div><label>Дата загрузки</label><input type="date" id="fLoadDate"></div>
      <div><label>Дата выгрузки</label><input type="date" id="fUnloadDate"></div>
      <div><label>Статус</label><select id="fStatus"><option value="loading">На загрузке</option><option value="onroad">В пути</option><option value="loaded">Загружен</option><option value="completed">Завершён</option></select></div>
    </div>
    <div class="form-row">
      <div>
        <label>Цена клиента</label>
        <div class="price-group">
          <input type="number" id="fClientPrice" oninput="calcCommission()">
          <select id="fClientCurrency" onchange="calcCommission()">
            <option value="USD">$</option>
            <option value="EUR">€</option>
            <option value="AMD">֏</option>
          </select>
        </div>
      </div>
      <div>
        <label>Цена перевозчика</label>
        <div class="price-group">
          <input type="number" id="fCarrierPrice" oninput="calcCommission()">
          <select id="fCarrierCurrency" onchange="calcCommission()">
            <option value="USD">$</option>
            <option value="EUR">€</option>
            <option value="AMD">֏</option>
          </select>
        </div>
      </div>
      <div><label>Прибыль (AMD)</label><input type="text" id="fCommission" readonly class="commission-auto"></div>
      <div><label>Логист</label><input type="text" id="fLogist"></div>
    </div>
    <div class="form-row" id="paymentCheckboxes" style="display:none;">
      <div><div class="checkbox-row"><input type="checkbox" id="fClientPaid"> <label>✅ Клиент оплатил</label></div></div>
      <div><div class="checkbox-row"><input type="checkbox" id="fCarrierPaid"> <label>✅ Перевозчику оплачено</label></div></div>
    </div>
    <div class="form-row">
      <div><label>Инвойс клиенту</label><div class="drop-zone" id="dropClient" onclick="document.getElementById('fInvoiceClient').click()">📁 Перетащите файл</div><input type="file" id="fInvoiceClient" accept=".pdf,.jpg,.jpeg,.png" style="display:none;" onchange="handleFileSelect(this, 'dropClient')"></div>
      <div><label>Инвойс от перевозчика</label><div class="drop-zone" id="dropCarrier" onclick="document.getElementById('fInvoiceCarrier').click()">📁 Перетащите файл</div><input type="file" id="fInvoiceCarrier" accept=".pdf,.jpg,.jpeg,.png" style="display:none;" onchange="handleFileSelect(this, 'dropCarrier')"></div>
    </div>
    <div style="margin-top:10px;">
      <button class="btn-save" onclick="saveCargo()">💾 Сохранить</button>
      <button class="btn-cancel" onclick="toggleForm(false)">Отмена</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Клиент</th><th>Перевозчик</th><th>Товар</th><th>Загрузка</th><th>Выгрузка</th><th>Дата загрузки</th><th>Статус</th><th>Клиент</th><th>Перевоз</th><th>Прибыль (AMD)</th><th>Оплата</th><th>Логист</th><th></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <p style="text-align:center;color:#8fa8ab;padding:20px;" id="emptyMsg">Загрузка...</p>
  </div>
</div>

<script>
const API_URL = 'https://gl-api.gltransam.workers.dev';
const ADMIN_USER = 'TigranMetspagyan';
const user = localStorage.getItem('gl_staff_user');
if (!user) { document.body.innerHTML = '<div style="text-align:center;padding:100px;">Пожалуйста, <a href="staff.html">войдите</a></div>'; }
const isAdmin = user === ADMIN_USER;
document.getElementById('userInfo').textContent = '👤 ' + user;
if (isAdmin) document.getElementById('adminBadge').style.display = 'inline-block';
document.getElementById('navLinks').innerHTML = isAdmin 
  ? '<a href="staff-dashboard.html">📊 Главная</a><a href="staff-cargo.html" class="active">📦 Сделки</a><a href="/rateconfirmation">📋 Заявки</a>'
  : '<a href="staff-cargo.html" class="active">📦 Сделки</a><a href="/rateconfirmation">📋 Заявки</a>';

function doLogout() { localStorage.removeItem('gl_staff_user'); window.location.href = 'staff.html'; }

async function api(path, method='GET', body=null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_URL + path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadCargo() { return api('/api/cargo'); }
async function addCargo(data) { return api('/api/cargo', 'POST', data); }
async function updateCargo(id, data) { return api('/api/cargo/' + id, 'PUT', data); }
async function removeCargo(id) { return api('/api/cargo/' + id, 'DELETE'); }
async function loadClients() { return api('/api/clients'); }
async function addClient(name) { return api('/api/clients', 'POST', { name }); }
async function loadCarriers() { return api('/api/carriers'); }
async function addCarrier(name) { return api('/api/carriers', 'POST', { name }); }

let allCargoData = [], clientsData = [], carriersData = [], exchangeRates = null;

async function fetchExchangeRates() {
  // Сначала проверяем ручные курсы
  const saved = localStorage.getItem('gl_manual_rates');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.AMD && parsed.EUR && parsed.RUB) {
        exchangeRates = parsed;
        console.log('Используем ручные курсы');
        return;
      }
    } catch(e) {}
  }
  // Иначе пробуем API
  try {
    const res = await fetch(API_URL + '/api/rates');
    if (!res.ok) throw new Error('Ошибка получения курсов');
    const data = await res.json();
    exchangeRates = data;
    console.log('Курсы с rate.am');
  } catch (e) {
    console.warn('Не удалось загрузить курсы, резерв');
    exchangeRates = { USD: 1, AMD: 400, EUR: 440, RUB: 4.5, source: 'hardcoded' };
  }
}

function convertToUSD(amount, currency) {
  if (!exchangeRates || !amount) return 0;
  if (currency === 'USD') return amount;
  const rate = exchangeRates[currency]; // сколько AMD за 1 единицу валюты
  if (!rate) return 0;
  if (currency === 'AMD') {
    // AMD → USD: делим на курс AMD
    return amount / exchangeRates.AMD;
  } else {
    // EUR, RUB и др.: переводим в AMD, потом в USD
    const amdEquivalent = amount * rate;
    return amdEquivalent / exchangeRates.AMD;
  }
}

function usdToAMD(usd) {
  return usd * (exchangeRates?.AMD || 400);
}

function currencySymbol(cur) {
  if (cur === 'EUR') return '€'; if (cur === 'AMD') return '֏'; return '$';
}

function calcCommission() {
  const cp = parseFloat(document.getElementById('fClientPrice').value) || 0;
  const crp = parseFloat(document.getElementById('fCarrierPrice').value) || 0;
  const ccur = document.getElementById('fClientCurrency').value;
  const rcur = document.getElementById('fCarrierCurrency').value;
  if (!exchangeRates) return;
  const clientUSD = convertToUSD(cp, ccur);
  const carrierUSD = convertToUSD(crp, rcur);
  const profitAMD = usdToAMD(clientUSD - carrierUSD);
  document.getElementById('fCommission').value = '֏ ' + Math.round(profitAMD).toLocaleString();
}

function populateDatalists() {
  document.getElementById('clientList').innerHTML = clientsData.map(c => `<option value="${esc(c.name)}">`).join('');
  document.getElementById('carrierList').innerHTML = carriersData.map(c => `<option value="${esc(c.name)}">`).join('');
}

function toggleForm(show=true) {
  document.getElementById('addForm').classList.toggle('active', show);
  if (show) {
    document.getElementById('fLogist').value = user;
    document.getElementById('fClientCurrency').value = 'USD';
    document.getElementById('fCarrierCurrency').value = 'USD';
    document.getElementById('formTitle').textContent = 'Новая сделка';
    document.getElementById('editId').value = '';
    document.getElementById('paymentCheckboxes').style.display = isAdmin ? 'block' : 'none';
    ['fClient','fCarrier','fProduct','fCityLoad','fCountryLoad','fCityUnload','fCountryUnload','fLoadDate','fUnloadDate','fClientPrice','fCarrierPrice','fCommission'].forEach(id => document.getElementById(id).value = '');
    ['dropClient','dropCarrier'].forEach(id => { const z = document.getElementById(id); z.classList.remove('has-file'); z.innerHTML = '📁 Перетащите файл'; });
    document.getElementById('fInvoiceClient').value = document.getElementById('fInvoiceCarrier').value = '';
    document.getElementById('fStatus').value = 'loading';
    document.getElementById('fClientPaid').checked = false;
    document.getElementById('fCarrierPaid').checked = false;
  } else document.getElementById('addForm').classList.remove('active');
}

['dropClient','dropCarrier'].forEach(id => {
  const z = document.getElementById(id);
  z.addEventListener('dragover', e => { e.preventDefault(); });
  z.addEventListener('drop', e => {
    e.preventDefault();
    const inp = document.getElementById(id==='dropClient'?'fInvoiceClient':'fInvoiceCarrier');
    inp.files = e.dataTransfer.files;
    handleFileSelect(inp, id);
  });
});

function handleFileSelect(inp, zoneId) {
  if (inp.files.length > 0) {
    document.getElementById(zoneId).classList.add('has-file');
    document.getElementById(zoneId).innerHTML = '✅ ' + inp.files[0].name;
  }
}

async function togglePaid(cargoId, field) {
  if (!isAdmin) return;
  const cargo = allCargoData.find(c => c.id == cargoId);
  if (!cargo) return;
  const current = cargo[field] || false;
  await updateCargo(cargoId, { [field]: !current });
  await refreshData();
}

async function saveCargo() {
  const editId = document.getElementById('editId').value;
  const cn = f('fClient'), crn = f('fCarrier');
  if (!cn || !crn) return alert('Введите клиента и перевозчика');
  try {
    if (!clientsData.find(c => c.name === cn)) { await addClient(cn); clientsData = await loadClients(); }
    if (!carriersData.find(c => c.name === crn)) { await addCarrier(crn); carriersData = await loadCarriers(); }
    let logistToSave = f('fLogist') || user;
    if (editId && !isAdmin) { const orig = allCargoData.find(c => c.id == editId); if (orig) logistToSave = orig.logist; }
    const clientCur = document.getElementById('fClientCurrency').value;
    const carrierCur = document.getElementById('fCarrierCurrency').value;
    const clientPrice = parseFloat(f('fClientPrice')) || 0;
    const carrierPrice = parseFloat(f('fCarrierPrice')) || 0;
    const clientUSD = convertToUSD(clientPrice, clientCur);
    const carrierUSD = convertToUSD(carrierPrice, carrierCur);
    const commissionUSD = clientUSD - carrierUSD;
    const cargo = {
      product: f('fProduct'), city_load: f('fCityLoad'), country_load: f('fCountryLoad'),
      city_unload: f('fCityUnload'), country_unload: f('fCountryUnload'),
      load_date: f('fLoadDate'), unload_date: f('fUnloadDate'), status: f('fStatus'),
      client_price: clientPrice,
      carrier_price: carrierPrice,
      commission: commissionUSD.toFixed(2),
      logist: logistToSave, client_name: cn, carrier_name: crn,
      invoice_client: await fileToBase64('fInvoiceClient') || '',
      invoice_carrier: await fileToBase64('fInvoiceCarrier') || '',
      currency: 'MIX',
      client_currency: clientCur,
      carrier_currency: carrierCur,
      client_paid: isAdmin ? document.getElementById('fClientPaid').checked : false,
      carrier_paid: isAdmin ? document.getElementById('fCarrierPaid').checked : false
    };
    if (!cargo.product) return alert('Введите товар');
    if (editId) await updateCargo(editId, cargo);
    else await addCargo(cargo);
    await refreshData(); toggleForm(false);
  } catch (err) { alert('Ошибка сохранения: ' + err.message); }
}

function fileToBase64(id) {
  const file = document.getElementById(id).files[0];
  if (!file) return Promise.resolve('');
  return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
}
function f(id) { return document.getElementById(id).value.trim(); }

async function editCargo(id) {
  const c = allCargoData.find(x => x.id == id);
  if (!c) return;
  if (!isAdmin && c.logist !== user) return alert('Нет доступа');
  populateDatalists();
  document.getElementById('editId').value = c.id;
  document.getElementById('fClient').value = c.client_name || '';
  document.getElementById('fCarrier').value = c.carrier_name || '';
  document.getElementById('fProduct').value = c.product || '';
  document.getElementById('fCityLoad').value = c.city_load || '';
  document.getElementById('fCountryLoad').value = c.country_load || '';
  document.getElementById('fCityUnload').value = c.city_unload || '';
  document.getElementById('fCountryUnload').value = c.country_unload || '';
  document.getElementById('fLoadDate').value = c.load_date || '';
  document.getElementById('fUnloadDate').value = c.unload_date || '';
  document.getElementById('fStatus').value = c.status || 'loading';
  document.getElementById('fClientPrice').value = c.client_price || '';
  document.getElementById('fCarrierPrice').value = c.carrier_price || '';
  document.getElementById('fClientCurrency').value = c.client_currency || c.currency || 'USD';
  document.getElementById('fCarrierCurrency').value = c.carrier_currency || c.currency || 'USD';
  calcCommission();
  document.getElementById('fLogist').value = c.logist || user;
  if (isAdmin) {
    document.getElementById('paymentCheckboxes').style.display = 'block';
    document.getElementById('fClientPaid').checked = c.client_paid || false;
    document.getElementById('fCarrierPaid').checked = c.carrier_paid || false;
  }
  document.getElementById('formTitle').textContent = 'Редактировать сделку';
  document.getElementById('addForm').classList.add('active');
}

async function deleteCargo(id) {
  if (!isAdmin) { const c = allCargoData.find(x => x.id == id); if (c && c.logist !== user) return alert('Нет доступа'); }
  if (confirm('Удалить?')) { await removeCargo(id); await refreshData(); }
}

function clearFilter() {
  document.getElementById('filterStart').value = document.getElementById('filterEnd').value = '';
  document.getElementById('filterLogist').value = 'all';
  document.getElementById('filterPayment').value = 'all';
  renderAll();
}

async function refreshData() {
  try {
    allCargoData = await loadCargo();
    clientsData = await loadClients();
    carriersData = await loadCarriers();
    populateDatalists();
    if (!exchangeRates) await fetchExchangeRates();
    renderAll();
  } catch (err) { document.getElementById('emptyMsg').textContent = 'Ошибка загрузки.'; }
}

function renderAll() {
  const start = document.getElementById('filterStart').value,
        end = document.getElementById('filterEnd').value,
        fl = document.getElementById('filterLogist').value,
        fp = document.getElementById('filterPayment').value;

  let list = isAdmin ? [...allCargoData] : allCargoData.filter(c => c.logist === user);
  if (start) list = list.filter(c => c.load_date >= start);
  if (end) list = list.filter(c => c.load_date <= end);
  if (isAdmin && fl !== 'all') list = list.filter(c => c.logist === fl);
  if (fp === 'client_pending') list = list.filter(c => !c.client_paid);
  if (fp === 'client_paid') list = list.filter(c => c.client_paid);
  if (fp === 'carrier_pending') list = list.filter(c => !c.carrier_paid);
  if (fp === 'carrier_paid') list = list.filter(c => c.carrier_paid);
  if (fp === 'gap') list = list.filter(c => c.carrier_paid && !c.client_paid);

  if (isAdmin) {
    const logists = [...new Set(allCargoData.map(c => c.logist).filter(Boolean))];
    document.getElementById('filterLogist').innerHTML = '<option value="all">Все</option>' + logists.map(l => `<option value="${l}" ${fl===l?'selected':''}>${l}</option>`).join('');
  }

  let totalProfitAMD = 0, waitingClientsAMD = 0, waitingCarriersAMD = 0, receivedAMD = 0, paidAMD = 0;
  list.forEach(c => {
    const clientCur = c.client_currency || c.currency || 'USD';
    const carrierCur = c.carrier_currency || c.currency || 'USD';
    const clientUSD = convertToUSD(parseFloat(c.client_price||0), clientCur);
    const carrierUSD = convertToUSD(parseFloat(c.carrier_price||0), carrierCur);
    const profitAMD = usdToAMD(clientUSD - carrierUSD);
    totalProfitAMD += profitAMD;
    if (!c.client_paid) waitingClientsAMD += usdToAMD(clientUSD);
    else receivedAMD += usdToAMD(clientUSD);
    if (!c.carrier_paid) waitingCarriersAMD += usdToAMD(carrierUSD);
    else paidAMD += usdToAMD(carrierUSD);
  });
  const cashGapAMD = paidAMD - receivedAMD;

  const statsHTML = `
    <div class="stat-card"><div class="num">${list.length}</div><div class="lbl">Сделок</div></div>
    <div class="stat-card stat-profit"><div class="num">֏${Math.round(totalProfitAMD).toLocaleString()}</div><div class="lbl">Прибыль AMD</div></div>
    ${isAdmin ? `
    <div class="stat-card stat-success"><div class="num">֏${Math.round(receivedAMD).toLocaleString()}</div><div class="lbl">✅ Получено</div></div>
    <div class="stat-card stat-warning"><div class="num">֏${Math.round(paidAMD).toLocaleString()}</div><div class="lbl">📤 Оплачено</div></div>
    <div class="stat-card ${cashGapAMD > 0 ? 'stat-danger' : 'stat-success'}"><div class="num">֏${Math.round(Math.abs(cashGapAMD)).toLocaleString()}</div><div class="lbl">${cashGapAMD > 0 ? '⚠️ Кассовый разрыв' : '💰 Свободные средства'}</div></div>
    <div class="stat-card stat-warning"><div class="num">֏${Math.round(waitingClientsAMD).toLocaleString()}</div><div class="lbl">🕐 Ждём от клиентов</div></div>
    <div class="stat-card stat-warning"><div class="num">֏${Math.round(waitingCarriersAMD).toLocaleString()}</div><div class="lbl">🕐 Должны перевозчикам</div></div>
    ` : ''}
  `;
  document.getElementById('statsRow').innerHTML = statsHTML;

  const sl = { loading:'На загрузке', onroad:'В пути', loaded:'Загружен', completed:'Завершён' };
  const sc = { loading:'status-loading', onroad:'status-onroad', loaded:'status-loaded', completed:'status-completed' };
  document.getElementById('emptyMsg').style.display = list.length ? 'none' : 'block';
  document.getElementById('tableBody').innerHTML = list.map((c, idx) => {
    const clientCur = c.client_currency || c.currency || 'USD';
    const carrierCur = c.carrier_currency || c.currency || 'USD';
    const clientUSD = convertToUSD(parseFloat(c.client_price||0), clientCur);
    const carrierUSD = convertToUSD(parseFloat(c.carrier_price||0), carrierCur);
    const profitAMD = usdToAMD(clientUSD - carrierUSD);
    const load = [c.city_load, c.country_load].filter(Boolean).join(', ') || '-';
    const unload = [c.city_unload, c.country_unload].filter(Boolean).join(', ') || '-';
    let paymentHTML = '';
    if (isAdmin) {
      paymentHTML = `<button class="btn-toggle-paid ${c.client_paid?'active':''}" onclick="togglePaid(${c.id},'client_paid')">📥 ${c.client_paid?'✓':'✗'}</button>
                     <button class="btn-toggle-paid ${c.carrier_paid?'active':''}" onclick="togglePaid(${c.id},'carrier_paid')">📤 ${c.carrier_paid?'✓':'✗'}</button>`;
    }
    return `<tr>
      <td>${idx+1}</td><td>${esc(c.client_name)}</td><td>${esc(c.carrier_name)}</td><td>${esc(c.product)}</td>
      <td>${load}</td><td>${unload}</td><td>${c.load_date||'-'}</td>
      <td><span class="status-badge ${sc[c.status]||''}">${sl[c.status]||c.status}</span></td>
      <td>${currencySymbol(clientCur)}${parseFloat(c.client_price||0).toLocaleString()}</td>
      <td>${currencySymbol(carrierCur)}${parseFloat(c.carrier_price||0).toLocaleString()}</td>
      <td class="profit-positive">֏${Math.round(profitAMD).toLocaleString()}</td>
      <td>${paymentHTML}</td>
      <td>${esc(c.logist)}</td>
      <td><button class="btn-edit" onclick="editCargo(${c.id})">✏️</button> ${isAdmin?`<button class="btn-del" onclick="deleteCargo(${c.id})">🗑️</button>`:''}</td>
    </tr>`;
  }).join('');
}

function esc(s) { return (s||'').replace(/</g,'&lt;'); }

fetchExchangeRates().then(refreshData);
</script>
