<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #EDF4F4; font-family: 'Inter', sans-serif; padding: 1.5rem; color: #1a1a1a; min-height: 100vh; }
.app-wrapper { max-width: 1300px; margin: 0 auto; }
.top-bar { background: #FFFFFF; border-radius: 16px; padding: 0.65rem 1.8rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 4px 16px rgba(30,59,66,0.06); }

.nav-links { display: flex; gap: 4px; margin-bottom: 1.4rem; padding: 4px; background: rgba(255,255,255,0.7); border-radius: 14px; width: fit-content; border: 1px solid rgba(85,183,189,0.15); }

.section-title { color: #8fa8ab; font-size: 0.72rem; font-weight: 800; letter-spacing: 1.2px; margin: 1.8rem 0 0.8rem; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(85,183,189,0.2), transparent); }
.bank-accounts, .rates-block { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
.bank-card, .rate-card { background: #FFFFFF; border-radius: 16px; padding: 1.2rem; border: 1px solid rgba(85,183,189,0.15); box-shadow: 0 1px 4px rgba(30,59,66,0.04); }
.bank-header, .rate-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.bank-currency, .rate-currency { font-size: 0.95rem; font-weight: 800; color: #55B7BD; }

.bank-label { font-size: 0.75rem; color: #8fa8ab; margin-bottom: 8px; }

.btn-save-balance, .btn-save { background: #55B7BD; color: #0D1F23; border: none; padding: 7px 14px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; cursor: pointer; width: 100%; }
.overdraft-label { font-size: 0.72rem; font-weight: 700; color: #E65100; margin-bottom: 4px; display: block; }
.rate-note { font-size: 0.68rem; color: #aac4c7; margin-top: 4px; }
.stats-row { display: grid; gap: 10px; margin-bottom: 10px; }
.stats-row-top { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.stats-row-bottom { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .stats-row-bottom { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
.stat-card { border-radius: 18px; padding: 14px 16px; border: 1.5px solid rgba(85,183,189,0.2); background: #fff; box-shadow: 0 1px 4px rgba(30,59,66,0.04); }
.stat-card .num { font-size: 1.55rem; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
.stat-card .lbl { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 4px; }
.stat-profit { background: linear-gradient(135deg,#e8f5e9,#f1fbf2); border-color: rgba(46,125,50,0.3); } .stat-profit .num { color: #1B5E20; }
.stat-success { background: linear-gradient(135deg,#e0f7e9,#f0fdf4); border-color: rgba(27,122,62,0.3); } .stat-success .num { color: #145A2E; }

.stat-danger { background: linear-gradient(135deg,#ffebee,#fff5f5); border: 2px solid rgba(198,40,40,0.35); } .stat-danger .num { color: #B71C1C; }
.stat-netbal { background: linear-gradient(135deg,#fce4e4,#fff0f0); border: 2px solid rgba(183,28,28,0.4); } .stat-netbal .num { color: #7F0000; }

.status-onroad { background:#EFF6FF; color:#2563EB; border:1px solid #BFDBFE; }
.status-loaded { background:#F0FDFA; color:#0D9488; border:1px solid #99F6E4; }
.status-completed { background:#F0FDF4; color:#16A34A; border:1px solid #BBF7D0; }
.form-add { background:#F9FDFD; border-radius:14px; padding:12px 14px; margin-bottom:1rem; border:1px solid rgba(85,183,189,0.18); display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.form-add input { background:#fff; border:1px solid rgba(85,183,189,0.25); border-radius:10px; padding:8px 12px; font-size:0.83rem; outline:none; flex:1; min-width:150px; color:#1E3B42; }

  @media (max-width: 768px) {
    .app-wrapper { padding-bottom: 2rem; }
    .nav-links { overflow-x: auto; flex-wrap: nowrap; gap: .3rem; padding: .5rem; }

<script>
const WORKER = 'https://gl-api.gltransam.workers.dev';
const SESSION_MAX = 12 * 60 * 60 * 1000;
const user = localStorage.getItem('gl_staff_user');
const loginTime = parseInt(localStorage.getItem('gl_staff_login_time') || '0');
// Проверяем сессию — если нет, редирект на логин
function checkSession() {
  const u = localStorage.getItem('gl_staff_user');
  const t = parseInt(localStorage.getItem('gl_staff_login_time') || '0');
  if (!u || !t || (Date.now() - t) > SESSION_MAX) {
    window.location.replace('/staff.html');
    return false;
  }
  return true;
}
if (!checkSession()) throw new Error('Not authenticated');

const catLabel = {rent:'🏢 Аренда', salary:'👷 Зарплаты', service:'⚙️ Сервисы', tax:'📋 Налоги', fuel:'⛽ Топливо', other:'📦 Прочее'};
const catClass = {rent:'cat-rent', salary:'cat-salary', service:'cat-service', tax:'cat-tax', fuel:'cat-fuel', other:'cat-other'};

function api(path, method='GET', body=null) {
  const opts = {method, headers:{'Content-Type':'application/json'}};
  const token = localStorage.getItem('gl_staff_token');
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  return fetch(WORKER + path, opts).then(r => r.json());
}

function fmt(n) { return Number(n||0).toLocaleString('ru', {maximumFractionDigits:0}); }

let allData = [], rates = {EUR:422, USD:366, AMD:1, RUB:4.5};
let editingId = null;

async function load() {
  try { const r = await api('/api/rates'); rates = r; } catch(_) {}
  const start = document.getElementById('filterStart').value;
  const end   = document.getElementById('filterEnd').value;
  const cat   = document.getElementById('filterCat').value;
  let url = '/api/company-expenses';
  const params = [];
  if (start) params.push('start='+start);
  if (end)   params.push('end='+end);
  if (cat)   params.push('category='+cat);
  if (params.length) url += '?' + params.join('&');
  allData = await api(url).catch(() => []);
  render();
}

function render() {
  const tbody = document.getElementById('expTable');
  if (!allData.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Нет расходов за выбранный период</td></tr>';
  } else {
    tbody.innerHTML = allData.map(e => `
      <tr>
        <td>${e.date||''}</td>
        <td><span class="cat-badge ${catClass[e.category]||'cat-other'}">${catLabel[e.category]||e.category}</span></td>
        <td>${e.description||''}</td>
        <td style="font-weight:600">${e.currency==='AMD'?'֏':'€'} ${fmt(e.amount)} <span style="color:#8fa8ab;font-size:.75rem">${e.currency}</span></td>
        <td style="color:#1E7A80;font-weight:600">֏${fmt(e.amount_amd)}</td>
        <td>
          <div style="display:flex;gap:4px">
            <button onclick="editExp(${e.id})" style="background:#f0f9f9;color:#1E7A80;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.75rem">✏️</button>
            <button onclick="deleteExp(${e.id})" style="background:#FEF2F2;color:#C62828;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.75rem">✕</button>
            ${e.receipt_key ? `<button onclick="window.open('${WORKER}/api/receipt/${e.receipt_key.replace('receipts/','')}')" style="background:#f0f9f9;color:#1E7A80;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.75rem">📎</button>` : ''}
          </div>
        </td>
      </tr>`).join('');
  }
  // Статистика
  const getAMD = e => e.amount_amd || (e.amount * (rates[e.currency]||1));
  document.getElementById('statTotal').textContent = '֏' + fmt(allData.reduce((s,e)=>s+getAMD(e),0));
  ['rent','salary','service','tax','other'].forEach(cat => {
    const el = document.getElementById('stat' + cat.charAt(0).toUpperCase() + cat.slice(1));
    if (el) el.textContent = '֏' + fmt(allData.filter(e=>e.category===cat).reduce((s,e)=>s+getAMD(e),0));
  });
}

function openModal(exp=null) {
  editingId = exp?.id || null;
  document.getElementById('modalTitle').textContent = exp ? 'Редактировать расход' : 'Добавить расход';
  document.getElementById('fDate').value = exp?.date || new Date().toISOString().slice(0,10);
  document.getElementById('fCat').value = exp?.category || 'rent';
  document.getElementById('fAmount').value = exp?.amount || '';
  document.getElementById('fCurrency').value = exp?.currency || 'AMD';
  document.getElementById('fDesc').value = exp?.description || '';
  document.getElementById('expModal').classList.add('open');
}

window.editExp = id => openModal(allData.find(x=>x.id===id));
window.deleteExp = async id => {
  if (!confirm('Удалить расход?')) return;
  await api('/api/company-expenses/' + id, 'DELETE');
  load();
};

document.getElementById('addBtn').addEventListener('click', () => openModal());
document.getElementById('cancelBtn').addEventListener('click', () => document.getElementById('expModal').classList.remove('open'));
document.getElementById('logoutBtn').addEventListener('click', () => {
  ['gl_staff_user','gl_staff_login_time','gl_staff_token'].forEach(k=>localStorage.removeItem(k));
  window.location.href = 'staff.html';
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const amount = parseFloat(document.getElementById('fAmount').value) || 0;
  const currency = document.getElementById('fCurrency').value;
  const body = {
    date: document.getElementById('fDate').value,
    category: document.getElementById('fCat').value,
    amount, currency,
    amount_amd: currency==='AMD' ? amount : amount*(rates[currency]||1),
    description: document.getElementById('fDesc').value,
    created_by: user
  };
  const f = document.getElementById('fReceipt').files[0];
  if (f) {
    const up = await fetch(WORKER+'/api/trips/upload-receipt', {method:'POST', headers:{'Content-Type':f.type}, body:f}).then(r=>r.json());
    body.receipt_key = up.key;
  }
  if (editingId) await api('/api/company-expenses/'+editingId, 'PUT', body);
  else await api('/api/company-expenses', 'POST', body);
  document.getElementById('expModal').classList.remove('open');
  load();
});

['filterStart','filterEnd','filterCat'].forEach(id => document.getElementById(id).addEventListener('change', load));

const now = new Date();
document.getElementById('filterStart').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
document.getElementById('filterEnd').value = now.toISOString().slice(0,10);
load();
</script>
</body>
