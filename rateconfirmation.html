<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; connect-src *; img-src * data: blob:; font-src * data:">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

  <link rel="icon" type="image/png" href="images/GL_LOGISTICs_line_-09.jpg.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B171C; font-family: 'Inter', sans-serif; padding: 2rem 1.5rem; color: #EDF4F6; min-height: 100vh; }
    .app-wrapper { max-width: 1440px; margin: 0 auto; }
    .top-bar { background: rgba(20,38,44,0.9); backdrop-filter: blur(16px); border-radius: 60px; padding: 0.7rem 2rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; border: 1px solid rgba(85,183,189,0.5); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.95rem; text-decoration: none; color: inherit; }
    .brand:hover { opacity: 0.85; }
    .brand-logo { height: 40px; width: auto; object-fit: contain; cursor: pointer; }
    .type-group { display: flex; gap: 6px; background: #1E3B42; border-radius: 40px; padding: 4px; }
    .type-btn { padding: 0.5rem 1.2rem; border-radius: 40px; font-weight: 600; font-size: 0.75rem; border: none; cursor: pointer; background: transparent; color: #CAE9ED; transition: 0.25s; white-space: nowrap; }
    .type-btn.active { background: #55B7BD; color: #0E2126; box-shadow: 0 0 10px rgba(85,183,189,0.5); }
    .lang-group { display: flex; gap: 6px; }
    .lang-btn { background: #1E3B42; border: none; padding: 0.45rem 1rem; border-radius: 40px; font-weight: 600; font-size: 0.75rem; color: #CAE9ED; cursor: pointer; transition: 0.2s; }
    .lang-btn.active { background: #55B7BD; color: #0E2126; box-shadow: 0 0 8px rgba(85,183,189,0.7); }
    .dashboard { display: grid; grid-template-columns: 1fr 0.9fr; gap: 1.5rem; }
    @media (max-width: 1000px) { .dashboard { grid-template-columns: 1fr; } }
    .contract-card { background: #FFFEF8; border-radius: 28px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5); overflow: hidden; }
    .contract-scroll { max-height: 80vh; overflow-y: auto; padding: 2rem 2rem; }
    .contract-preview { font-family: 'Times New Roman', 'Georgia', serif; font-size: 12px; line-height: 1.5; color: #1E2F33; position: relative; min-height: 600px; }
    .contract-preview h2 { font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 0.4rem; color: #005f67; }
    .contract-preview .center { text-align: center; }
    .hayt-tbl { width: 100%; border-collapse: collapse; margin: 0.6rem 0 0.8rem; }
    .hayt-tbl td { border: 1px solid #4a9aa0; padding: 4px 7px; vertical-align: top; font-size: 11px; }
    .hayt-tbl td.num { width: 24px; text-align: center; font-weight: 700; color: #005f67; background: #f0fafa; }
    .hayt-tbl td.lbl { width: 42%; background: #f7fdfd; font-style: italic; color: #2a6066; }
    .hayt-tbl td.val { font-weight: 500; color: #0d2226; }
    .party-tbl { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .party-tbl td { width: 50%; border: 1px solid #4a9aa0; padding: 6px 8px; vertical-align: top; font-size: 11px; }
    .form-panel { background: #152A30; border-radius: 28px; padding: 1.5rem; border: 1px solid #2F6C74; }
    .form-panel h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.2rem; color: #55B7BD; border-left: 4px solid #55B7BD; padding-left: 0.8rem; }
    .input-group { margin-bottom: 0.7rem; }
    .input-group label { font-size: 0.65rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.06em; color: #B9DFE4; display: block; margin-bottom: 0.2rem; }
    .input-group input, .input-group textarea { width: 100%; background: #0C2228; border: 1px solid #336D76; border-radius: 22px; padding: 10px 16px; color: white; font-family: 'Inter', sans-serif; font-size: 0.9rem; outline: none; }
    .input-group textarea { border-radius: 14px; resize: vertical; min-height: 60px; padding: 8px 14px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .sec-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: #55B7BD; font-weight: 700; border-left: 3px solid #55B7BD; padding-left: 8px; margin: 0.9rem 0 0.5rem; }
    .stamp-upload { background: #0A1F25; border-radius: 18px; padding: 0.8rem; text-align: center; border: 1px dashed #55B7BD; cursor: pointer; font-size: 0.7rem; }
    .stamp-preview-img { max-width: 60px; max-height: 60px; object-fit: contain; display: none; margin-top: 5px; }
    .btn-dl { width: 100%; background: #1E3B42; border: 1px solid #55B7BD; padding: 13px; border-radius: 50px; font-weight: 700; font-size: 0.9rem; font-family: 'Plus Jakarta Sans', sans-serif; color: #55B7BD; cursor: pointer; transition: 0.2s; margin-top: 0.8rem; }
    .btn-dl:hover { background: #2a5060; }
    .legal-note { font-size: 0.65rem; text-align: center; margin-top: 0.8rem; color: #9FCBD0; }
  </style>

<body>
<div class="app-wrapper">
  <div class="top-bar">
    <a href="/" class="brand">
      <img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL Logistics" class="brand-logo">
      <span data-i18n="brand_title">Ջի Էլ Լոգիստիկս • ՀԱՅՏ</span>
    </a>
    <div class="type-group">
      <button class="type-btn active" data-type="customer" data-i18n="btn_customer">👤 ՊԱՏՎԻՐԱՏՈՒ → ՋԻ ԷԼ</button>
      <button class="type-btn" data-type="carrier" data-i18n="btn_carrier">🚛 ՋԻ ԷԼ → ՓՈԽԱԴՐՈՂ</button>
    </div>
    <div class="lang-group">
      <button class="lang-btn active" data-lang="am">🇦🇲 HAY</button>
      <button class="lang-btn" data-lang="ru">🇷🇺 RU</button>
      <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
    </div>
  </div>
  <div class="dashboard">
    <div class="contract-card"><div class="contract-scroll"><div class="contract-preview" id="contractPreview"></div></div></div>
    <div class="form-panel">
      <h2 data-i18n="form_title">📋 ԼՐԱՑՆԵԼ ՀԱՅՏԸ</h2>
      <form id="contractForm">
        <div class="sec-label">📋 Հայտ և Պայմանագիր</div>
        <div class="two-col">
          <div class="input-group"><label>Հայտ №</label><input type="text" id="haytNum" placeholder="01/____/1"></div>
          <div class="input-group"><label>Պայմանագրի №</label><input type="text" id="contractNum" placeholder="01/______/01"></div>
        </div>
        <div class="sec-label" data-i18n="s_company">🏢 ԸՆԿԵՐՈՒԹՅՈՒՆ</div>
        <div class="two-col">
          <div class="input-group"><label data-i18n="company_label">ԸՆԿԵՐՈՒԹՅԱՆ ԱՆՎԱՆՈՒՄ *</label><input type="text" id="company" required></div>
          <div class="input-group"><label data-i18n="tax_label">ՀՎՀՀ / ИНН</label><input type="text" id="taxId"></div>
        </div>
        <div class="input-group"><label data-i18n="address_label">ԳՐԱՆՑՄԱՆ ՀԱՍՑԵ</label><input type="text" id="address"></div>
        <div class="input-group"><label data-i18n="signatory_label">ՍՏՈՐԱԳՐՈՂ *</label><input type="text" id="signatory" required></div>
        <div class="two-col">
          <div class="input-group"><label data-i18n="position_label">ՊԱՇՏՈՆ</label><input type="text" id="position"></div>
          <div class="input-group"><label data-i18n="date_label">ԱՄՍԱԹԻՎ *</label><input type="date" id="signDate" required></div>
        </div>
        <div class="two-col">
          <div class="input-group"><label data-i18n="bank_label">ԲԱՆԿ</label><input type="text" id="bankName"></div>
          <div class="input-group"><label data-i18n="acc_label">Հ/Հ · Р/С</label><input type="text" id="bankAcc"></div>
        </div>
        <div class="input-group"><label data-i18n="phone_label">ՀԵՌԱԽՈՍ</label><input type="tel" id="phone"></div>

        <div class="sec-label" data-i18n="s_cargo">📦 ԲԵՌ ԵՎ ԵՐԹՈՒՂԻ</div>
        <div class="input-group"><label data-i18n="l_f1">1. ԸՆԴՈՒՆՄԱՆ ՎԱՅՐԸ ԵՎ ԱՄՍԱԹԻՎԸ *</label><input type="text" id="f1" required></div>
        <div class="input-group"><label data-i18n="l_f2">2. ՆՇԱՆԱԿՄԱՆ ՎԱՅՐԸ</label><input type="text" id="f2" value="ՀՀ, ք. Երևան"></div>
        <div class="input-group"><label data-i18n="l_f3">3. ԲԵՌԻ ՆԿԱՐԱԳԻՐԸ</label><textarea id="f3"></textarea></div>
        <div class="input-group"><label data-i18n="l_f4">4. ՍՏԱՑՈՂԻ ԱՆՈՒՆԸ ԵՎ ՀԱՍՑԵՆ</label><input type="text" id="f4"></div>

        <div class="sec-label" data-i18n="s_transport">🚛 ՏՐԱՆՍՊՈՐՏ</div>
        <div class="input-group"><label data-i18n="l_f5">5. ՏՐԱՆՍՊ. ՄԻՋՈՑՆԵՐ</label><input type="text" id="f5"></div>
        <div class="input-group"><label data-i18n="l_f6">6. ԲԵՌՆՄԱՆ ՊԱՅՄԱՆՆԵՐ</label><input type="text" id="f6"></div>
        <div class="input-group"><label data-i18n="l_f7">7. ՆԱԽԱՊԱՏՐԱՍՏՈՒՄ</label><input type="text" id="f7"></div>
        <div class="two-col">
          <div class="input-group"><label data-i18n="l_f9">9. ՄԱՔՍԱՅԻՆ ՀՐԱՀԱՆԳՆԵՐ</label><input type="text" id="f9"></div>
          <div class="input-group"><label data-i18n="l_f10">10. ԵՐԹՈՒՂԻ</label><input type="text" id="f10"></div>
        </div>

        <div class="sec-label" data-i18n="s_rate">💰 ԳԻՆ</div>
        <div class="two-col">
          <div class="input-group"><label data-i18n="l_f11">11. ԳԻՆ ԵՎ ՎՃԱՐՄԱՆ ՊԱՅՄԱՆՆԵՐ</label><input type="text" id="f11"></div>
          <div class="input-group"><label data-i18n="l_f12">12. ԱՌԱՔՄԱՆ ԺԱՄԿԵՏ</label><input type="text" id="f12"></div>
        </div>
        <div class="input-group"><label data-i18n="l_f13">13. ԼՐԱՑՈՒՄՆԵՐ</label><textarea id="f13"></textarea></div>

        <div class="sec-label" data-i18n="s_sign">🔏 ԿՆԻՔ</div>
        <div class="stamp-upload" id="stampTrigger">
          <span data-i18n="upload_stamp">ԿՆԻՔ</span>
          <input type="file" id="stampInput" accept="image/*" style="display:none;">
          <img id="stampPreview" class="stamp-preview-img" alt="stamp">
        </div>

        <button type="button" class="btn-dl" id="dlBtn">⬇ Ներբեռնել PDF</button>
      </form>
      <div class="legal-note">🔒 GL Logistics LLC · TIN 00521217 · info@gllogistics.org</div>
    </div>
  </div>
</div>

<script>
// Водяной знак темнее
function watermark() {
  return '<div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); opacity:0.12; pointer-events:none; z-index:0;"><img src="images/GL_LOGISTICs_line_-09.jpg.png" style="width:450px;"></div>';
}

// Форматирование даты
function formatDate(dateStr, lang) {
  if (!dateStr) return '________';
  var parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  var y = parts[0], m = parts[1], d = parts[2];
  if (lang === 'am') {
    var months = ['հունվարի','փետրվարի','մարտի','ապրիլի','մայիսի','հունիսի','հուլիսի','օգոստոսի','սեպտեմբերի','հոկտեմբերի','նոյեմբերի','դեկտեմբերի'];
    return d + ' ' + months[parseInt(m)-1] + ' ' + y;
  } else if (lang === 'ru') {
    var months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return d + ' ' + months[parseInt(m)-1] + ' ' + y;
  } else {
    return d + '.' + m + '.' + y;
  }
}

function sigStamp(st) {
  var h = '<div style="position:relative;min-height:'+(st?'120px':'60px')+';margin-top:6px;">';
  if (st) {
    h += '<img src="'+st+'" alt="stamp" style="position:absolute;top:-10px;right:0;width:150px;height:150px;object-fit:contain;opacity:0.82;transform:rotate(-12deg);">';
  }
  h += '<div style="padding-right:'+(st?'160px':'0px')+';padding-bottom:4px;"></div>';
  h += '<div style="height:1px;background:#2A5E66;width:'+(st?'calc(100% - 160px)':'100%')+';"></div>';
  h += '</div>';
  return h;
}

function haytTable(f1,f2,f3,f4,f5,f6,f7,f9,f10,f11,f12,f13, lang) {
  var rows = [
    ['1',{am:'Բեռի ընդունման վայրը և ամսաթիվը',ru:'Место и дата приёма груза',en:'Pickup location and date'},f1||'___________________________________  __.__.202_'],
    ['2',{am:'Առաքման նշանակման վայրը',ru:'Место назначения',en:'Delivery destination'},f2||'ՀՀ, ք. Երևան'],
    ['3',{am:'Բեռի նկարագիրը (անվանում, քանակ, ծավալ, փաթեթավորում, վտանգավորության դաս, ջերմաստիճանային ռեժիմ, այլ տվյալներ)',ru:'Описание груза',en:'Cargo description'},f3||'_______________________________'],
    ['4',{am:'Ստացողի անունը և հասցեն',ru:'Имя и адрес получателя',en:'Recipient name and address'},f4||'&nbsp;'],
    ['5',{am:'Տրանսպորտային միջոց(ներ)ի տեսակը, քանակը',ru:'Тип и количество ТС',en:'Vehicle type and quantity'},f5||'<em>_______________________________________</em>'],
    ['6',{am:'Տրանսպորտային միջոցների տրամադրման, բեռնման ու բեռնաթափման աշխատանքների իրականացման պայմաններ',ru:'Условия погрузки/разгрузки',en:'Loading/unloading conditions'},f6||'<em>__________________</em>'],
    ['7',{am:'Բեռը տրանսպորտային փոխադրման նախապատրաստելու պայմաններ',ru:'Подготовка груза',en:'Cargo preparation'},f7||'<em>__________________</em>'],
    ['9',{am:'Մաքսային կամ այլ ձևակերպումների համար պահանջվող հրահանգներ',ru:'Таможенные инструкции',en:'Customs instructions'},f9||'<em>__________________</em>'],
    ['10',{am:'Երթուղի',ru:'Маршрут',en:'Route'},f10||'<em>__________________</em>'],
    ['11',{am:'Գինը և վճարման պայմանները',ru:'Цена и условия оплаты',en:'Price and payment terms'},f11||'<em>__________________</em>'],
    ['12',{am:'Առաքման առավելագույն ժամկետը',ru:'Макс. срок доставки',en:'Maximum delivery time'},f12||'<em>__________________</em>'],
    ['13',{am:'Լրացումներ, այլ պայմաններ',ru:'Дополнения',en:'Additional conditions'},f13||'&nbsp;']
  ];
  var html = '<table class="hayt-tbl">';
  rows.forEach(function(r) {
    html += '<tr><td class="num">'+r[0]+'</td><td class="lbl">'+(r[1][lang]||r[1].ru)+'</td><td class="val">'+r[2]+'</td></tr>';
  });
  html += '</table>';
  return html;
}

var templates = {
  customer: {
    am: function(c,t,a,s,p,d,n,st,bk,ba,f1,f2,f3,f4,f5,f6,f7,f9,f10,f11,f12,f13,haytN,contrN) {
      var fDate = formatDate(d, 'am');
      return watermark() +
        '<h2>ՊԱՏՎԻՐԱՏՈՒ</h2>' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;">' +
        '<span>Ք. Երևան</span><span>Հայտ /Nօ.'+haytN+'&nbsp;&nbsp;&nbsp;&nbsp;'+fDate+'</span></div>' +
        '<div style="font-size:10px;text-align:center;color:#3a7a80;margin-bottom:8px;">Հավելված Nօ. 1&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'+fDate+'&nbsp;&nbsp;թվականին կնքված № '+contrN+' պայմանագրի</div>' +
        haytTable(f1,f2,f3,f4,f5,f6,f7,f9,f10,f11,f12,f13,'am') +
        '<table class="party-tbl"><tr>' +
        '<td><strong>Պատվիրատու</strong><br>Շահառուի Բանկ՝ «'+(bk||'_________________')+'» ՓԲԸ<br>Շահառու՝ «'+(c||'___________________')+'»<br>Շահառուի հաշվեհամար՝ '+(ba||'_________________')+'<br>Տնօրեն` '+(p?p+' ':'')+''+(s||'__________________')+'<br>'+sigStamp(st)+'</td>' +
        '<td><strong>Տրանսպորտային առաքող</strong><br>Շահառուի Բանկ՝ «Էվոկաբանկ» ՓԲԸ<br>Շահառու՝ «ՋԻ ԷԼ ԼՈԳԻՍՏԻԿՍ» ՍՊԸ<br>Շահառուի հաշվեհամար՝ 1660030207153200<br>Տնօրեն` Տիգրան Մեծպագյան<br><div style="border-bottom:1px solid #2A5E66;margin-top:50px;"></div></td>' +
        '</tr></table>';
    },
    ru: function(c,t,a,s,p,d,n,st,bk,ba,f1,f2,f3,f4,f5,f6,f7,f9,f10,f11,f12,f13,haytN,contrN) {
      var fDate = formatDate(d, 'ru');
      return watermark() +
        '<h2>ЗАЯВКА</h2>' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span>г. Ереван</span><span>Заявка № '+haytN+'&nbsp;&nbsp;&nbsp;'+fDate+'</span></div>' +
        '<div style="font-size:10px;text-align:center;color:#3a7a80;margin-bottom:8px;">Приложение №1 к Договору '+contrN+' от '+fDate+'</div>' +
        haytTable(f1,f2,f3,f4,f5,f6,f7,f9,f10,f11,f12,f13,'ru') +

async function makePdf() {
  var cv = await html2canvas(previewDiv,{scale:2,useCORS:true,backgroundColor:'#FFFEF8',logging:false});
  var {jsPDF}=window.jspdf, pdf=new jsPDF('p','mm','a4');
  var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), m=10, uw=pw-m*2;
  var ih=cv.height*uw/cv.width;
  if(ih<=ph-m*2){pdf.addImage(cv.toDataURL('image/jpeg',0.93),'JPEG',m,m,uw,ih);}
  else{var sh=Math.floor(cv.width*(ph-m*2)/uw),yo=0;
    while(yo<cv.height){var sl=document.createElement('canvas');sl.width=cv.width;sl.height=Math.min(sh,cv.height-yo);sl.getContext('2d').drawImage(cv,0,yo,cv.width,sl.height,0,0,cv.width,sl.height);
    if(yo>0)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',0.93),'JPEG',m,m,uw,sl.height*uw/cv.width);yo+=sh;}}
  return pdf;
}

  try{var pdf=await makePdf();pdf.save('Application_'+contractNumber+'.pdf');}
  catch(e){alert('PDF error: '+e.message);}
  b.disabled=false; b.textContent='⬇ Ներբեռնել PDF';
});
