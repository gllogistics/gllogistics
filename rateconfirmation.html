<html lang="hy">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B171C; font-family: 'Inter', sans-serif; padding: 2rem 1.5rem; color: #EDF4F6; min-height: 100vh; }
    .app-wrapper { max-width: 1440px; margin: 0 auto; }
    .top-bar { background: rgba(20,38,44,0.9); backdrop-filter: blur(16px); border-radius: 60px; padding: 0.7rem 2rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; border: 1px solid rgba(85,183,189,0.5); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.95rem; text-decoration: none; color: inherit; }
    .brand:hover { opacity: 0.85; }
    .brand-logo { height: 40px; width: auto; object-fit: contain; cursor: pointer; }
    .type-group { display: flex; gap: 6px; background: #1E3B42; border-radius: 40px; padding: 4px; }
    .type-btn { padding: 0.5rem 1.2rem; border-radius: 40px; font-weight: 600; font-size: 0.75rem; border: none; cursor: pointer; background: transparent; color: #CAE9ED; transition: 0.25s; white-space: nowrap; }
    .type-btn.active { background: #55B7BD; color: #0E2126; box-shadow: 0 0 10px rgba(85,183,189,0.5); }
    .lang-group { display: flex; gap: 6px; }
    .lang-btn { background: #1E3B42; border: none; padding: 0.45rem 1rem; border-radius: 40px; font-weight: 600; font-size: 0.75rem; color: #CAE9ED; cursor: pointer; transition: 0.2s; }
    .lang-btn.active { background: #55B7BD; color: #0E2126; box-shadow: 0 0 8px rgba(85,183,189,0.7); }
    .dashboard { display: grid; grid-template-columns: 1fr 0.9fr; gap: 1.5rem; }
    @media (max-width: 1000px) { .dashboard { grid-template-columns: 1fr; } }
    .contract-card { background: #FFFEF8; border-radius: 28px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5); overflow: hidden; }
    .contract-scroll { max-height: 80vh; overflow-y: auto; padding: 2rem 2rem; }
    .contract-preview { font-family: 'Times New Roman', 'Georgia', serif; font-size: 12px; line-height: 1.5; color: #1E2F33; position: relative; min-height: 600px; }
    .contract-preview h2 { font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 0.4rem; color: #005f67; }
    .contract-preview .center { text-align: center; }
    .contract-preview .parties-row { display: flex; justify-content: space-between; gap: 1rem; margin: 0.8rem 0; }
    .contract-preview .party-col { width: 48%; }
    .contract-preview .party-col p { margin-bottom: 0.15rem; }
    .party-col .line { border-bottom: 1px solid #2A5E66; margin-top: 1.8rem; margin-bottom: 0.2rem; }
    /* Application table */
    .hayt-tbl { width: 100%; border-collapse: collapse; margin: 0.6rem 0 0.8rem; }
    .hayt-tbl td { border: 1px solid #4a9aa0; padding: 4px 7px; vertical-align: top; font-size: 11px; }
    .hayt-tbl td.num { width: 24px; text-align: center; font-weight: 700; color: #005f67; background: #f0fafa; }
    .hayt-tbl td.lbl { width: 42%; background: #f7fdfd; font-style: italic; color: #2a6066; }
    .hayt-tbl td.val { font-weight: 500; color: #0d2226; }
    .party-tbl { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .party-tbl td { width: 50%; border: 1px solid #4a9aa0; padding: 6px 8px; vertical-align: top; font-size: 11px; }
    /* Sig stamp */
    .form-panel { background: #152A30; border-radius: 28px; padding: 1.5rem; border: 1px solid #2F6C74; }
    .form-panel h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.2rem; color: #55B7BD; border-left: 4px solid #55B7BD; padding-left: 0.8rem; }
    .input-group { margin-bottom: 0.7rem; }
    .input-group label { font-size: 0.65rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.06em; color: #B9DFE4; display: block; margin-bottom: 0.2rem; }
    .input-group input, .input-group textarea { width: 100%; background: #0C2228; border: 1px solid #336D76; border-radius: 22px; padding: 10px 16px; color: white; font-family: 'Inter', sans-serif; font-size: 0.9rem; outline: none; }
    .input-group textarea { border-radius: 14px; resize: vertical; min-height: 60px; padding: 8px 14px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .sec-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: #55B7BD; font-weight: 700; border-left: 3px solid #55B7BD; padding-left: 8px; margin: 0.9rem 0 0.5rem; }
    .upload-row { display: flex; gap: 0.8rem; margin: 0.6rem 0; }
    .stamp-upload, .signature-area { flex: 1; background: #0A1F25; border-radius: 18px; padding: 0.8rem; text-align: center; border: 1px dashed #55B7BD; cursor: pointer; font-size: 0.7rem; }
    .signature-canvas-box { background: white; border-radius: 12px; overflow: hidden; margin: 0.4rem 0; }
    #signatureCanvas { width: 100%; height: 80px; background: #fff; display: block; touch-action: none; cursor: crosshair; }
    .sig-preview-img { max-width: 100px; max-height: 40px; object-fit: contain; display: none; margin-top: 5px; }
    .stamp-preview-img { max-width: 60px; max-height: 60px; object-fit: contain; display: none; margin-top: 5px; }
    .checkbox-group { display: flex; gap: 10px; margin: 0.8rem 0; align-items: flex-start; }
    .checkbox-group input { margin-top: 3px; accent-color: #55B7BD; transform: scale(1.2); }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.8rem; }
    .btn-submit { background: linear-gradient(100deg, #55B7BD, #31838A); border: none; padding: 13px; border-radius: 50px; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.07em; font-family: 'Plus Jakarta Sans', sans-serif; color: #0D1F23; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(85,183,189,0.6); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-dl { background: #1E3B42; border: 1px solid #55B7BD; padding: 13px; border-radius: 50px; font-weight: 700; font-size: 0.9rem; font-family: 'Plus Jakarta Sans', sans-serif; color: #55B7BD; cursor: pointer; transition: 0.2s; }
    .btn-dl:hover { background: #2a5060; }
    .success-msg { background: #1A423F; border-radius: 24px; padding: 1.5rem; text-align: center; margin-top: 1rem; display: none; }
    .success-msg h3 { color: #55B7BD; margin-bottom: 0.5rem; }
    .legal-note { font-size: 0.65rem; text-align: center; margin-top: 0.8rem; color: #9FCBD0; }

<body>
<div class="app-wrapper">
  <div class="top-bar">
    <a href="/" class="brand">
      <img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL Logistics" class="brand-logo">
      <span data-i18n="brand_title">Ջի Էլ Լոգիստիկս • ՀАЙТ</span>
    </a>
    <div class="type-group">
      <button class="type-btn active" data-type="customer" data-i18n="btn_customer">👤 ПԱՏVIRAТУ → ՋԻ ԷԼ</button>

  <div class="dashboard">

    <div class="form-panel">

          <div class="input-group"><label data-i18n="company_label">YNDKERУTYUN *</label><input type="text" id="company" required></div>
          <div class="input-group"><label data-i18n="tax_label">HVHH / ИНН</label><input type="text" id="taxId"></div>
        </div>

        <div class="two-col">

        </div>
        <div class="two-col">

        </div>
        <div class="two-col">

          <div class="input-group"><label data-i18n="phone_label">HERAKHOS</label><input type="tel" id="phone"></div>
        </div>

        <div class="sec-label" data-i18n="s_cargo">📦 BEŘ EV ERTUГHI</div>

        <div class="sec-label" data-i18n="s_transport">🚛 ТРАНСПОРТ</div>

        <div class="input-group"><label data-i18n="l_f7">7. NAKHAPRASTMAN</label><input type="text" id="f7"></div>
        <div class="two-col">
          <div class="input-group"><label data-i18n="l_f9">9. MAQSAYIN HMUSH</label><input type="text" id="f9"></div>
          <div class="input-group"><label data-i18n="l_f10">10. ERTUGHI</label><input type="text" id="f10"></div>

          <div class="input-group"><label data-i18n="l_f12">12. ЖАМKJET</label><input type="text" id="f12"></div>

        <div class="input-group"><label data-i18n="l_f13">13. ЛРАЦУМNER</label><textarea id="f13"></textarea></div>

          <div class="signature-area">✍️ <span data-i18n="upload_signature">STVОAGR.</span><div class="signature-canvas-box"><canvas id="signatureCanvas"></canvas></div><button type="button" id="clearSignature" style="background:#3a5a60;border:none;color:white;padding:4px 12px;border-radius:20px;margin-top:5px;cursor:pointer;font-size:0.7rem;" data-i18n="clear_btn">Маqрel</button><img id="signaturePreview" class="sig-preview-img" alt="signature"></div>
        </div>

<script>
const CLOUDINARY_URL='https://api.cloudinary.com/v1_1/drp98zkka/upload';
const CLOUDINARY_UPLOAD_PRESET='gl_contracts';
const FORMSPREE_MAIN='https://formspree.io/f/mredrzjr';
const FORMSPREE_CLIENT='https://formspree.io/f/mzdwybvb';

// ── sigStamp helper ───────────────────────────────────────────────────────────
function sigStamp(sig, st) {
  var h = '<div style="display:table;width:100%;margin-top:6px;">';
  h += '<div style="display:table-cell;vertical-align:bottom;width:62%;">';
  if (sig) h += '<img src="'+sig+'" alt="sig" style="display:block;max-width:200px;max-height:72px;object-fit:contain;margin-bottom:3px;">';
  h += '<div style="height:1px;background:#2A5E66;width:100%;"></div>';
  h += '</div>';
  if (st) {
    h += '<div style="display:table-cell;vertical-align:middle;width:38%;text-align:center;">';
    h += '<img src="'+st+'" alt="stamp" style="width:130px;height:130px;object-fit:contain;opacity:0.82;transform:rotate(-12deg);display:inline-block;">';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

// ── haytTable: builds the 13-row application table ───────────────────────────
function haytTable(f1,f2,f3,f4,f5,f6,f7,f9,f10,f11,f12,f13, lang) {
  var rows = [
    ['1',
      {am:'Բեռի ընդունման վայրը և ամսաթիվը', ru:'Место и дата приёма груза', en:'Pickup location and date'},
      f1 || '___________________________________  __.__.202_'
    ],
    ['2',
      {am:'Առաքման նշանակման վայրը', ru:'Место назначения', en:'Delivery destination'},
      f2 || 'ՀՀ, ք. Երևan'
    ],
    ['3',
      {am:'Բեռի նկարագիրը անվանումը- քանակությունը ծավալը փաթեթավորումը վտանգավորության կարգը ջերմաստիճանային ռեժիմը այլ տվյալներ', ru:'Описание груза — наименование, количество, объём, упаковка, опасность, температурный режим', en:'Cargo description — name, qty, volume, packaging, hazard class, temperature'},
      f3 || '_______________________________'
    ],
    ['4',
      {am:'Ստացողի անունը և հասցեն', ru:'Имя и адрес получателя', en:'Recipient name and address'},
      f4 || '&nbsp;'
    ],
    ['5',
      {am:'Տրանսպորտային միջոց(ներ)ի տեսակը, քանակը', ru:'Тип и количество транспортных средств', en:'Vehicle type and quantity'},
      f5 || '<em>_______________________________________</em>'
    ],
    ['6',
      {am:'Տրանսպորտային միջոցների տրամադրման, բեռնման ու բեռնաթափման աշխատնքների իրականացնելու պայմաններ', ru:'Условия предоставления ТС, погрузки и разгрузки', en:'Loading/unloading conditions'},
      f6 || '<em>__________________</em>'
    ],
    ['7',
      {am:'Բեռը Տրանսպորտային փոխադրման նախապատրաստելու պայմաններ', ru:'Условия подготовки груза к перевозке', en:'Cargo preparation conditions'},
      f7 || '<em>__________________</em>'
    ],
    ['9',
      {am:'Մաքսային կամ այլ ձևակերպումների համար պահանջվող հրահանգներ', ru:'Инструкции для таможенных или иных формальностей', en:'Customs or other formalities instructions'},
      f9 || '<em>__________________</em>'
    ],
    ['10',
      {am:'Երթուղի', ru:'Маршрут', en:'Route'},
      f10 || '<em>__________________</em>'
    ],
    ['11',
      {am:'Գինը և վճարման պայմանները', ru:'Цена и условия оплаты', en:'Price and payment terms'},
      f11 || '<em>__________________</em>'
    ],
    ['12',
      {am:'Առաքման առավելագույն ժամկետը', ru:'Максимальный срок доставки', en:'Maximum delivery time'},
      f12 || '<em>__________________</em>'
    ],
    ['13',
      {am:'Լրացումներ, այլ պայմաններ', ru:'Дополнения, иные условия', en:'Additional conditions'},
      f13 || '&nbsp;'
    ]
  ];
  var html = '<table class="hayt-tbl">';
  rows.forEach(function(r) {
    html += '<tr>'
      + '<td class="num">'+r[0]+'</td>'
      + '<td class="lbl">'+(r[1][lang]||r[1].ru)+'</td>'
      + '<td class="val">'+r[2]+'</td>'
      + '</tr>';
  });
  html += '</table>';
  return html;
}

// ── Full templates ────────────────────────────────────────────────────────────
var templates = {

  // ═══════════════ CUSTOMER → GL (Пatviraтu → Dji El) ═══════════════════════
  customer: {

    am: function(c,t,a,s,p,d,n,sig,st,bk,ba,f1,f2,f3,f4,f5,f6,f7,f9,f10,f11,f12,f13) {
      var appNo = '01/' + n.split('-').slice(-1)[0] + '/1';
      var yr = d ? d.substring(0,4) : '202_';
      return '<h2>Պատվիրատու</h2>'
        + '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;">'
        + '<span>Ք. Yerеvan</span>'
        + '<span>Hayт / Nօ. '+appNo+'&nbsp;&nbsp;&nbsp;«__» ________ '+yr+'թ.</span>'
        + '</div>'
        + '<div style="font-size:10px;text-align:center;color:#3a7a80;margin-bottom:8px;">'
        + 'Հавелвads №1 «__» ________ '+yr+'թ. knkvads №01/______/01 paymanagri'
        + '</div>'
        + haytTable(f1,f2,f3,f4,f5,f6,f7,f9,f10,f11,f12,f13,'am')
        + '<div style="font-size:10px;color:#4a7080;border-top:1px solid #c0dde0;padding-top:5px;margin-bottom:8px;text-align:center;">'
        + 'Հавелвads №1 «__» ________ '+yr+'թ. knkvads №01/______/01 paymanagri'
        + '</div>'
        + '<table class="party-tbl"><tr>'
        // LEFT = Пататviraтu (client)
        + '<td><strong>Պատվիրատու</strong><br>'
        + 'Շահառուի Բանկ։ «'+(bk||'_________________')+'» ФБТ<br>'
        + 'Շահառու։ «'+(c||'___________________')+'»<br>'
        + 'Շահառուի հաշվեհամար։ _________________. '+(ba||'_________________')+'<br>'
        + 'Տնօրեն&#96; '+(p?p+' ':'')+''+(s||'__________________')+'<br>'
        + sigStamp(sig,st)
        + '</td>'

var currentLang='am', currentType='customer';
var stampDataUrl=null, signatureDataUrl=null, contractNumber='', signaturePad;

const previewDiv = document.getElementById('contractPreview');
const canvas     = document.getElementById('signatureCanvas');

function generateContractNumber() {
  var y=new Date().getFullYear(), p=currentType==='customer'?'APP-C':'APP-T', r=Math.floor(Math.random()*9000)+1000;
  return p+'-'+y+'-'+r;
}

// ── Signature pad ─────────────────────────────────────────────────────────────
function captureSignature() {
  if (signaturePad && !signaturePad.isEmpty()) {
    signatureDataUrl = signaturePad.toDataURL('image/png');
    document.getElementById('signaturePreview').src = signatureDataUrl;
    document.getElementById('signaturePreview').style.display = 'block';
    renderContract();
  }
}
function initSignaturePad() {
  canvas.width  = canvas.offsetWidth  || 300;
  canvas.height = canvas.offsetHeight || 80;
  signaturePad  = new SignaturePad(canvas, {
    backgroundColor:'rgba(255,255,255,0)', penColor:'rgb(10,10,10)',
    minWidth:1, maxWidth:2.8, onEnd: captureSignature
  });
}
initSignaturePad();
window.addEventListener('resize', function() {
  var d=signaturePad.toData(); initSignaturePad();
  if(d&&d.length>0){signaturePad.fromData(d); captureSignature();}
});
document.getElementById('clearSignature').addEventListener('click', function() {
  signaturePad.clear(); signatureDataUrl=null;
  document.getElementById('signaturePreview').style.display='none'; renderContract();
});

// ── Stamp upload ──────────────────────────────────────────────────────────────
document.getElementById('stampTrigger').addEventListener('click', function(){document.getElementById('stampInput').click();});
document.getElementById('stampInput').addEventListener('change', function(e) {
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader(); r.onload=function(ev){stampDataUrl=ev.target.result;document.getElementById('stampPreview').src=stampDataUrl;document.getElementById('stampPreview').style.display='block';renderContract();}; r.readAsDataURL(f);
});

// ── Helper: get field value ───────────────────────────────────────────────────
function fv(id, def) { var el=document.getElementById(id); return (el&&el.value.trim())?el.value.trim():(def||''); }

function renderContract() {
  var c=fv('company','[COMPANY]'), t=fv('taxId','________'), a=fv('address','________');
  var s=fv('signatory','[NAME]'), p=fv('position',''), d=fv('signDate',new Date().toISOString().slice(0,10));

  var f4=fv('f4',''), f5=fv('f5',''), f6=fv('f6',''), f7=fv('f7','');
  var f9=fv('f9',''), f10=fv('f10',''), f11=fv('f11',''), f12=fv('f12',''), f13=fv('f13','');
  if (!contractNumber) contractNumber = generateContractNumber();
  document.getElementById('contractNumberDisplay').textContent = contractNumber;
  var fn = templates[currentType][currentLang];

document.querySelectorAll('.type-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.type-btn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active'); currentType=b.dataset.type; contractNumber=generateContractNumber(); renderContract();
  });
});
document.querySelectorAll('.lang-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.lang-btn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active'); currentLang=b.dataset.lang; updateUILabels(); renderContract();
  });
});
function updateUILabels(){
  var t=uiLabels[currentLang]; if(!t)return;
  document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.dataset.i18n;if(t[k])e.innerHTML=t[k];});
}

// ── PDF ───────────────────────────────────────────────────────────────────────
async function makePdf() {
  var cv = await html2canvas(previewDiv,{scale:2,useCORS:true,backgroundColor:'#FFFEF8',logging:false});
  var {jsPDF}=window.jspdf, pdf=new jsPDF('p','mm','a4');
  var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), m=10, uw=pw-m*2;
  var ih=cv.height*uw/cv.width;
  if(ih<=ph-m*2){pdf.addImage(cv.toDataURL('image/jpeg',0.93),'JPEG',m,m,uw,ih);}
  else{var sh=Math.floor(cv.width*(ph-m*2)/uw),yo=0;
    while(yo<cv.height){var sl=document.createElement('canvas');sl.width=cv.width;sl.height=Math.min(sh,cv.height-yo);sl.getContext('2d').drawImage(cv,0,yo,cv.width,sl.height,0,0,cv.width,sl.height);
    if(yo>0)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',0.93),'JPEG',m,m,uw,sl.height*uw/cv.width);yo+=sh;}}
  return pdf;
}

document.getElementById('dlBtn').addEventListener('click', async function(){
  var b=this; b.disabled=true; b.textContent='⏳...'; renderContract();
  try{var pdf=await makePdf();pdf.save('Application_'+contractNumber+'.pdf');}
  catch(e){alert('PDF error: '+e.message);}
  b.disabled=false; b.textContent='⬇ PDF';
});

// ── Submit ────────────────────────────────────────────────────────────────────
document.getElementById('contractForm').addEventListener('submit', async function(e){
  e.preventDefault();
  if(!document.getElementById('agree').checked){alert(uiLabels[currentLang]?.agree_text);return;}
  var btn=this.querySelector('.btn-submit'); btn.disabled=true; btn.textContent='⏳ PDF...';
  renderContract();
  var email=fv('email'), company=fv('company'), signatory=fv('signatory');
  var fname='Application_'+contractNumber+'.pdf';
  try {
    var pdf=await makePdf(), blob=pdf.output('blob');
    // Local download (guaranteed)
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=fname; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},5000);
    btn.textContent='📤 Uploading...';
    // Cloudinary (optional)
    var pdfUrl='';
    try{var cf=new FormData();cf.append('file',new File([blob],fname,{type:'application/pdf'}));cf.append('upload_preset',CLOUDINARY_UPLOAD_PRESET);
      var cr=await fetch(CLOUDINARY_URL,{method:'POST',body:cf});if(cr.ok){var cd=await cr.json();if(cd.secure_url)pdfUrl=cd.secure_url;}}catch(_){}
    btn.textContent='📧 Sending...';
    // GL inbox
    await fetch(FORMSPREE_MAIN,{method:'POST',body:JSON.stringify({
      _subject:'New Application '+contractNumber, app_number:contractNumber, type:currentType, lang:currentLang,
      company:company, signatory:signatory, email:email,
      pickup:fv('f1'), delivery:fv('f2'), cargo:fv('f3'), route:fv('f10'), price:fv('f11'),
      pdf_link:pdfUrl||'(downloaded locally)',
      message:'Application #'+contractNumber+'\nCompany: '+company+'\nSignatory: '+signatory+'\nEmail: '+email+'\nPickup: '+fv('f1')+'\nDelivery: '+fv('f2')+'\nPDF: '+(pdfUrl||'locally downloaded')
    }),headers:{'Accept':'application/json','Content-Type':'application/json'}});
    // Client confirmation
    await fetch(FORMSPREE_CLIENT,{method:'POST',body:JSON.stringify({
      email:email, _replyto:'info@gllogistics.org', _subject:'GL Logistics — Application '+contractNumber,
      message:'Dear '+signatory+',\n\nYour application #'+contractNumber+' has been submitted to GL Logistics LLC.\n\nPickup: '+fv('f1')+'\nDelivery: '+fv('f2')+'\nCargo: '+fv('f3')+'\n\n'+(pdfUrl?'Download PDF: '+pdfUrl:'PDF downloaded locally.')+'\n\nGL Logistics LLC\n+374 93 66 14 54\ninfo@gllogistics.org'
    }),headers:{'Accept':'application/json','Content-Type':'application/json'}});
    document.getElementById('contractForm').style.display='none';
    document.getElementById('successMsg').style.display='block';
  } catch(err){alert('Error: '+err.message);}
  finally{btn.disabled=false; btn.textContent=uiLabels[currentLang]?.submit_btn||'SUBMIT';}
});

document.getElementById('signDate').valueAsDate = new Date();
document.getElementById('f2').value = 'ՀՀ, ք. Երεван';
updateUILabels();
renderContract();
</script>
