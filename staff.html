<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://gl-api.gltransam.workers.dev; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GL Logistics — вход для персонала.">
  <title>GL Logistics | Вход</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F5FAFA; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: white; border-radius: 24px; padding: 2rem; width: 90%; max-width: 400px; border: 1px solid rgba(85,183,189,0.25); text-align: center; }
    .login-card img { height: 60px; margin-bottom: 1rem; }
    .login-card h2 { color: #1E3B42; margin-bottom: 1.5rem; }
    .login-card input { width: 100%; padding: 12px; border: 1px solid rgba(85,183,189,0.25); border-radius: 12px; margin-bottom: 1rem; font-size: 0.9rem; background: #F5FAFA; }
    .login-card button { width: 100%; padding: 12px; background: #55B7BD; color: #0D1F23; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1rem; }
    .error { color: #C62828; font-size: 0.8rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
<div class="login-card">
  <img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL">
  <h2>Вход для персонала</h2>
  <p class="error" id="errorMsg">Неверный логин или пароль</p>
  <input type="text" id="username" placeholder="Логин" autocomplete="username">
  <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
  <button id="loginBtn">Войти</button>
</div>
<script src="js/staff.js"></script>
</body>
</html>
