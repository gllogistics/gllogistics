<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://gl-api.gltransam.workers.dev; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GL Logistics | Клиенты</title>
<link rel="icon" type="image/png" href="images/GL_LOGISTICs_line_-09.jpg.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EDF4F4;font-family:'Inter',sans-serif;color:#1a1a1a;min-height:100vh;padding:1.5rem}
.top-bar{background:#fff;border-radius:16px;padding:.65rem 1.8rem;margin-bottom:1.4rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 16px rgba(30,59,66,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;text-decoration:none;color:#0D1F23}
.brand img{height:32px}
.nav-links{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.7);border-radius:14px;width:fit-content;border:1px solid rgba(85,183,189,.15);flex-wrap:wrap}
.nav-links a{background:transparent;color:#5a7a80;padding:8px 18px;border-radius:11px;text-decoration:none;font-size:.8rem;font-weight:600}
.nav-links a:hover{background:#E8F6F6;color:#1E7A80}
.nav-links a.active{background:#55B7BD;color:#fff;font-weight:700}
.btn-logout{background:#F5FAFA;color:#1E3B42;border:1.5px solid rgba(85,183,189,.3);border-radius:10px;padding:7px 18px;cursor:pointer;font-weight:600;font-size:.8rem}
.layout{display:grid;grid-template-columns:300px 1fr;gap:1.2rem}
.sidebar{display:flex;flex-direction:column;gap:.5rem}
.search-box{background:#fff;border:1.5px solid rgba(85,183,189,.2);border-radius:12px;padding:9px 14px;font-size:.85rem;color:#1E3B42;outline:none;width:100%;font-family:inherit}
.search-box:focus{border-color:#55B7BD}
.client-card{background:#fff;border-radius:14px;border:1.5px solid rgba(85,183,189,.15);padding:.9rem 1.1rem;cursor:pointer;transition:.15s;box-shadow:0 1px 4px rgba(30,59,66,.04)}
.client-card:hover{border-color:#55B7BD;box-shadow:0 2px 12px rgba(85,183,189,.1)}
.client-card.active{border-color:#55B7BD;background:#F0F9F9}
.client-name{font-weight:700;color:#1E3B42;font-size:.88rem}
.client-meta{font-size:.72rem;color:#8fa8ab;margin-top:3px;display:flex;gap:8px}
.badge{padding:2px 8px;border-radius:5px;font-size:.65rem;font-weight:700}
.badge-deals{background:#E0F4F5;color:#1E7A80}
.badge-amount{background:#E8F5E9;color:#2E7D32}
/* Детали клиента */
.detail-card{background:#fff;border-radius:16px;border:1px solid rgba(85,183,189,.12);padding:1.4rem;box-shadow:0 1px 8px rgba(30,59,66,.04)}
.client-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid rgba(85,183,189,.12)}
.client-title{font-size:1.2rem;font-weight:800;color:#1E3B42}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1.2rem}
.stat{background:#F5FAFA;border-radius:12px;padding:.8rem;text-align:center;border:1px solid rgba(85,183,189,.1)}
.stat .val{font-size:1.1rem;font-weight:800;color:#1E7A80;letter-spacing:-.3px}
.stat .lbl{font-size:.62rem;color:#8fa8ab;text-transform:uppercase;font-weight:700;margin-top:2px}
.stat.green .val{color:#2E7D32}
.stat.red .val{color:#C62828}
h3{font-size:.8rem;font-weight:800;color:#5a7a80;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.8rem}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{color:#8fa8ab;text-align:left;font-size:.6rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:9px 10px;background:#F7FBFB;border-bottom:1px solid rgba(85,183,189,.12);white-space:nowrap}
td{padding:9px 10px;color:#2a4a50;border-bottom:1px solid rgba(85,183,189,.07);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F0F9F9}
.status-badge{padding:3px 9px;border-radius:6px;font-size:.62rem;font-weight:700;display:inline-block}
.status-loading{background:#FFFBEB;color:#D97706}
.status-onroad{background:#EFF6FF;color:#2563EB}
.status-loaded{background:#F0FDFA;color:#0D9488}
.status-completed{background:#F0FDF4;color:#16A34A}
.paid-badge{padding:2px 7px;border-radius:5px;font-size:.62rem;font-weight:700}
.paid-yes{background:#D1FAE5;color:#065F46}
.paid-no{background:#FEE2E2;color:#991B1B}
.empty-state{text-align:center;padding:3rem;color:#8fa8ab}
.empty-state .icon{font-size:2.5rem;margin-bottom:.6rem}
.wa-btn{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:.75rem;font-weight:700;cursor:pointer;text-decoration:none}
.wa-btn:hover{background:#1DA851}
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}

.nav-links a:active, .nav-links a:focus { transform: none !important; box-shadow: none !important; }
</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#55B7BD">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GL Logistics">
  <link rel="apple-touch-icon" href="/images/gl_logo_icon.png">
</head>
<body>
<div class="top-bar">
  <a href="/" class="brand"><img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL">GL Logistics</a>
  <div class="nav-links">
    <a href="staff-dashboard.html">📊 Главная</a>
    <a href="staff-cargo.html">📦 Сделки</a>
    <a href="/trip-report">🚛 Рейсы</a>
    <a href="/clients" class="active">👥 Клиенты</a>
    <a href="/files">📁 Файлы</a>
  </div>
  <button class="btn-logout" id="logoutBtn">Выйти</button>
</div>

<div class="layout">
  <!-- Список клиентов -->
  <div class="sidebar">
    <div style="display:flex;gap:.6rem;align-items:center">
      <input class="search-box" id="searchClients" placeholder="🔍 Поиск клиента..." style="flex:1">
      <select id="filterLogist" style="background:#fff;border:1.5px solid rgba(85,183,189,.2);border-radius:12px;padding:9px 14px;font-size:.85rem;color:#1E3B42;outline:none;font-family:inherit;min-width:160px">
        <option value="">Все логисты</option>
      </select>
    </div>
    <div id="clientsList"><div class="empty-state"><div class="icon">⏳</div><p>Загрузка...</p></div></div>
  </div>

  <!-- Детали клиента -->
  <div id="clientDetail">
    <div class="empty-state detail-card">
      <div class="icon">👈</div>
      <p>Выберите клиента из списка</p>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://gl-api.gltransam.workers.dev';
const SESSION_MAX = 12 * 60 * 60 * 1000;
const user = localStorage.getItem('gl_staff_user');
const loginTime = parseInt(localStorage.getItem('gl_staff_login_time') || '0');
if (!user || (Date.now() - loginTime) > SESSION_MAX) { localStorage.removeItem('gl_staff_user'); window.location.href = 'staff.html'; }

document.getElementById('logoutBtn').addEventListener('click', () => {
  ['gl_staff_user','gl_staff_login_time','gl_staff_token'].forEach(k => localStorage.removeItem(k));
  window.location.href = 'staff.html';
});

const isAdmin = localStorage.getItem('gl_staff_role') === 'admin';

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmt(n) { return Math.round(n||0).toLocaleString('ru'); }

const sl = { loading:'Загрузка', onroad:'В пути', loaded:'Прибыл', completed:'Завершён' };
const sc = { loading:'status-loading', onroad:'status-onroad', loaded:'status-loaded', completed:'status-completed' };

let allCargo = [], allClients = [];
let currentClient = null;

async function load() {
  const [cargoR, clientsR] = await Promise.all([
    fetch(WORKER + '/api/cargo').then(r => r.json()),
    fetch(WORKER + '/api/clients').then(r => r.json()),
  ]);
  allCargo = cargoR;
  allClients = clientsR;

  // Добавляем клиентов из сделок которых нет в базе клиентов
  const names = new Set(allClients.map(c => c.name));
  allCargo.forEach(c => { if (c.client_name && !names.has(c.client_name)) { allClients.push({ name: c.client_name }); names.add(c.client_name); } });
  allClients.sort((a,b) => a.name.localeCompare(b.name));

  // Заполняем список логистов
  const logists = [...new Set(allCargo.map(c => c.logist).filter(Boolean))].sort();
  const sel = document.getElementById('filterLogist');
  sel.innerHTML = '<option value="">Все логисты</option>' +
    logists.map(l => `<option value="${l}">${l}</option>`).join('');
  renderClientsList(allClients);
}

function getClientStats(name) {
  const deals = allCargo.filter(c => c.client_name === name);
  const totalAMD = deals.reduce((s,c) => s + (parseFloat(c.client_price||0) * getRate(c.client_currency||c.currency||'USD')), 0);
  const paidAMD  = deals.filter(c=>c.client_paid).reduce((s,c) => s + (parseFloat(c.client_price||0) * getRate(c.client_currency||c.currency||'USD')), 0);
  const profit   = deals.reduce((s,c) => {
    const cl = parseFloat(c.client_price||0) * getRate(c.client_currency||c.currency||'USD');
    const cr = parseFloat(c.carrier_price||0) * getRate(c.carrier_currency||c.currency||'USD');
    return s + cl - cr;
  }, 0);
  return { deals, totalAMD, paidAMD, profit };
}

function getRate(cur) {
  const rates = { USD: 367, EUR: 418, RUB: 4.73, AMD: 1 };
  return rates[cur] || 367;
}

function renderClientsList(clients) {
  const el = document.getElementById('clientsList');
  if (!clients.length) { el.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Не найдено</p></div>'; return; }
  el.innerHTML = clients.map(c => {
    const stats = getClientStats(c.name);
    return `<div class="client-card ${currentClient === c.name ? 'active' : ''}" onclick="openClient('${c.name.replace(/'/g,"\\'")}')">
      <div class="client-name">${esc(c.name)}</div>
      <div class="client-meta">
        <span class="badge badge-deals">${stats.deals.length} сделок</span>
        <span class="badge badge-amount">֏${fmt(stats.totalAMD)}</span>
      </div>
    </div>`;
  }).join('');
}

function openClient(name) {
  currentClient = name;
  renderClientsList(allClients.filter(c => {
    const q = document.getElementById('searchClients').value.toLowerCase();
    return !q || c.name.toLowerCase().includes(q);
  }));

  const { deals, totalAMD, paidAMD, profit } = getClientStats(name);
  const unpaidAMD = totalAMD - paidAMD;
  const completed = deals.filter(c => c.status === 'completed').length;

  // WhatsApp номер если есть
  const waNum = '+37400000000'; // placeholder
  const waMsg = encodeURIComponent(`Здравствуйте! Это GL Logistics. По вашим сделкам...`);

  document.getElementById('clientDetail').innerHTML = `
    <div class="detail-card">
      <div class="client-header">
        <div>
          <div class="client-title">👤 ${esc(name)}</div>
          <div style="color:#8fa8ab;font-size:.75rem;margin-top:4px">${deals.length} сделок · первая ${deals[deals.length-1]?.load_date||'—'}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:flex-start">
          <a class="wa-btn" href="https://wa.me/${waNum}?text=${waMsg}" target="_blank">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            WhatsApp
          </a>
          <button onclick="deleteClient('${name.replace(/'/g,"\\'")}')" style="background:#FEF2F2;color:#C62828;border:1.5px solid rgba(198,40,40,.2);border-radius:8px;padding:6px 12px;font-size:.75rem;font-weight:700;cursor:pointer">🗑 Удалить</button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat"><div class="val">${deals.length}</div><div class="lbl">Сделок</div></div>
        <div class="stat"><div class="val">֏${fmt(totalAMD)}</div><div class="lbl">Оборот</div></div>
        <div class="stat green"><div class="val">֏${fmt(profit)}</div><div class="lbl">Прибыль</div></div>
        <div class="stat ${unpaidAMD > 0 ? 'red' : 'green'}"><div class="val">֏${fmt(unpaidAMD)}</div><div class="lbl">${unpaidAMD > 0 ? '⚠️ Не оплачено' : '✅ Всё оплачено'}</div></div>
      </div>

      <h3>История сделок</h3>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Дата</th><th>Маршрут</th><th>Товар</th><th>Сумма</th><th>Статус</th><th>Оплата</th><th>Логист</th>
          </tr></thead>
          <tbody>
            ${deals.map(c => `<tr>
              <td>${c.load_date||'—'}</td>
              <td>${esc(c.city_load||'')} → ${esc(c.city_unload||'')}</td>
              <td>${esc(c.product||'')}</td>
              <td>${c.client_currency==='EUR'?'€':'$'}${parseFloat(c.client_price||0).toLocaleString()}</td>
              <td><span class="status-badge ${sc[c.status]||''}">${sl[c.status]||c.status}</span></td>
              <td><span class="paid-badge ${c.client_paid?'paid-yes':'paid-no'}">${c.client_paid?'✓ Оплачено':'✗ Ждём'}</span></td>
              <td>${esc(c.logist||'')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

async function deleteClient(name) {
  if (!confirm(`Удалить клиента "${name}"?\nЭто только удалит его из базы клиентов. Сделки останутся.`)) return;
  await fetch(WORKER + '/api/clients/' + encodeURIComponent(name), { method: 'DELETE' });
  currentClient = null;
  document.getElementById('clientDetail').innerHTML = '<div class="empty-state detail-card"><div class="icon">👈</div><p>Выберите клиента из списка</p></div>';
  await load();
}

function applyFilters() {
  const q = document.getElementById('searchClients').value.toLowerCase();
  const logist = document.getElementById('filterLogist').value;
  let filtered = allClients;
  if (q) filtered = filtered.filter(c => c.name.toLowerCase().includes(q));
  if (logist) filtered = filtered.filter(c => {
    const deals = allCargo.filter(d => d.client_name === c.name);
    return deals.some(d => d.logist === logist);
  });
  renderClientsList(filtered);
}
document.getElementById('searchClients').addEventListener('input', applyFilters);
document.getElementById('filterLogist').addEventListener('change', applyFilters);

load();
</script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
