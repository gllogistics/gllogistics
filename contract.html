<h3>1. ՊԱՅՄԱՆԱԳՐԻ ԱՌԱՐԿԱՆ</h3>
<p>1.1. Սույն Պայմանագիրը կարգավորում է Կողմերի հարաբերությունները Տրանսպորտային առաքողի կողմից Պատվիրատուի բեռների փոխադրումների և տրանսպորտային առաքման ծառայության (ՏԱԾ) հետ կապված Պատվիրատուի հանձնարարությունները կատարելիս:</p>
<p>1.2. Պատվիրատուն հանձնարարում է, իսկ Տրանսպորտային առաքողը կազմակերպում և կատարում է տրանսպորտի բոլոր տեսակներով արտահանվող և ներմուծվող բեռների փոխադրումը, դրանց ՏԱԾ-ի իրականացումը նավահանգիստներում, բազաներում և Տրանսպորտային առաքողի տրանսպորտային առաքման կենտրոններում, սահմանային երկաթուղային կայարաններում և ավտոմոբիլային անցակետերում ինչպես ԱՊՀ-ի, այնպես էլ այլ պետությունների տարածքում։</p>

<p>1.4. Յուրաքանչյուր անգամ փոխադրվող բեռը, դրա քանակը և այլ բնութագրիչները սահմանվում են Հավելված 1-ով նախատեսված Տրանսպորտային առաքողին ներկայացված հայտով։</p>
<p>1.5. Սույն պայմանագրով նշանակման վայր է համարվում «________», իսկ հանձման վայր է համարվում «_________» հասցեն ըստ հավելված մեկի՝ «Հանձնման վայր», եթե այլ բան նախատեսված չէ Տրանսպորտային առաքողին ներկայացված հայտով։</p>
<p>1.6. Տրանսպորտային առաքողը պատասխանատվություն չի կրում բեռի պարունակության որակի, համապատասխանության կամ փաստացի բնութագրերի համար:</p>
<h3>2. ՏՐԱՆՍՊՈՐՏԱՅԻՆ ԱՌԱՔՄԱՆ ԵՎ ԲԵՌՆԵՐԻ ՓՈԽԱԴՐՄԱՆ ՀԱՅՏԻ, ԳՆԱՅԻՆ ԱՌԱՋԱՐԿԻ ՆԵՐԿԱՅԱՑՄԱՆ ԵՎ ՀԱՍՏԱՏՄԱՆ ԿԱՐԳԸ</h3>
<p>2.1. Յուրաքանչյուր դեպքում բեռների փոխադրումը և տրանսպորտային առաքումն իրականացվում է Պատվիրատուի կողմից Տրանսպորտային առաքողին ներկայացված հայտի (այսուհետ նաև՝ «Հայտ») հիման վրա։</p>
<p>2.2. Հայտի ձևը սահմանվում է Պայմանագրի անբաժանելի մաս հանդիսացող Հավելված 1-ով։</p>
<p>2.3. Պատվիրատուն Հայտը ներկայացնում է ոչ ուշ, քան Բեռի բարձումից 1 (մեկ) աշխատանքային օր առաջ:</p>
<p>2.4. Տրանսպորտային առաքողը պարտավոր է Պատվիրատուի կողմից Հայտը ներկայացնելուց հետո 1 աշխատանքային օրվա ընթացքում հաստատել այն և Պատվիրատուին ներկայացնել գնառաջարկ կամ մերժել այն։</p>
<p>2.5. Պայմանագրի 2.4 կետով նախատեսված ժամկետում Տրանսպորտային առաքողի կողմից Հայտը չընդունելու և մերժման մասին Պատվիրատուին չծանուցելու դեպքում Հայտը համարվում է մերժված։</p>
<p>2.6. Տրանսպորտային առաքողը Պայմանագրի 2.4 կետով նախատեսված ժամկետում Պատվիրատուին ներկայացնում է Հայտով սահմանված բեռների փոխադրման և տրանսպորտային առաքման գնառաջարկ (այսուհետ՝ «Գնառաջարկ»):</p>
<p>2.7. Պատվիրատուն պարտավոր է Տրանսպորտային առաքողից Գնառաջարկը ստանալուց հետո 3-օրյա ժամկետում ընդունել կամ մերժել այն:</p>
<p>2.8. Պատվիրատուի կողմից Տրանսպորտային առաքողի ներկայացրած Գնառաջարկի մերժումը չի համարվում Պայմանագրի կատարումից հրաժարում և Պատվիրատուի համար չի առաջացնում որևէ պարտավորություն և/կամ պատասխանատվություն:</p>
<p>2.9. Յուրաքանչյուր դեպքում բեռների փոխադրման և տրանսպորտային առաքման գինը Պատվիրատուի կողմից վճարվում է հետևյալ կերպ. Բեռի փոխադրման և տրանսպորտային առաքման արժեքի 100 (հարյուր) տոկոսը վճարվում է Տրանսպորտային առաքողին բեռը Պատվիրատուին հանձնելուց հետո, Տրանսպորտային առաքողի կողմից դուրս գրված հաշվարկային փաստաթղթի հիման վրա՝ այն ստանալուց հետո 15 (տասնհինգ) աշխատանքային օրվա ընթացքում:</p>
<p>2.10. Գնառաջարկում չներառված և Պատվիրատուի կողմից չհաստատված լրացուցիչ ծախսերը Տրանսպորտային առաքողն իրականացնում է Պատվիրատուի հետ համաձայնեցնելուց հետո, բացառությամբ այն դեպքերի, երբ անհնարին է Պատվիրատուի հաստատումը ստանալը և նման ծախսերը անհապաղ չկատարելը կարող է հանգեցնել բեռի վնասման, ոչնչացման և/կամ Պատվիրատուի համար այլ վնասների:</p>
<p>2.11. Պայմանագրի 2.10 կետով նախատեսված լրացուցիչ ծախսեր կատարելու անհրաժեշտության մասին Տրանսպորտային առաքողը պարտավորվում է Պատվիրատուն ծանուցել նման անհրաժեշտություն առաջանալուց հետո անհապաղ:</p>
<p>2.12. Պայմանագրի 2.10 կետով նախատեսված այն բացառիկ դեպքերում, երբ Տրանսպորտային առաքողն իրավասու է կատարել լրացուցիչ ծախսեր առանց դրանք Պատվիրատուի կողմից նախապես հաստատվելու, Տրանսպորտային առաքողը պարտավոր է լրացուցիչ ծախսերը կատարելուց հետո անհապաղ այդ մասին հայտնել Պատվիրատուին:</p>
<p>2.13. Լրացուցիչ ծախսերի հատուցումը Պատվիրատուն կատարում է Տրանսպորտային առաքողի կողմից կազմված հաշվարկային փաստաթղթերի հիման վրա։ Հաշվարկային փաստաթղթերը Պատվիրատուին ներկայացվում են Տրանսպորտային առաքողի կողմից ծախսերը հաստատող փաստաթղթերը ստանալուց հետո երկօրյա ժամկետում:</p>
<p>2.14. Պայմանագրի 2.12 կետով նախատեսված կարգով Տրանսպորտային առաքողի կողմից կատարված լրացուցիչ ծախսերի վերաբերյալ ծանուցում ստանալուց հետո Պատվիրատուն իրավունք ունի առարկություններ ներկայացնել կատարված ծախսերի վերաբերյալ և հիմնավորելով դրանք կատարելու անհրաժեշտության բացակայությունը՝ չհատուցել դրանք:</p>

<h3>3. ԲԵՌՆԵՐԻ ԱՌԱՔՄԱՆ ԵՎ ՏՐԱՆՍՊՈՐՏԱՅԻՆ ԱՌԱՔՄԱՆ ՊԱՅՄԱՆՆԵՐԸ</h3>

<p>3.2. Տրանսպորտային առաքողը պարտավոր է բեռը հասցնել Հանձնման վայր, ոչ ուշ, քան բեռը Նշանակման վայր հասցնելուց հետո 10 օրվա ընթացքում, եթե այլ ժամկետ նախատեսված չէ Հայտով:</p>
<h3>4. ԿՈՂՄԵՐԻ ՊԱՏԱՍԽԱՆԱՏՎՈՒԹՅՈՒՆԸ</h3>
<p>4.1. Կողմերը պատասխանատվություն են կրում սույն Պայմանագրով իրենց պարտավորությունների չկատարման կամ ոչ պատշաճ կատարման համար՝ գործող օրենսդրությանը համապատասխան:</p>
<p>4.2. Կողմերից յուրաքանչյուրը պետք է պատշաճ ձևով կատարի իր պարտականությունները, հնարավորինս աջակցելով մյուս Կողմին:</p>
<p>4.3. Պատվիրատուի կողմից առաքման գումարը Պայմանագրի 2.9 կետով նախատեսված ժամկետում չվճարելու դեպքում Տրանսպորտային առաքողն իրավունք ունի Պատվիրատուից պահանջելու տույժի վճարում յուրաքանչյուր կետանցված օրվա համար վճարման ենթակա գումարի 0.1 տոկոսի չափով:</p>
<p>4.4. Տրանսպորտային առաքողի կողմից սույն պայմանագրով նախատեսված ժամկետում բեռը հանձնման վայր չհասցնելու դեպքում Պատվիրատուն իրավունք ունի Տրանսպորտային առաքողից պահանջելու տույժի վճարում յուրաքանչյուր կետանցված օրվա համար վճարման ենթակա գումարի 0.05 տոկոսի (0.05%) չափով, բայց ոչ ավելի, քան ընդհանուր փոխադրավարձի 5%-ը:</p>
<p>4.5. Բեռի վնասման, ոչնչացման և/կամ բեռնափոխադրման և տրանսպորտային առաքման ծառայության իրականացման ժամկետների խախտման դեպքում</p>
<p>4.6. Տրանսպորտային առաքողը պարտավորվում է հատուցել Պատվիրատուի կրած վնասները, ներառյալ՝ բաց թողնված օգուտը:</p>
<p>4.7. Կողմերը ազատվում են Պայմանագրով պարտավորությունների մասնակի կամ ամբողջովին չկատարման համար իրենց պատասխանատվությունից, եթե դա անհաղթահարելի ուժի ազդեցության արդյունք է:</p>
<p>4.8. Տրանսպորտային առաքողի պատասխանատվությունը</p>
<p>4.8.1. Տրանսպորտային առաքողը պատասխանատվություն է կրում Պատվիրատուին հասցրած վնասների համար:</p>
<p>4.8.2. Տրանսպորտային առաքողը սույն պայմանագրով ստանձնած պարտավորությունը խախտելու համար պատասխանատվություն է կրում ՀՀ քաղաքացիական օրենսգրքի 873-րդ հոդվածով սահմանված հիմքերով և չափով:</p>
<p>4.8.3. Տրանսպորտային առաքողը բեռների փոխադրումը իրականացնում է համաձայն Բեռների միջազգային ավտոտրանսպորտային փոխադրումների պայմանագրի մասին կոնվենցիայի (CMR):</p>
<p>4.8.4. Փոխադրման ժամանակ Տրանսպորտային առաքողի գործողությունների կամ անգործության հետևանքով բեռների վնասման, կորստի կամ պակասորդի դեպքում վերջինս պետք է Պատվիրատուին փոխհատուցի վնասված, կորած կամ պակասած բեռի փաստացի արժեքը՝ հաշվարկված դրա ձեռքբերման արժեքով, բայց ոչ ավելի, քան CMR կոնվենցիայով սահմանված սահմանաչափը: Վնասի հատուցումից բացի, Տրանսպորտային առաքողը Պատվիրատուին չի վերադարձնում փոխադրավարձը վնասված, կորած կամ պակասած բեռի մասով:</p>
<p>4.9. Պատվիրատուի պատասխանատվությունը</p>
<p>4.9.1. Պատվիրատուն պատասխանատվություն է կրում Տրանսպորտային առաքողին հասցրած վնասների համար`

Տրանսպորտային առաքողի հաշիվների հիման վրա վճարումից անհիմն հրաժարվելու կամ ուշացնելու դեպքում:</p>

<h3>5. ՊԱՀԱՆՋՆԵՐԻ ԵՎ ՎԵՃԵՐԻ ԼՈՒԾՄԱՆ ԿԱՐԳԸ</h3>

<p>5.5. Պայմանագրի 5.1-5.3 կետերով նախատեսված պահանջների քննարկման կարգը համարվում է վեճերի լուծման պարտադիր նախադատական (պահանջատիրական) կարգ: Մինչև դատարան դիմելը, պահանջ ներկայացնող Կողմը պարտավոր է պահանջ ուղարկել մյուս Կողմին և ստանալ պատասխան՝ սույն կետով սահմանված ժամկետներում:</p>
<h3>6. ՖՈՐՍ-ՄԱԺՈՐ</h3>
<p>6.1. Կողմերը պատասխանատվություն չեն կրում իրենց պարտականությունների թերի կատարման կամ ընդհանրապես անկատար թողնելու համար, եթե դրանք հետևանքն են այնպիսի հանգամանքների, որոնք Կողմերը չէին կարող կանխատեսել և կանխել հնարավոր միջոցներով, օրինակ՝ հրդեհ, տարերային աղետ, պատերազմ, քաղաքական հուզումներ, պաշարում, գործադուլ, նավահանգիստների ղեկավար մարմինների որոշումներ, մայրուղային ենթակառուցվածքների (ճանապարհների) խաթարում եղանակային վատ պայմաններ (այսուհետ՝ Ֆորս-մաժորային պայմաններ), որոնք խոչընդոտում են պայմանագրային պարտավորությունների կատարմանը: Եթե այդ հանգամանքները կշարունակվեն ավելի քան 60 (վաթսուն) օր, Կողմերից յուրաքանչյուրը իրավունք ունի հրաժարվել սույն Պայմանագրով սահմանված պարտավորությունների կատարումից, ընդ որում կողմերից ոչ մեկը իրավունք չի ունենա պահանջել մյուս Կողմից հնարավոր վնասների փոխատուցում:</p>
<h3>7. ԵԶՐԱՓԱԿԻՉ ԴՐՈՒՅԹՆԵՐ</h3>
<p>7.1. Սույն պայմանագիրը ուժի մեջ է մտնում ստորագրման պահից և գործում է 1 (մեկ) տարի ժամկետով: Պայմանագրի ժամկետը լրանալուց ոչ ուշ, քան 30 (երեսուն) օր առաջ մյուս Կողմին Պայմանագիրը լուծելու մասին գրավոր կերպով չծանուցելու դեպքում Պայմանագրի գործողության ժամկետը յուրաքանչյուր անգամ երկարաձգվում է 1 (մեկ) տարի ժամկետով: Երկարաձգումների քանակը սահմանափակված չէ:</p>
<p>7.2. Կողմերից յուրաքանչյուրը իրավունք ունի հրաժարվել սույն Պայմանագրի կատարումից՝ 30 օր առաջ գրավոր նախազգուշացնելով մյուս Կողմին: Պայմանագրի կատարումից հրաժարվող Կողմը պարտավոր է փոխհատուցել մյուս Կողմին Պայմանագրի լուծման հետ կապված ուղղակի և փաստացի կատարված ծախսերը:</p>
<p>7.3. Պատվիրատուն անհրաժեշտ բոլոր ծանուցումները Տրանսպորտային առաքողին ուղարկում է Տրանսպորտային առաքողի/Տրանսպորտային առաքողի լիազորված անձի էլեկտրոնային հասցեին, ք․ Երևան, Էրեբունի, Նոր-Արեշ 12փ 99/1 18 փոստային հասցեին կամ անձամբ Տրանսպորտային առաքողի լիազոր ներկայացուցչին տրամադրելու միջոցով՝ ստանալու մասին փաստը հավաստող համապատասխան նշում կատարելով: Ծանուցման եղանակի ընտրությունն իրականացվում է Պատվիրատուի հայեցողությամբ:</p>

let currentLang='am',currentType='customer',stampDataUrl=null,signatureDataUrl=null,contractNumber='',signaturePad;

function initSignaturePad(){canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;signaturePad=new SignaturePad(canvas,{backgroundColor:'rgb(255,255,255)',penColor:'rgb(0,0,0)',minWidth:0.8,maxWidth:2.2});}
initSignaturePad();window.addEventListener('resize',()=>{const d=signaturePad.toData();initSignaturePad();if(d&&d.length>0)signaturePad.fromData(d);});

canvas.addEventListener('mouseup',()=>{if(!signaturePad.isEmpty()){signatureDataUrl=signaturePad.toDataURL('image/png');document.getElementById('signaturePreview').src=signatureDataUrl;document.getElementById('signaturePreview').style.display='block';renderContract();}});
canvas.addEventListener('touchend',()=>{if(!signaturePad.isEmpty()){signatureDataUrl=signaturePad.toDataURL('image/png');document.getElementById('signaturePreview').src=signatureDataUrl;document.getElementById('signaturePreview').style.display='block';renderContract();}});

    const companyName = document.getElementById('company').value;
    const signatoryName = document.getElementById('signatory').value;
    const fdMain = new FormData();
    fdMain.append('contract_number', contractNumber); fdMain.append('contract_type', currentType);
    fdMain.append('company', companyName); fdMain.append('signatory', signatoryName);
    fdMain.append('customer_email', customerEmail); fdMain.append('cloudinary_pdf_url', cloudinaryUrl);
    fdMain.append('message', `New signed contract №${contractNumber}\n${cloudinaryUrl}`);
    await fetch(FORMSPREE_MAIN, { method: 'POST', body: fdMain, headers: { 'Accept': 'application/json' } });
    const fdClient = new FormData();
    fdClient.append('email', customerEmail);
    fdClient.append('contract_number', contractNumber); fdClient.append('contract_type', currentType);
    fdClient.append('company', companyName);
    fdClient.append('message', `Dear ${signatoryName},\n\nYour signed contract (No. ${contractNumber}) is ready.\n\nDownload: ${cloudinaryUrl}\n\nBest regards,\nGL Logistics LLC\n📞 +374 93 66 14 54`);
    fdClient.append('_subject', `GL Logistics — Signed Contract ${contractNumber}`);
    await fetch(FORMSPREE_CLIENT, { method: 'POST', body: fdClient, headers: { 'Accept': 'application/json' } });
    document.getElementById('contractForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) { console.error(err); alert('Error: ' + err.message); }
  finally { btn.disabled = false; btn.innerHTML = uiLabels[currentLang]?.submit_btn || 'SUBMIT'; }
});

updateUILabels();contractNumber=generateContractNumber();document.getElementById('contractNumberDisplay').textContent=contractNumber;renderContract();
</script>
