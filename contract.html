<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="GL Logistics — ստորագրեք ձեր փոխադրման պայմանագիրը առցանց։">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.cloudinary.com https://formspree.io https://gl-api.gltransam.workers.dev; object-src 'none'; base-uri 'self';">
  <title>GL Logistics | Պայմանագրի ստորագրում</title>
  <link rel="icon" type="image/png" href="images/GL_LOGISTICs_line_-09.jpg.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B171C; font-family: 'Inter', sans-serif; padding: 2rem 1.5rem; color: #EDF4F6; min-height: 100vh; }
    .app-wrapper { max-width: 1440px; margin: 0 auto; }
    .top-bar { background: rgba(20,38,44,0.9); backdrop-filter: blur(16px); border-radius: 60px; padding: 0.7rem 2rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; border: 1px solid rgba(85,183,189,0.5); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.95rem; text-decoration: none; color: inherit; }
    .brand:hover { opacity: 0.85; }
    .brand-logo { height: 40px; width: auto; object-fit: contain; cursor: pointer; }
    .type-group { display: flex; gap: 6px; background: #1E3B42; border-radius: 40px; padding: 4px; }
    .type-btn { padding: 0.5rem 1.2rem; border-radius: 40px; font-weight: 600; font-size: 0.75rem; border: none; cursor: pointer; background: transparent; color: #CAE9ED; transition: 0.25s; white-space: nowrap; }
    .type-btn.active { background: #55B7BD; color: #0E2126; box-shadow: 0 0 10px rgba(85,183,189,0.5); }
    .lang-group { display: flex; gap: 6px; }
    .lang-btn { background: #1E3B42; border: none; padding: 0.45rem 1rem; border-radius: 40px; font-weight: 600; font-size: 0.75rem; color: #CAE9ED; cursor: pointer; transition: 0.2s; }
    .lang-btn.active { background: #55B7BD; color: #0E2126; box-shadow: 0 0 8px rgba(85,183,189,0.7); }
    .dashboard { display: grid; grid-template-columns: 1.4fr 0.9fr; gap: 1.5rem; }
    @media (max-width: 1100px) { .dashboard { grid-template-columns: 1fr; } }
    .contract-card { background: #FFFEF8; border-radius: 28px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5); overflow: visible; }
    .contract-scroll { overflow-y: visible; padding: 2rem 2rem; }
    .contract-preview { font-family: 'Times New Roman', 'Georgia', serif; font-size: 12px; line-height: 1.5; color: #1E2F33; position: relative; min-height: 600px; }
    /* Draggable stamp overlay */
    #stampOverlay {
      position: absolute; cursor: move; user-select: none;
      border: 2px dashed rgba(85,183,189,0.6); border-radius: 4px;
      display: none; touch-action: none;
    }
    #stampOverlay:hover { border-color: #55B7BD; }
    #stampOverlay img { width: 100%; height: 100%; object-fit: contain; opacity: 0.82; display: block; }
    #stampResizeHandle {
      position: absolute; bottom: -6px; right: -6px;
      width: 14px; height: 14px; background: #55B7BD; border-radius: 50%;
      cursor: se-resize; border: 2px solid #fff;
    }
    #stampHint {
      position: absolute; bottom: -22px; left: 0; font-size: 10px;
      color: #55B7BD; white-space: nowrap; pointer-events: none;
    }
    .contract-preview h2 { font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 0.4rem; color: #005f67; }
    .contract-preview h3 { font-size: 12px; font-weight: 700; margin: 0.7rem 0 0.3rem; color: #1C6D76; border-left: 3px solid #55B7BD; padding-left: 8px; }
    .contract-preview p { margin-bottom: 0.2rem; text-align: justify; }
    .contract-preview .center { text-align: center; }
    .contract-preview .right { text-align: right; }
    .contract-preview .parties-row { display: flex; justify-content: space-between; gap: 1rem; margin: 0.8rem 0; }
    .contract-preview .party-col { width: 48%; }
    .contract-preview .party-col p { margin-bottom: 0.15rem; }
    .party-col .line { border-bottom: 1px solid #2A5E66; margin-top: 1.8rem; margin-bottom: 0.2rem; }
    
    .stamp-sign-row { display: flex; align-items: center; gap: 35px; justify-content: flex-end; margin-top: 0.3rem; margin-bottom: 0.3rem; padding-right: 20px; min-height: 100px; }
    .sig-img-display { max-width: 160px; max-height: 65px; object-fit: contain; flex-shrink: 0; }
    .stamp-box { width: 120px; height: 120px; opacity: 0.8; transform: rotate(-14deg); flex-shrink: 0; }
    .stamp-box img { width: 100%; height: 100%; object-fit: contain; }
    .form-panel { background: #152A30; border-radius: 28px; padding: 1.5rem; border: 1px solid #2F6C74; }
    .form-panel h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.2rem; color: #55B7BD; border-left: 4px solid #55B7BD; padding-left: 0.8rem; }
    .input-group { margin-bottom: 0.7rem; }
    .input-group label { font-size: 0.65rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.06em; color: #B9DFE4; display: block; margin-bottom: 0.2rem; }
    .input-group input { width: 100%; background: #0C2228; border: 1px solid #336D76; border-radius: 22px; padding: 10px 16px; color: white; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
    .upload-row { display: flex; gap: 0.8rem; margin: 0.6rem 0; }
    .stamp-upload, .signature-area { flex: 1; background: #0A1F25; border-radius: 18px; padding: 0.8rem; text-align: center; border: 1px dashed #55B7BD; cursor: pointer; font-size: 0.7rem; }
    .signature-canvas-box { background: white; border-radius: 12px; overflow: hidden; margin: 0.4rem 0; }
    #signatureCanvas { width: 100%; height: 80px; background: #fff; display: block; touch-action: none; cursor: crosshair; }
    .sig-preview-img { max-width: 100px; max-height: 40px; object-fit: contain; display: none; margin-top: 5px; border-radius: 4px; }
    .stamp-preview-img { max-width: 60px; max-height: 60px; object-fit: contain; display: none; margin-top: 5px; border-radius: 8px; }
    .checkbox-group { display: flex; gap: 10px; margin: 0.8rem 0; align-items: flex-start; }
    .checkbox-group input { margin-top: 3px; accent-color: #55B7BD; transform: scale(1.2); }
    .btn-submit { width: 100%; background: linear-gradient(100deg, #55B7BD, #31838A); border: none; padding: 13px; border-radius: 50px; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.07em; font-family: 'Plus Jakarta Sans', sans-serif; color: #0D1F23; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(85,183,189,0.6); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .success-msg { background: #1A423F; border-radius: 24px; padding: 1.5rem; text-align: center; margin-top: 1rem; display: none; }
    .success-msg h3 { color: #55B7BD; margin-bottom: 0.5rem; }
    .legal-note { font-size: 0.65rem; text-align: center; margin-top: 0.8rem; color: #9FCBD0; }
    .sep { border: none; border-top: 1px solid #ccc; margin: 0.5rem 0; }
    /* Футер справа в самом низу */
    .doc-footer { position: absolute; bottom: 2px; right: 10px; font-size: 7px; color: #4a7a80; text-align: right; opacity: 0.8; pointer-events: none; z-index: 2; white-space: nowrap; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <a href="/" class="brand">
      <img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL Logistics" class="brand-logo">
      <span data-i18n="brand_title">Ջի Էլ Լոգիստիկս • ՊԱՅՄԱՆԱԳՐԻ ՍՏՈՐԱԳՐՈՒՄ</span>
    </a>
    <div class="type-group">
      <button class="type-btn active" data-type="customer" data-i18n="btn_customer">👤 ՊԱՏՎԻՐԱՏՈՒ → ՋԻ ԷԼ</button>
      <button class="type-btn" data-type="carrier" data-i18n="btn_carrier">🚛 ՋԻ ԷԼ → ՓՈԽԱԴՐՈՂ</button>
    </div>
    <div class="lang-group">
      <button class="lang-btn active" data-lang="am">🇦🇲 HAY</button>
      <button class="lang-btn" data-lang="ru">🇷🇺 RU</button>
      <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
    </div>
  </div>
  <div class="dashboard">
    <div class="contract-card"><div class="contract-scroll"><div class="contract-preview" id="contractPreview">
      <div id="stampOverlay">
        <img id="stampOverlayImg" src="" alt="stamp">
        <div id="stampResizeHandle"></div>
        <div id="stampHint">↔ перетащите · ↘ тяните угол</div>
      </div>
    </div></div></div>
    <div class="form-panel">
      <h2 data-i18n="form_title">📄 ՍՏՈՐԱԳՐԵԼ ՊԱՅՄԱՆԱԳԻՐԸ</h2>
      <form id="contractForm">
        <!-- НОМЕР ДОГОВОРА ВРУЧНУЮ -->
        <div class="input-group"><label data-i18n="contract_number_label">ՊԱՅՄԱՆԱԳՐԻ ՀԱՄԱՐ (ԹԻՎ)</label><input type="text" id="contractNumberInput" placeholder="GL-C-2026-XXXX"></div>
        <div class="input-group"><label data-i18n="company_label">ԸՆԿԵՐՈՒԹՅԱՆ ԱՆՎԱՆՈՒՄ *</label><input type="text" id="company" placeholder="ՍՊԸ 'Անվանում'" required></div>
        <div class="input-group"><label data-i18n="tax_label">ՀՎՀՀ</label><input type="text" id="taxId" placeholder="ՀՎՀՀ համար"></div>
        <div class="input-group"><label data-i18n="address_label">ՀԱՍՑԵ</label><input type="text" id="address" placeholder="Քաղաք, Փողոց, Շենք"></div>
        <div class="input-group"><label data-i18n="signatory_label">ՍՏՈՐԱԳՐՈՂԻ ԱՆՈՒՆ *</label><input type="text" id="signatory" placeholder="Անուն Ազգանուն" required></div>
        <div class="input-group"><label data-i18n="position_label">ՊԱՇՏՈՆ</label><input type="text" id="position" placeholder="Տնօրեն"></div>
        <div class="input-group"><label data-i18n="date_label">ԱՄՍԱԹԻՎ *</label><input type="date" id="signDate" required></div>
        <div class="input-group"><label data-i18n="email_label">ԷԼ. ՓՈՍՏ *</label><input type="email" id="email" placeholder="your@email.com" required></div>
        <div class="input-group"><label data-i18n="phone_label">ՀԵՌԱԽՈՍ</label><input type="tel" id="phone" placeholder="+374 XX XXX XXX"></div>
        <div class="input-group"><label data-i18n="bank_label">ԲԱՆԿ / БАНК / BANK</label><input type="text" id="bankName" placeholder="«Էվոկաբանկ» ՓԲԸ"></div>
        <div class="input-group"><label data-i18n="account_label">Հ/Հ · Р/С · ACCOUNT NO.</label><input type="text" id="bankAccount" placeholder="1660030207153200"></div>
        <div class="upload-row">
          <div class="stamp-upload" id="stampTrigger">🏢 <span data-i18n="upload_stamp">ԿՆԻՔ</span><input type="file" id="stampInput" accept="image/*" style="display:none;"><img id="stampPreview" class="stamp-preview-img" alt="stamp"></div>
          <div class="signature-area">✍️ <span data-i18n="upload_signature">ՍՏՈՐԱԳՐՈՒԹՅՈՒՆ</span><div class="signature-canvas-box"><canvas id="signatureCanvas"></canvas></div><button type="button" id="clearSignature" style="background:#3a5a60; border:none; color:white; padding:4px 12px; border-radius:20px; margin-top:5px; cursor:pointer; font-size:0.7rem;">Մաքրել</button><img id="signaturePreview" class="sig-preview-img" alt="signature"></div>
        </div>
        <div class="checkbox-group"><input type="checkbox" id="agree" required><label for="agree" data-i18n="agree_text">Ես կարդացել և ընդունում եմ պայմանագրի բոլոր պայմանները:</label></div>
        <button type="submit" class="btn-submit" data-i18n="submit_btn">✍️ ՍՏՈՐԱԳՐԵԼ ԵՎ ՈՒՂԱՐԿԵԼ</button>
      </form>
      <div class="success-msg" id="successMsg">
        <span style="font-size:2.5rem;">✅</span>
        <h3 data-i18n="success_title">Պայմանագիրը հաջողությամբ ստորագրված է:</h3>
        <p data-i18n="success_msg">PDF հղումը ուղարկվել է Ձեր էլ. փոստին:</p>
        <p style="font-size:0.8rem; color:#B9DFE4; margin-top:10px;">Պայմանագիր #<span id="contractNumberDisplay">---</span></p>
      </div>
      <div class="legal-note">🔒 Իրավաբանորեն պարտադիր էլեկտրոնային ստորագրություն • ՀՀ օրենսդրություն</div>
    </div>
  </div>
</div>

<script src="js/contract-shared.js"></script>
<script src="js/contract.js"></script>
</body>
</html>
