function sigStamp(sig, st) {
  if (!sig && !st) return '<div style="border-bottom:1px solid #2A5E66;margin-top:2rem;"></div>';

let currentLang='am',currentType='customer',stampDataUrl=null,signatureDataUrl=null,contractNumber='',signaturePad;
const previewDiv=document.getElementById('contractPreview'),canvas=document.getElementById('signatureCanvas');
function generateContractNumber(){const y=new Date().getFullYear(),p=currentType==='customer'?'GL-C':'GL-T',r=Math.floor(Math.random()*9000)+1000;return`${p}-${y}-${r}`;}
function initSignaturePad(){canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;signaturePad=new SignaturePad(canvas,{backgroundColor:'rgb(255,255,255)',penColor:'rgb(0,0,0)',minWidth:0.8,maxWidth:2.2});}
initSignaturePad();window.addEventListener('resize',()=>{const d=signaturePad.toData();initSignaturePad();if(d&&d.length>0)signaturePad.fromData(d);});
document.getElementById('clearSignature').addEventListener('click',()=>{signaturePad.clear();signatureDataUrl=null;document.getElementById('signaturePreview').style.display='none';renderContract();});
canvas.addEventListener('mouseup',()=>{if(!signaturePad.isEmpty()){signatureDataUrl=signaturePad.toDataURL('image/png');document.getElementById('signaturePreview').src=signatureDataUrl;document.getElementById('signaturePreview').style.display='block';renderContract();}});
canvas.addEventListener('touchend',()=>{if(!signaturePad.isEmpty()){signatureDataUrl=signaturePad.toDataURL('image/png');document.getElementById('signaturePreview').src=signatureDataUrl;document.getElementById('signaturePreview').style.display='block';renderContract();}});
document.getElementById('stampTrigger').addEventListener('click',()=>document.getElementById('stampInput').click());
document.getElementById('stampInput').addEventListener('change',(e)=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=(ev)=>{stampDataUrl=ev.target.result;document.getElementById('stampPreview').src=stampDataUrl;document.getElementById('stampPreview').style.display='block';renderContract();};r.readAsDataURL(f);}});
function renderContract(){const c=document.getElementById('company').value.trim()||'[COMPANY]',t=document.getElementById('taxId').value.trim()||'________',a=document.getElementById('address').value.trim()||'________',s=document.getElementById('signatory').value.trim()||'[NAME]',p=document.getElementById('position').value.trim()||'Director',d=document.getElementById('signDate').value||new Date().toISOString().slice(0,10);if(!contractNumber)contractNumber=generateContractNumber();document.getElementById('contractNumberDisplay').textContent=contractNumber;const fn=contracts[currentType][currentLang];previewDiv.innerHTML=fn(c,t,a,s,p,d,contractNumber,signatureDataUrl,stampDataUrl);}
document.querySelectorAll('.type-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.type-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentType=b.dataset.type;contractNumber=generateContractNumber();renderContract();}));
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentLang=b.dataset.lang;updateUILabels();renderContract();}));
function updateUILabels(){const t=uiLabels[currentLang];if(!t)return;document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.dataset.i18n;if(t[k])e.innerHTML=t[k];});}
['company','taxId','address','signatory','position','signDate'].forEach(id=>{document.getElementById(id)?.addEventListener('input',renderContract);});
document.getElementById('signDate').valueAsDate=new Date();

// ── Submit ────────────────────────────────────────────────────────────────────
document.getElementById('contractForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  if (!document.getElementById('agree').checked) { alert(uiLabels[currentLang]?.agree_text); return; }
  const btn = this.querySelector('.btn-submit'); btn.disabled = true; btn.innerHTML = '⏳ GENERATING PDF...';
  try {
    const canvasEl = await html2canvas(previewDiv, { scale: 1.5, useCORS: true, backgroundColor: '#FFFFFF' });
    const { jsPDF } = window.jspdf; const pdf = new jsPDF('p', 'mm', 'a4');
    const imgData = canvasEl.toDataURL('image/png');
    const w = pdf.internal.pageSize.getWidth() - 20;
    const h = (canvasEl.height * w) / canvasEl.width;
    pdf.addImage(imgData, 'PNG', 10, 10, w, h);
    const pdfBlob = pdf.output('blob');
    const pdfFile = new File([pdfBlob], `contract_${contractNumber}.pdf`, { type: 'application/pdf' });
    
    btn.innerHTML = '📤 UPLOADING...';
    let cloudinaryUrl = '';
    try {
      const cf = new FormData(); cf.append('file', pdfFile); cf.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      const cr = await fetch(CLOUDINARY_URL, { method: 'POST', body: cf });
      const cd = await cr.json();
      console.log('CLOUDINARY:', JSON.stringify(cd));
      if (cd.secure_url) { 
        cloudinaryUrl = cd.secure_url; 
      } else { 
        alert('Cloudinary error: ' + (cd.error?.message || JSON.stringify(cd))); 
        btn.disabled = false; btn.innerHTML = uiLabels[currentLang]?.submit_btn; return; 
      }
    } catch (ce) { 
      alert('Cloudinary exception: ' + ce.message); 
      btn.disabled = false; btn.innerHTML = uiLabels[currentLang]?.submit_btn; return; 
    }
    
    btn.innerHTML = '📧 SENDING...';
    const customerEmail = document.getElementById('email').value;
    const companyName = document.getElementById('company').value;
    const signatoryName = document.getElementById('signatory').value;
    const fdMain = new FormData();
    fdMain.append('contract_number', contractNumber); fdMain.append('contract_type', currentType);
    fdMain.append('company', companyName); fdMain.append('signatory', signatoryName);
    fdMain.append('customer_email', customerEmail); fdMain.append('cloudinary_pdf_url', cloudinaryUrl);
    fdMain.append('message', `New signed contract №${contractNumber}\n${cloudinaryUrl}`);
    await fetch(FORMSPREE_MAIN, { method: 'POST', body: fdMain, headers: { 'Accept': 'application/json' } });
    const fdClient = new FormData();
    fdClient.append('email', customerEmail);
    fdClient.append('contract_number', contractNumber); fdClient.append('contract_type', currentType);
    fdClient.append('company', companyName);
    fdClient.append('message', `Dear ${signatoryName},\n\nYour signed contract (No. ${contractNumber}) is ready.\n\nDownload: ${cloudinaryUrl}\n\nBest regards,\nGL Logistics LLC\n📞 +374 93 66 14 54`);
    fdClient.append('_subject', `GL Logistics — Signed Contract ${contractNumber}`);
    await fetch(FORMSPREE_CLIENT, { method: 'POST', body: fdClient, headers: { 'Accept': 'application/json' } });
    document.getElementById('contractForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) { console.error(err); alert('Error: ' + err.message); }
  finally { btn.disabled = false; btn.innerHTML = uiLabels[currentLang]?.submit_btn || 'SUBMIT'; }
});

updateUILabels();contractNumber=generateContractNumber();document.getElementById('contractNumberDisplay').textContent=contractNumber;renderContract();
</script>
