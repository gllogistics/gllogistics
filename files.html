<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GL Logistics | Файлы</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#55B7BD">
<script src="/js/emoji-remover.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f0f4f5; color: #1E3B42; min-height: 100vh; }
.app-wrapper { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
.top-bar { background: #fff; border-radius: 0 0 20px 20px; padding: .8rem 1.4rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1.2rem; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.brand { display: flex; align-items: center; gap: .6rem; font-weight: 800; font-size: 1rem; color: #1E3B42; text-decoration: none; }
.brand img { height: 32px; }
.btn-logout { margin-left: auto; background: none; border: 1.5px solid #e0eaeb; border-radius: 10px; padding: 6px 14px; color: #8fa8ab; font-size: .78rem; cursor: pointer; font-family: inherit; }
.nav-links { display: flex; gap: 2px; margin-bottom: 1.4rem; padding: 6px; background: rgba(255,255,255,0.7); border-radius: 16px; width: fit-content; border: 1px solid rgba(85,183,189,0.15); flex-wrap: wrap; }
.nav-links a { background: transparent; color: #5a7a80; padding: 8px 14px; border-radius: 12px; text-decoration: none; font-size: 11px; font-weight: 600; transition: background .2s, color .2s; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; text-align: center; }
.nav-links a svg { opacity: 0.6; width: 18px; height: 18px; }
.nav-links a:hover { background: #E8F6F6; color: #1E7A80; }
.nav-links a:hover svg { opacity: 1; }
.nav-links a.active { background: #55B7BD; color: #fff; }
.nav-links a.active svg { opacity: 1; stroke: #fff; }

/* Toolbar */
.toolbar { display: flex; gap: .6rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
.toolbar input { background: #fff; border: 1.5px solid #e8f4f5; border-radius: 10px; padding: 8px 12px; color: #1E3B42; font-size: .82rem; outline: none; font-family: inherit; flex: 1; min-width: 160px; }
.toolbar input:focus { border-color: #55B7BD; }
.btn { border: none; border-radius: 10px; padding: 8px 16px; font-size: .82rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: .2s; }
.btn-primary { background: #55B7BD; color: #fff; }
.btn-primary:hover { background: #3d9ea4; }
.btn-success { background: #2E7D32; color: #fff; border-radius: 24px; padding: 9px 18px; }
.btn-ghost { background: rgba(85,183,189,.1); color: #1E7A80; }
.btn-danger { background: #FEF2F2; color: #C62828; }

/* Breadcrumb */
.breadcrumb { display: flex; align-items: center; gap: 6px; margin-bottom: 1rem; font-size: .82rem; color: #8fa8ab; flex-wrap: wrap; }
.breadcrumb a { color: #1E7A80; text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { color: #c0d4d6; }

/* File grid */
.files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .8rem; margin-bottom: 1.5rem; }
.file-card { background: #fff; border-radius: 14px; border: 1.5px solid #e8f4f5; padding: 1rem; cursor: pointer; transition: all .2s; position: relative; }
.file-card:hover { border-color: #55B7BD; box-shadow: 0 4px 16px rgba(85,183,189,.15); transform: translateY(-2px); }
.file-card.folder { border-left: 3px solid #55B7BD; }
.file-card.folder:hover { background: #f0f9f9; }
.file-icon { font-size: 2rem; margin-bottom: .5rem; text-align: center; }
.file-icon svg { width: 40px; height: 40px; }
.file-name { font-size: .82rem; font-weight: 600; color: #1E3B42; word-break: break-all; margin-bottom: .3rem; }
.file-meta { font-size: .72rem; color: #8fa8ab; }
.file-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
.file-card:hover .file-actions { opacity: 1; }
.file-actions button { background: rgba(255,255,255,.9); border: 1px solid #e8f4f5; border-radius: 6px; padding: 3px 7px; font-size: .72rem; cursor: pointer; }
.file-actions button:hover { background: #FEF2F2; border-color: #f5c6c6; color: #C62828; }

/* Upload zone */
.upload-zone { border: 2px dashed #c0d4d6; border-radius: 16px; padding: 2rem; text-align: center; margin-bottom: 1.5rem; transition: all .2s; cursor: pointer; background: #fff; }
.upload-zone:hover, .upload-zone.drag-over { border-color: #55B7BD; background: #f0f9f9; }
.upload-zone p { color: #8fa8ab; font-size: .85rem; margin-top: .5rem; }
.upload-zone strong { color: #1E7A80; }

/* New folder modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; }
.modal.open { display: flex; }
.modal-box { background: #fff; border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 380px; }
.modal-title { font-size: 1rem; font-weight: 700; color: #1E7A80; margin-bottom: 1rem; }
.modal-box input { width: 100%; background: #f8fbfc; border: 1.5px solid #e8f4f5; border-radius: 10px; padding: 10px 12px; font-size: .9rem; outline: none; font-family: inherit; margin-bottom: 1rem; }
.modal-box input:focus { border-color: #55B7BD; }
.modal-footer { display: flex; gap: .6rem; justify-content: flex-end; }
.btn-secondary { background: #f0f4f5; color: #5a7a80; }

.empty-state { text-align: center; padding: 3rem; color: #8fa8ab; }
.empty-state svg { width: 48px; height: 48px; opacity: .3; margin-bottom: 1rem; }
.stats-badge { background: #E8F6F6; color: #1E7A80; padding: 4px 12px; border-radius: 20px; font-size: .78rem; font-weight: 600; }

@media (max-width: 600px) {
  .files-grid { grid-template-columns: repeat(2, 1fr); }
  .toolbar { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <a href="/" class="brand"><img src="images/GL_LOGISTICs_line_-09.jpg.png" alt="GL"><span>GL Logistics · Файлы</span></a>
    <button class="btn-logout" id="logoutBtn">Выйти</button>
  </div>
  <div class="nav-links" id="navLinks"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Поиск файлов...">
    <span class="stats-badge" id="statsBadge">0 файлов</span>
    <button class="btn btn-ghost" id="newFolderBtn">+ Папка</button>
    <button class="btn btn-success" onclick="document.getElementById('fileInput').click()">+ Загрузить</button>
    <input type="file" id="fileInput" multiple style="display:none">
  </div>

  <!-- Breadcrumb -->
  <div class="breadcrumb" id="breadcrumb">
    <a onclick="navigateTo('')">Мои файлы</a>
  </div>

  <!-- Upload zone -->
  <div class="upload-zone" id="uploadZone">
    <svg viewBox="0 0 24 24" fill="none" stroke="#55B7BD" stroke-width="1.5" style="width:40px;height:40px;margin:0 auto .5rem"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <p>Перетащите файлы сюда или <strong>нажмите для выбора</strong></p>
    <p style="font-size:.75rem;margin-top:.3rem">PDF, Word, Excel, фото — до 50 МБ каждый</p>
  </div>

  <!-- Files grid -->
  <div class="files-grid" id="filesList">
    <div class="empty-state" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <p>Загрузка...</p>
    </div>
  </div>
</div>

<!-- New Folder Modal -->
<div class="modal" id="folderModal">
  <div class="modal-box">
    <div class="modal-title">Новая папка</div>
    <input type="text" id="folderName" placeholder="Название папки" maxlength="50">
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelFolder">Отмена</button>
      <button class="btn btn-primary" id="createFolder">Создать</button>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://gl-api.gltransam.workers.dev';
const SESSION_MAX = 12 * 60 * 60 * 1000;
const user = localStorage.getItem('gl_staff_user');
const loginTime = parseInt(localStorage.getItem('gl_staff_login_time') || '0');
if (!user || !loginTime || (Date.now() - loginTime) > SESSION_MAX) { window.location.replace('/staff.html'); throw ''; }

// Nav
document.addEventListener('DOMContentLoaded', () => {
  const isAdm = localStorage.getItem('gl_staff_user') === 'TigranMetspagyan';
  const ICONS = {
    'Главная': 'M3,3h7v7H3V3zm11,0h7v7h-7V3zM3,14h7v7H3v-7zm11,0h7v7h-7v-7z',
    'Сделки': 'M20,7H4a2,2,0,0,0-2,2v6a2,2,0,0,0,2,2h16a2,2,0,0,0,2-2V9A2,2,0,0,0,20,7z',
    'Заявки': 'M14,2H6A2,2,0,0,0,4,4V20a2,2,0,0,0,2,2H18a2,2,0,0,0,2-2V8z',
    'Инвойс': 'M22,6.5A.5.5,0,0,0,21.5,6H2.5A.5.5,0,0,0,2,6.5v11A.5.5,0,0,0,2.5,18h19a.5.5,0,0,0,.5-.5Z',
    'Рейсы': 'M1,3H16a2,2,0,0,1,2,2v13H-1V5A2,2,0,0,1,1,3z',
    'Клиенты': 'M17,21v-2a4,4,0,0,0-4-4H5a4,4,0,0,0-4,4v2M9,7a4,4,0,1,0,0,8A4,4,0,0,0,9,7z',
    'Файлы': 'M22,19a2,2,0,0,1-2,2H4a2,2,0,0,1-2-2V5a2,2,0,0,1,2-2h5l2,3h9a2,2,0,0,1,2,2z',
    'Расходы': 'M12,1V23M17,5H9.5a3.5,3.5,0,0,0,0,7h5a3.5,3.5,0,0,1,0,7H6',
    'Диспатчинг': 'M12,2A10,10,0,1,0,12,22A10,10,0,0,0,12,2z',
  };
  const pAll = ['/staff-dashboard.html','Главная'],['/staff-cargo.html','Сделки'],['/rateconfirmation','Заявки'],['/invoice','Инвойс'],['/trip-report','Рейсы'],['/clients','Клиенты'],['/files','Файлы'],['/expenses.html','Расходы'],['/dispatch.html','Диспатчинг'];
  const pLog = ['/staff-cargo.html','Сделки'],['/rateconfirmation','Заявки'],['/invoice','Инвойс'],['/trip-report','Рейсы'];
  const pages = isAdm ? [pAll].flat() : [pLog].flat();
  // Fix: proper array
  const allPages = [['/staff-dashboard.html','Главная'],['/staff-cargo.html','Сделки'],['/rateconfirmation','Заявки'],['/invoice','Инвойс'],['/trip-report','Рейсы'],['/clients','Клиенты'],['/files','Файлы'],['/expenses.html','Расходы'],['/dispatch.html','Диспатчинг']];
  const logPages = [['/staff-cargo.html','Сделки'],['/rateconfirmation','Заявки'],['/invoice','Инвойс'],['/trip-report','Рейсы']];
  const navPages = isAdm ? allPages : logPages;
  const el = document.getElementById('navLinks');
  el.innerHTML = navPages.map(([href, label]) => {
    const active = label === 'Файлы' ? ' class="active"' : '';
    const d = ICONS[label] || '';
    return `<a href="${href}"${active}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="${d}"/></svg><span>${label}</span></a>`;
  }).join('');
});

// File state
let currentPath = ''; // текущая папка (prefix)
let allFiles = [];

function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  const token = localStorage.getItem('gl_staff_token');
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  return fetch(WORKER + path, opts).then(r => r.json());
}

function fmtSize(b) {
  if (!b) return '0 Б';
  if (b < 1024) return b + ' Б';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' КБ';
  return (b/1024/1024).toFixed(1) + ' МБ';
}

function fmtDate(s) {
  if (!s) return '';
  return new Date(s).toLocaleDateString('ru', {day:'2-digit',month:'2-digit',year:'2-digit'});
}

function fileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const icons = {
    pdf: '#C62828', doc: '#1565C0', docx: '#1565C0', xls: '#2E7D32', xlsx: '#2E7D32',
    jpg: '#E65100', jpeg: '#E65100', png: '#E65100', webp: '#E65100', gif: '#E65100',
    zip: '#6A1B9A', rar: '#6A1B9A', mp4: '#1A237E', mov: '#1A237E',
  };
  const color = icons[ext] || '#8fa8ab';
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.5" style="width:36px;height:36px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><text x="6" y="18" fill="${color}" stroke="none" font-size="5" font-weight="700">${ext.toUpperCase()}</text></svg>`;
}

function folderIcon() {
  return `<svg viewBox="0 0 24 24" fill="#E8F6F6" stroke="#55B7BD" stroke-width="1.5" style="width:36px;height:36px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
}

async function loadFiles() {
  try {
    const r = await fetch(WORKER + '/api/files');
    allFiles = await r.json();
    renderFiles();
  } catch(e) {
    document.getElementById('filesList').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>Ошибка загрузки</p></div>';
  }
}

function getItemsAtPath(path) {
  // Получаем папки и файлы в текущей директории
  const prefix = path ? path + '/' : '';
  const folders = new Set();
  const files = [];

  allFiles.forEach(f => {
    const key = f.key || f.name || '';
    if (!key.startsWith(prefix)) return;
    const rest = key.slice(prefix.length);
    if (!rest) return;
    const parts = rest.split('/');
    if (parts.length > 1) {
      folders.add(parts[0]); // вложенная папка
    } else {
      files.push(f); // файл в текущей папке
    }
  });

  return { folders: [...folders].sort(), files };
}

function renderFiles() {
  const el = document.getElementById('filesList');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const badge = document.getElementById('statsBadge');

  // Обновляем breadcrumb
  renderBreadcrumb();

  const { folders, files } = getItemsAtPath(currentPath);

  // Фильтр по поиску
  const filteredFolders = search ? folders.filter(f => f.toLowerCase().includes(search)) : folders;
  const filteredFiles = search ? files.filter(f => (f.key||f.name||'').toLowerCase().includes(search)) : files;

  const total = filteredFolders.length + filteredFiles.length;
  const totalSize = filteredFiles.reduce((s, f) => s + (f.size || 0), 0);
  badge.innerHTML = `<b>${total}</b> элементов · ${fmtSize(totalSize)}`;

  if (!total) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <p>${search ? 'Ничего не найдено' : 'Папка пуста. Загрузите файлы!'}</p>
    </div>`;
    return;
  }

  // Папки
  let html = filteredFolders.map(folder => `
    <div class="file-card folder" onclick="navigateTo('${currentPath ? currentPath + '/' + folder : folder}')">
      <div class="file-icon">${folderIcon()}</div>
      <div class="file-name">${folder}</div>
      <div class="file-meta">Папка</div>
      <div class="file-actions">
        <button onclick="event.stopPropagation();deleteFolder('${currentPath ? currentPath + '/' + folder : folder}')" title="Удалить">✕</button>
      </div>
    </div>
  `).join('');

  // Файлы
  html += filteredFiles.map(f => {
    const key = f.key || f.name || '';
    const name = key.split('/').pop();
    return `
    <div class="file-card" onclick="openFile('${key}')">
      <div class="file-icon">${fileIcon(name)}</div>
      <div class="file-name">${name}</div>
      <div class="file-meta">${fmtSize(f.size)} · ${fmtDate(f.uploaded)}</div>
      <div class="file-actions">
        <button onclick="event.stopPropagation();downloadFile('${key}')" title="Скачать">↓</button>
        <button onclick="event.stopPropagation();deleteFile('${key}')" title="Удалить">✕</button>
      </div>
    </div>
    `;
  }).join('');

  el.innerHTML = html;
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!currentPath) {
    bc.innerHTML = '<span>Мои файлы</span>';
    return;
  }
  const parts = currentPath.split('/');
  let html = `<a onclick="navigateTo('')">Мои файлы</a>`;
  parts.forEach((part, i) => {
    const path = parts.slice(0, i+1).join('/');
    html += `<span class="sep">/</span>`;
    if (i === parts.length - 1) {
      html += `<span>${part}</span>`;
    } else {
      html += `<a onclick="navigateTo('${path}')">${part}</a>`;
    }
  });
  bc.innerHTML = html;
}

function navigateTo(path) {
  currentPath = path;
  renderFiles();
}

async function openFile(key) {
  try {
    const r = await fetch(WORKER + '/api/files/' + encodeURIComponent(key));
    const d = await r.json();
    if (d.url) window.open(d.url, '_blank');
  } catch(e) { alert('Ошибка открытия файла'); }
}

async function downloadFile(key) {
  try {
    const r = await fetch(WORKER + '/api/files/' + encodeURIComponent(key));
    const d = await r.json();
    if (d.url) { const a = document.createElement('a'); a.href = d.url; a.download = key.split('/').pop(); a.click(); }
  } catch(e) { alert('Ошибка скачивания'); }
}

async function deleteFile(key) {
  if (!confirm('Удалить файл?')) return;
  await fetch(WORKER + '/api/files/' + encodeURIComponent(key), { method: 'DELETE' });
  await loadFiles();
}

async function deleteFolder(folderPath) {
  const { files } = getItemsAtPath(folderPath);
  // Также считаем вложенные
  const allInFolder = allFiles.filter(f => (f.key||f.name||'').startsWith(folderPath + '/'));
  if (allInFolder.length > 0) {
    if (!confirm(`Удалить папку "${folderPath.split('/').pop()}" и ${allInFolder.length} файлов внутри?`)) return;
    for (const f of allInFolder) {
      await fetch(WORKER + '/api/files/' + encodeURIComponent(f.key||f.name), { method: 'DELETE' });
    }
  } else {
    if (!confirm(`Удалить папку "${folderPath.split('/').pop()}"?`)) return;
  }
  await loadFiles();
}

async function uploadFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;

  let uploaded = 0;
  for (const file of files) {
    // Загружаем в текущую папку
    const key = currentPath ? currentPath + '/' + file.name : file.name;
    try {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('key', key);
      await fetch(WORKER + '/api/files/upload', {
        method: 'POST',
        body: formData
      });
      uploaded++;
    } catch(e) {
      console.error('Upload error:', file.name, e);
    }
  }
  await loadFiles();
  if (uploaded) alert(`Загружено ${uploaded} из ${files.length} файлов`);
}

// Events
document.getElementById('searchInput').addEventListener('input', renderFiles);
document.getElementById('fileInput').addEventListener('change', e => uploadFiles(e.target.files));
document.getElementById('logoutBtn').addEventListener('click', () => {
  ['gl_staff_user','gl_staff_login_time','gl_staff_token'].forEach(k => localStorage.removeItem(k));
  window.location.href = 'staff.html';
});

// Upload zone drag & drop
const zone = document.getElementById('uploadZone');
zone.addEventListener('click', () => document.getElementById('fileInput').click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); uploadFiles(e.dataTransfer.files); });

// New folder
document.getElementById('newFolderBtn').addEventListener('click', () => {
  document.getElementById('folderName').value = '';
  document.getElementById('folderModal').classList.add('open');
  setTimeout(() => document.getElementById('folderName').focus(), 100);
});
document.getElementById('cancelFolder').addEventListener('click', () => document.getElementById('folderModal').classList.remove('open'));
document.getElementById('createFolder').addEventListener('click', async () => {
  const name = document.getElementById('folderName').value.trim().replace(/[/\\]/g, '');
  if (!name) return;
  // Создаём папку — загружаем пустой placeholder файл
  const folderKey = currentPath ? currentPath + '/' + name + '/.keep' : name + '/.keep';
  const formData = new FormData();
  formData.append('file', new Blob([''], {type:'text/plain'}), '.keep');
  formData.append('key', folderKey);
  await fetch(WORKER + '/api/files/upload', { method: 'POST', body: formData });
  document.getElementById('folderModal').classList.remove('open');
  await loadFiles();
});
document.getElementById('folderName').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('createFolder').click(); });
