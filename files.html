<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/images/GL_LOGISTICs_line_-09.jpg.png">

<script src="/js/emoji-remover.js">
// Переименование
let _renameKey = '';
let _renameIsFolder = false;

window.renameItem = function(key, isFolder) {
  _renameKey = key;
  _renameIsFolder = isFolder;
  const name = key.split('/').pop();
  document.getElementById('renameTitle').textContent = isFolder ? 'Переименовать папку' : 'Переименовать файл';
  document.getElementById('renameInput').value = name;
  document.getElementById('renameModal').classList.add('open');
  setTimeout(() => { document.getElementById('renameInput').select(); }, 100);
};

document.getElementById('renameConfirm').addEventListener('click', async () => {
  const newName = document.getElementById('renameInput').value.trim().replace(/[\/]/g,'');
  if (!newName) return;
  const parts = _renameKey.split('/');
  parts[parts.length - 1] = newName;
  const newKey = parts.join('/');
  if (newKey === _renameKey) { document.getElementById('renameModal').classList.remove('open'); return; }
  await fetch(WORKER + '/api/files/rename', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ oldKey: _renameKey, newKey })
  });
  document.getElementById('renameModal').classList.remove('open');
  await loadFiles();
});

document.getElementById('renameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('renameConfirm').click();
});

// Перемещение
let _moveKey = '';

window.moveItem = function(key) {
  _moveKey = key;
  // Собираем список папок
  const folders = new Set();
  allFiles.forEach(f => {
    const k = f.key || '';
    const parts = k.split('/');
    for (let i = 1; i < parts.length; i++) {
      folders.add(parts.slice(0, i).join('/'));
    }
  });
  const sel = document.getElementById('moveTarget');
  sel.innerHTML = '<option value="">Корень (Мои файлы)</option>';
  [...folders].sort().forEach(f => {
    if (!key.startsWith(f)) { // нельзя переместить в себя
      sel.innerHTML += `<option value="${f}">${f}</option>`;
    }
  });
  document.getElementById('moveModal').classList.add('open');
};

document.getElementById('moveConfirm').addEventListener('click', async () => {
  const target = document.getElementById('moveTarget').value;
  await fetch(WORKER + '/api/files/move', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: _moveKey, targetFolder: target })
  });
  document.getElementById('moveModal').classList.remove('open');
  await loadFiles();
});

</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* File grid */

/* Upload zone */

/* New folder modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; }
.modal.open { display: flex; }
.modal-box { background: #fff; border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 380px; }
.modal-title { font-size: 1rem; font-weight: 700; color: #1E7A80; margin-bottom: 1rem; }
.modal-box input { width: 100%; background: #f8fbfc; border: 1.5px solid #e8f4f5; border-radius: 10px; padding: 10px 12px; font-size: .9rem; outline: none; font-family: inherit; margin-bottom: 1rem; }
.modal-box input:focus { border-color: #55B7BD; }
.modal-footer { display: flex; gap: .6rem; justify-content: flex-end; }
.btn-secondary { background: #f0f4f5; color: #5a7a80; }

.empty-state { text-align: center; padding: 3rem; color: #8fa8ab; }
.empty-state svg { width: 48px; height: 48px; opacity: .3; margin-bottom: 1rem; }
.stats-badge { background: #E8F6F6; color: #1E7A80; padding: 4px 12px; border-radius: 20px; font-size: .78rem; font-weight: 600; }

@media (max-width: 600px) {
  .files-grid { grid-template-columns: repeat(2, 1fr); }
  .toolbar { flex-direction: column; align-items: stretch; }
}

/* Upload progress */
#uploadProgress { display:none; position:fixed; bottom:1.5rem; right:1.5rem; background:#fff; border-radius:16px; padding:1rem 1.2rem; box-shadow:0 8px 32px rgba(0,0,0,.15); border:1.5px solid #e8f4f5; min-width:280px; z-index:9999; }
#uploadProgress .up-title { font-size:.82rem; font-weight:700; color:#1E3B42; margin-bottom:.6rem; display:flex; justify-content:space-between; }
#uploadProgress .up-bar-wrap { background:#f0f4f5; border-radius:99px; height:8px; overflow:hidden; margin-bottom:.4rem; }
#uploadProgress .up-bar { background:linear-gradient(90deg,#55B7BD,#3d9ea4); height:100%; border-radius:99px; transition:width .3s; width:0%; }
#uploadProgress .up-stats { font-size:.72rem; color:#8fa8ab; display:flex; justify-content:space-between; }

</style>

<script>
const WORKER = 'https://gl-api.gltransam.workers.dev';
const SESSION_MAX = 12 * 60 * 60 * 1000;
const user = localStorage.getItem('gl_staff_user');
const loginTime = parseInt(localStorage.getItem('gl_staff_login_time') || '0');
if (!user || !loginTime || (Date.now() - loginTime) > SESSION_MAX) { window.location.replace('/staff.html'); throw ''; }

// Nav
document.addEventListener('DOMContentLoaded', () => {
  const isAdm = localStorage.getItem('gl_staff_user') === 'TigranMetspagyan';
  const ICONS = {
    'Главная': 'M3,3h7v7H3V3zm11,0h7v7h-7V3zM3,14h7v7H3v-7zm11,0h7v7h-7v-7z',
    'Сделки': 'M20,7H4a2,2,0,0,0-2,2v6a2,2,0,0,0,2,2h16a2,2,0,0,0,2-2V9A2,2,0,0,0,20,7z',
    'Заявки': 'M14,2H6A2,2,0,0,0,4,4V20a2,2,0,0,0,2,2H18a2,2,0,0,0,2-2V8z',
    'Инвойс': 'M22,6.5A.5.5,0,0,0,21.5,6H2.5A.5.5,0,0,0,2,6.5v11A.5.5,0,0,0,2.5,18h19a.5.5,0,0,0,.5-.5Z',
    'Рейсы': 'M1,3H16a2,2,0,0,1,2,2v13H-1V5A2,2,0,0,1,1,3z',
    'Клиенты': 'M17,21v-2a4,4,0,0,0-4-4H5a4,4,0,0,0-4,4v2M9,7a4,4,0,1,0,0,8A4,4,0,0,0,9,7z',
    'Файлы': 'M22,19a2,2,0,0,1-2,2H4a2,2,0,0,1-2-2V5a2,2,0,0,1,2-2h5l2,3h9a2,2,0,0,1,2,2z',
    'Расходы': 'M12,1V23M17,5H9.5a3.5,3.5,0,0,0,0,7h5a3.5,3.5,0,0,1,0,7H6',
    'Диспатчинг': 'M12,2A10,10,0,1,0,12,22A10,10,0,0,0,12,2zM2,12H22M12,2a15.3,15.3,0,0,1,4,10,15.3,15.3,0,0,1-4,10,15.3,15.3,0,0,1-4-10,15.3,15.3,0,0,1,4-10z',
  };
  const allPages = [['/staff-dashboard.html','Главная'],['/staff-cargo.html','Сделки'],['/rateconfirmation','Заявки'],['/invoice','Инвойс'],['/trip-report','Рейсы'],['/clients','Клиенты'],['/files','Файлы'],['/expenses.html','Расходы'],['/dispatch.html','Диспатчинг']];
  const logPages = [['/staff-cargo.html','Сделки'],['/rateconfirmation','Заявки'],['/invoice','Инвойс'],['/trip-report','Рейсы']];
  const navPages = isAdm ? allPages : logPages;
  const el = document.getElementById('navLinks');
  el.innerHTML = navPages.map(([href, label]) => {
    const active = label === 'Файлы' ? ' class="active"' : '';
    const d = ICONS[label] || '';
    return `<a href="${href}"${active}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="${d}"/></svg><span>${label}</span></a>`;
  }).join('');
});

// File state
let currentPath = ''; // текущая папка (prefix)
let allFiles = [];

function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  const token = localStorage.getItem('gl_staff_token');
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  return fetch(WORKER + path, opts).then(r => r.json());
}

function fmtSize(b) {
  if (!b) return '0 Б';
  if (b < 1024) return b + ' Б';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' КБ';
  return (b/1024/1024).toFixed(1) + ' МБ';
}

function fmtDate(s) {
  if (!s) return '';
  return new Date(s).toLocaleDateString('ru', {day:'2-digit',month:'2-digit',year:'2-digit'});
}

function fileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const icons = {
    pdf: '#C62828', doc: '#1565C0', docx: '#1565C0', xls: '#2E7D32', xlsx: '#2E7D32',
    jpg: '#E65100', jpeg: '#E65100', png: '#E65100', webp: '#E65100', gif: '#E65100',
    zip: '#6A1B9A', rar: '#6A1B9A', mp4: '#1A237E', mov: '#1A237E',
  };
  const color = icons[ext] || '#8fa8ab';
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.5" style="width:36px;height:36px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><text x="6" y="18" fill="${color}" stroke="none" font-size="5" font-weight="700">${ext.toUpperCase()}</text></svg>`;
}

function folderIcon() {
  return `<svg viewBox="0 0 24 24" fill="#E8F6F6" stroke="#55B7BD" stroke-width="1.5" style="width:36px;height:36px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
}

async function loadFiles() {
  try {
    const r = await fetch(WORKER + '/api/files');
    allFiles = await r.json();
    renderFiles();
  } catch(e) {
    document.getElementById('filesList').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>Ошибка загрузки</p></div>';
  }
}

function getItemsAtPath(path) {
  // Получаем папки и файлы в текущей директории
  const prefix = path ? path + '/' : '';
  const folders = new Set();
  const files = [];

  allFiles.forEach(f => {
    const key = f.key || f.name || '';
    if (!key.startsWith(prefix)) return;
    const rest = key.slice(prefix.length);
    if (!rest) return;
    const parts = rest.split('/');
    if (parts.length > 1) {
      folders.add(parts[0]); // вложенная папка
    } else {
      files.push(f); // файл в текущей папке
    }
  });

  return { folders: [...folders].sort(), files };
}

function renderFiles() {
  const el = document.getElementById('filesList');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const badge = document.getElementById('statsBadge');

  // Обновляем breadcrumb
  renderBreadcrumb();

  const { folders, files } = getItemsAtPath(currentPath);

  // Фильтр по поиску
  const filteredFolders = search ? folders.filter(f => f.toLowerCase().includes(search)) : folders;
  const filteredFiles = search ? files.filter(f => (f.key||f.name||'').toLowerCase().includes(search)) : files;

  const total = filteredFolders.length + filteredFiles.length;
  const totalSize = filteredFiles.reduce((s, f) => s + (f.size || 0), 0);
  badge.innerHTML = `<b>${total}</b> элементов · ${fmtSize(totalSize)}`;

  // Показываем info внизу если внутри папки
  const info = document.getElementById('folderInfo');
  if (info) {
    if (currentPath) {
      info.textContent = `${filteredFiles.length} файлов · ${filteredFolders.length} папок · ${fmtSize(totalSize)}`;
    } else {
      info.textContent = '';
    }
  }

  if (!total) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <p>${search ? 'Ничего не найдено' : 'Папка пуста. Загрузите файлы!'}</p>
    </div>`;
    return;
  }

  // Папки
  let html = filteredFolders.map(folder => `
    <div class="file-card folder" onclick="navigateTo('${currentPath ? currentPath + '/' + folder : folder}')">
      <div class="file-icon">${folderIcon()}</div>
      <div class="file-name">${folder}</div>
      <div class="file-meta">Папка</div>
      <div class="file-actions">
        <button onclick="event.stopPropagation();renameItem('${currentPath ? currentPath + '/' + folder : folder}', true)" title="Переименовать">✎</button>
        <button onclick="event.stopPropagation();deleteFolder('${currentPath ? currentPath + '/' + folder : folder}')" title="Удалить">✕</button>
      </div>
    </div>
  `).join('');

  // Файлы
  html += filteredFiles.map(f => {
    const key = f.key || f.name || '';
    const name = key.split('/').pop();
    return `
    <div class="file-card" onclick="openFile('${key}')">
      <div class="file-icon">${fileIcon(name)}</div>
      <div class="file-name">${name}</div>
      <div class="file-meta">${fmtSize(f.size)} · ${fmtDate(f.uploaded)}</div>
      <div class="file-actions">
        <button onclick="event.stopPropagation();renameItem('${key}', false)" title="Переименовать">✎</button>
        <button onclick="event.stopPropagation();moveItem('${key}')" title="Переместить">⇄</button>
        <button onclick="event.stopPropagation();downloadFile('${key}')" title="Скачать">↓</button>
        <button onclick="event.stopPropagation();deleteFile('${key}')" title="Удалить">✕</button>
      </div>
    </div>
    `;
  }).join('');

  el.innerHTML = html;
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!currentPath) {
    bc.innerHTML = '<span>Мои файлы</span>';
    return;
  }
  const parts = currentPath.split('/');
  let html = `<a onclick="navigateTo('')">Мои файлы</a>`;
  parts.forEach((part, i) => {
    const path = parts.slice(0, i+1).join('/');
    html += `<span class="sep">/</span>`;
    if (i === parts.length - 1) {
      html += `<span>${part}</span>`;
    } else {
      html += `<a onclick="navigateTo('${path}')">${part}</a>`;
    }
  });
  bc.innerHTML = html;
}

function navigateTo(path) {
  currentPath = path;
  // Сохраняем путь в URL hash
  if (path) {
    history.replaceState(null, '', '#' + encodeURIComponent(path));
  } else {
    history.replaceState(null, '', window.location.pathname);
  }
  renderFiles();
}

async function getSignedUrl(key) {
  // Получаем временную подписанную ссылку (1 час)
  const storageKey = key.startsWith('files/') ? key : 'files/' + key;
  const token = localStorage.getItem('gl_staff_token');
  const r = await fetch(WORKER + '/api/files/sign?key=' + storageKey.split('/').map(encodeURIComponent).join('/'), {
    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
  });
  const d = await r.json();
  return d.url;
}

async function openFile(key) {
  try {
    const url = await getSignedUrl(key);
    if (url) window.open(url, '_blank');
    else alert('Не удалось получить ссылку');
  } catch(e) { alert('Ошибка открытия файла'); }
}

async function downloadFile(key) {
  try {
    const url = await getSignedUrl(key);
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.download = key.split('/').pop();
    a.click();
  } catch(e) { alert('Ошибка скачивания'); }
}

async function deleteFile(key) {
  if (!confirm('Удалить файл?')) return;
  await fetch(WORKER + '/api/files/' + key.split('/').map(encodeURIComponent).join('/'), { method: 'DELETE' });
  await loadFiles();
}

async function deleteFolder(folderPath) {
  const { files } = getItemsAtPath(folderPath);
  // Также считаем вложенные
  const allInFolder = allFiles.filter(f => (f.key||f.name||'').startsWith(folderPath + '/'));
  if (allInFolder.length > 0) {
    if (!confirm(`Удалить папку "${folderPath.split('/').pop()}" и ${allInFolder.length} файлов внутри?`)) return;
    await Promise.all(allInFolder.map(f => {
      const sk = (f.key||f.name||'').startsWith('files/') ? (f.key||f.name) : 'files/' + (f.key||f.name);
      return fetch(WORKER + '/api/files/' + sk.split('/').map(encodeURIComponent).join('/'), { method: 'DELETE' });
    }));
  } else {
    if (!confirm(`Удалить папку "${folderPath.split('/').pop()}"?`)) return;
  }
  await loadFiles();
}


// Рекурсивная загрузка папок
async function readEntry(entry) {
  return new Promise((resolve, reject) => {
    if (entry.isFile) {
      entry.file(resolve, reject);
    }
  });
}

async function readDir(dirEntry) {
  return new Promise((resolve, reject) => {
    const reader = dirEntry.createReader();
    const entries = [];
    function readBatch() {
      reader.readEntries(batch => {
        if (!batch.length) { resolve(entries); return; }
        entries.push(...batch);
        readBatch();
      }, reject);
    }
    readBatch();
  });
}

async function uploadEntries(entries, basePath, isTopLevel = true) {
  const uploads = [];

  async function collectFiles(ents, path) {
    for (const entry of ents) {
      if (entry.isFile) {
        const file = await readEntry(entry);
        const key = path ? path + '/' + file.name : file.name;
        uploads.push({ file, key });
      } else if (entry.isDirectory) {
        const folderPath = path ? path + '/' + entry.name : entry.name;
        const subEntries = await readDir(entry);
        if (subEntries.length === 0) {
          uploads.push({ file: new File([''], '.keep', {type:'text/plain'}), key: folderPath + '/.keep' });
        } else {
          await collectFiles(subEntries, folderPath);
        }
      }
    }
  }

  await collectFiles(entries, basePath);
  if (!uploads.length) return;

  const total = uploads.length;
  let done = 0;
  let totalBytes = uploads.reduce((s, u) => s + (u.file.size||0), 0);

  // Показываем прогресс
  const prog = document.getElementById('uploadProgress');
  const bar = document.getElementById('upBar');
  const pct = document.getElementById('upPercent');
  const cur = document.getElementById('upCurrent');
  const sz = document.getElementById('upSize');
  if (prog) {
    prog.style.display = 'block';
    document.querySelector('#uploadProgress .up-title span').textContent =
      uploads[0]?.key?.split('/')[0] ? 'Загрузка: ' + uploads[0].key.split('/')[0] : 'Загрузка файлов...';
  }

  function updateProgress() {
    const p = Math.round(done / total * 100);
    if (bar) bar.style.width = p + '%';
    if (pct) pct.textContent = p + '%';
    if (cur) cur.textContent = done + ' / ' + total + ' файлов';
    if (sz) sz.textContent = fmtSize(totalBytes);
  }
  updateProgress();

  const BATCH = 20;
  for (let i = 0; i < uploads.length; i += BATCH) {
    const batch = uploads.slice(i, i + BATCH);
    await Promise.all(batch.map(async ({file, key}) => {
      try {
        await uploadSingleFile(file, key);
      } catch(e) {
        console.error('Upload failed:', key, e);
      }
      done++;
      updateProgress();
    }));
  }

  if (isTopLevel) {
    // Показываем завершение
    if (prog) {
      document.querySelector('#uploadProgress .up-title span').textContent = 'Готово!';
      document.querySelector('#uploadProgress .up-title span:last-child').className = 'up-done';
      if (bar) bar.style.background = '#2E7D32';
    }
    await loadFiles();
    setTimeout(() => { if (prog) prog.style.display = 'none'; }, 3000);
  }
}

async function uploadSingleFile(file, key) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('key', key);
  await fetch(WORKER + '/api/files/upload', { method: 'POST', body: formData });
}

async function uploadFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;

  let uploaded = 0;
  for (const file of files) {
    const key = currentPath ? currentPath + '/' + file.name : file.name;
    try {
      await uploadSingleFile(file, key);
      uploaded++;
    } catch(e) {
      console.error('Upload error:', file.name, e);
    }
  }
  await loadFiles();
  if (uploaded) alert(`Загружено ${uploaded} из ${files.length} файлов`);
}

// Events
document.getElementById('searchInput').addEventListener('input', renderFiles);
document.getElementById('fileInput').addEventListener('change', e => uploadFiles(e.target.files));
document.getElementById('logoutBtn').addEventListener('click', () => {
  ['gl_staff_user','gl_staff_login_time','gl_staff_token'].forEach(k => localStorage.removeItem(k));
  window.location.href = 'staff.html';
});

// Upload zone drag & drop
const zone = document.getElementById('uploadZone');
zone.addEventListener('click', () => document.getElementById('fileInput').click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', async e => {
  e.preventDefault();
  zone.classList.remove('drag-over');
  // Поддержка папок через DataTransferItemList
  const items = [...(e.dataTransfer.items || [])];
  if (items.length && items[0].webkitGetAsEntry) {
    const entries = items.map(i => i.webkitGetAsEntry()).filter(Boolean);
    await uploadEntries(entries, currentPath);
  } else {
    uploadFiles(e.dataTransfer.files);
  }
});

// New folder
document.getElementById('newFolderBtn').addEventListener('click', () => {
  document.getElementById('folderName').value = '';
  document.getElementById('folderModal').classList.add('open');
  setTimeout(() => document.getElementById('folderName').focus(), 100);
});
document.getElementById('cancelFolder').addEventListener('click', () => document.getElementById('folderModal').classList.remove('open'));
document.getElementById('createFolder').addEventListener('click', async () => {
  const name = document.getElementById('folderName').value.trim().replace(/[/\\]/g, '');
  if (!name) return;
  // Создаём папку — загружаем пустой placeholder файл
  const folderKey = currentPath ? currentPath + '/' + name + '/.keep' : name + '/.keep';
  const formData = new FormData();
  formData.append('file', new Blob([''], {type:'text/plain'}), '.keep');
  formData.append('key', folderKey);
  await fetch(WORKER + '/api/files/upload', { method: 'POST', body: formData });
  document.getElementById('folderModal').classList.remove('open');
  await loadFiles();
});
document.getElementById('folderName').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('createFolder').click(); });

// Восстанавливаем путь из URL hash
if (window.location.hash) {
  try { currentPath = decodeURIComponent(window.location.hash.slice(1)); } catch(_) {}
}
loadFiles();

// Переименование
let _renameKey = '';
let _renameIsFolder = false;

window.renameItem = function(key, isFolder) {
  _renameKey = key;
  _renameIsFolder = isFolder;
  const name = key.split('/').pop();
  document.getElementById('renameTitle').textContent = isFolder ? 'Переименовать папку' : 'Переименовать файл';
  document.getElementById('renameInput').value = name;
  document.getElementById('renameModal').classList.add('open');
  setTimeout(() => { document.getElementById('renameInput').select(); }, 100);
};

document.getElementById('renameConfirm').addEventListener('click', async () => {
  const newName = document.getElementById('renameInput').value.trim().replace(/[\/]/g,'');
  if (!newName) return;
  const parts = _renameKey.split('/');
  parts[parts.length - 1] = newName;
  const newKey = parts.join('/');
  if (newKey === _renameKey) { document.getElementById('renameModal').classList.remove('open'); return; }
  await fetch(WORKER + '/api/files/rename', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ oldKey: _renameKey, newKey })
  });
  document.getElementById('renameModal').classList.remove('open');
  await loadFiles();
});

document.getElementById('renameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('renameConfirm').click();
});

// Перемещение
let _moveKey = '';

window.moveItem = function(key) {
  _moveKey = key;
  // Собираем список папок
  const folders = new Set();
  allFiles.forEach(f => {
    const k = f.key || '';
    const parts = k.split('/');
    for (let i = 1; i < parts.length; i++) {
      folders.add(parts.slice(0, i).join('/'));
    }
  });
  const sel = document.getElementById('moveTarget');
  sel.innerHTML = '<option value="">Корень (Мои файлы)</option>';
  [...folders].sort().forEach(f => {
    if (!key.startsWith(f)) { // нельзя переместить в себя
      sel.innerHTML += `<option value="${f}">${f}</option>`;
    }
  });
  document.getElementById('moveModal').classList.add('open');
};

document.getElementById('moveConfirm').addEventListener('click', async () => {
  const target = document.getElementById('moveTarget').value;
  await fetch(WORKER + '/api/files/move', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: _moveKey, targetFolder: target })
  });
  document.getElementById('moveModal').classList.remove('open');
  await loadFiles();
});
