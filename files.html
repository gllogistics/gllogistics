<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EDF4F4;font-family:'Inter',sans-serif;color:#1a1a1a;min-height:100vh;padding:1.5rem}
.top-bar{background:#fff;border-radius:16px;padding:.65rem 1.8rem;margin-bottom:1.4rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 16px rgba(30,59,66,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;text-decoration:none;color:#0D1F23}
.brand img{height:32px}
.nav-links{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.7);border-radius:14px;width:fit-content;border:1px solid rgba(85,183,189,.15)}
.nav-links a{background:transparent;color:#5a7a80;padding:8px 18px;border-radius:11px;text-decoration:none;font-size:.8rem;font-weight:600}
.nav-links a:hover{background:#E8F6F6;color:#1E7A80}
.nav-links a.active{background:#55B7BD;color:#fff;font-weight:600}
.btn-logout{background:#F5FAFA;color:#1E3B42;border:1.5px solid rgba(85,183,189,.3);border-radius:10px;padding:7px 18px;cursor:pointer;font-weight:600;font-size:.8rem}
.btn-logout:hover{background:#E0F4F5}

.main{max-width:900px;margin:0 auto}
h1{font-size:1.4rem;font-weight:800;color:#1E3B42;margin-bottom:1.4rem;display:flex;align-items:center;gap:10px}

/* Зона загрузки */
.drop-zone{background:#fff;border:2px dashed rgba(85,183,189,.4);border-radius:20px;padding:2.5rem;text-align:center;cursor:pointer;transition:.2s;margin-bottom:1.4rem}
.drop-zone:hover,.drop-zone.drag-over{border-color:#55B7BD;background:#F0F9F9}
.drop-zone .icon{font-size:2.5rem;margin-bottom:.6rem}
.drop-zone .hint{color:#5a7a80;font-size:.85rem}
.drop-zone .hint b{color:#1E7A80}
.drop-zone input{display:none}

/* Поиск и статистика */
.toolbar{display:flex;gap:.8rem;align-items:center;margin-bottom:1rem}
.search-box{flex:1;background:#fff;border:1.5px solid rgba(85,183,189,.2);border-radius:12px;padding:9px 14px;font-size:.85rem;color:#1E3B42;outline:none;font-family:inherit}
.search-box:focus{border-color:#55B7BD}
.stats-badge{background:#fff;border:1px solid rgba(85,183,189,.2);border-radius:10px;padding:8px 14px;font-size:.8rem;color:#5a7a80;white-space:nowrap}
.stats-badge b{color:#1E7A80}

/* Список файлов */
.files-grid{display:flex;flex-direction:column;gap:.5rem}
.file-row{background:#fff;border-radius:14px;border:1px solid rgba(85,183,189,.12);padding:.9rem 1.1rem;display:flex;align-items:center;gap:1rem;transition:.15s;box-shadow:0 1px 4px rgba(30,59,66,.04)}
.file-row:hover{border-color:rgba(85,183,189,.4);box-shadow:0 2px 12px rgba(85,183,189,.1)}
.file-icon{font-size:1.8rem;width:42px;text-align:center;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-weight:600;color:#1E3B42;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:.72rem;color:#8fa8ab;margin-top:2px}
.file-size{font-size:.75rem;color:#5a7a80;font-weight:600;white-space:nowrap}
.file-actions{display:flex;gap:.4rem;flex-shrink:0}
.btn-dl{background:#F0F9F9;color:#1E7A80;border:1.5px solid rgba(85,183,189,.3);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.78rem;font-weight:700;text-decoration:none}
.btn-dl:hover{background:#E0F4F5}
.btn-del{background:#FEF2F2;color:#C62828;border:1.5px solid rgba(198,40,40,.2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.78rem;font-weight:700}
.btn-del:hover{background:#FECDD3}

/* Прогресс */
.upload-progress{background:#F0F9F9;border:1px solid rgba(85,183,189,.3);border-radius:12px;padding:1rem;margin-bottom:1rem;display:none}
.progress-bar{height:6px;background:#E0F4F5;border-radius:3px;overflow:hidden;margin-top:.5rem}
.progress-fill{height:100%;background:#55B7BD;border-radius:3px;transition:width .2s}
.progress-label{font-size:.8rem;color:#1E7A80;font-weight:600}

.empty-state{text-align:center;padding:3rem;color:#8fa8ab}
.empty-state .icon{font-size:3rem;margin-bottom:.8rem}
.empty-state p{font-size:.9rem}

.nav-links a:active, .nav-links a:focus { transform: none !important; box-shadow: none !important; }
.nav-links { display: flex; gap: 2px; margin-bottom: 1.4rem; padding: 6px; background: rgba(255,255,255,0.7); border-radius: 16px; width: fit-content; border: 1px solid rgba(85,183,189,0.15); flex-wrap: wrap; }
.nav-links a { background: transparent; color: #5a7a80; padding: 8px 14px; border-radius: 12px; text-decoration: none; font-size: 11px; font-weight: 600; transition: background .2s, color .2s; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; text-align: center; line-height: 1.2; }
.nav-links a svg { opacity: 0.6; transition: opacity .2s; }
.nav-links a:hover { background: #E8F6F6; color: #1E7A80; }
.nav-links a:hover svg { opacity: 1; }
.nav-links a.active { background: #55B7BD; color: #fff; font-weight: 600; }
.nav-links a.active svg { opacity: 1; stroke: #fff; }
.nav-links a:active { transform: none !important; }
</style>
<style>
.dropzone{border:2px dashed rgba(85,183,189,.4);border-radius:12px;padding:1rem;text-align:center;cursor:pointer;transition:.2s;background:#F5FAFA;position:relative}
.dropzone:hover,.dropzone.drag-over{border-color:#55B7BD;background:#E8F6F6}
.dropzone.drag-over{border-style:solid}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dropzone-label{font-size:.78rem;color:#8fa8ab;pointer-events:none}
.dropzone-label .dz-icon{font-size:1.5rem;display:block;margin-bottom:4px}
.dropzone-label strong{color:#1E7A80}
.dropzone-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dropzone-chip{background:#E0F4F5;color:#1E3B42;border-radius:6px;padding:3px 8px;font-size:.72rem;display:flex;align-items:center;gap:4px}
.dropzone-chip button{background:none;border:none;cursor:pointer;color:#C62828;font-size:.8rem;padding:0;line-height:1}
</style>

<div class="main">
  <h1>Мои файлы</h1>

  <!-- Зона загрузки -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" multiple>
    <div class="icon">☁️</div>
    <div class="hint">Перетащите файлы сюда или <b>нажмите для выбора</b></div>
    <div style="font-size:.75rem;color:#aaa;margin-top:.4rem">PDF, Word, Excel, фото, любые файлы · до 50 МБ каждый</div>
  </div>

  <!-- Прогресс загрузки -->
  <div class="upload-progress" id="uploadProgress">
    <div class="progress-label" id="progressLabel">Загрузка...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <!-- Тулбар -->
  <div class="toolbar">
    <input class="search-box" id="searchBox" placeholder="Поиск файлов..." type="text">
    <div class="stats-badge" id="statsBadge"><b>0</b> файлов</div>
  </div>

  <!-- Список -->
  <div class="files-grid" id="filesList">
    <div class="empty-state"><div class="icon">📂</div><p>Загрузка...</p></div>
  </div>
</div>

<script>
const WORKER = 'https://gl-api.gltransam.workers.dev';
const ADMIN  = 'TigranMetspagyan';
const SESSION_MAX = 12 * 60 * 60 * 1000;

// Auth
const user = localStorage.getItem('gl_staff_user');
const loginTime = parseInt(localStorage.getItem('gl_staff_login_time') || '0');
if (!user || (Date.now() - loginTime) > SESSION_MAX || user !== ADMIN) {
  localStorage.removeItem('gl_staff_user');
  window.location.href = 'staff.html';
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  ['gl_staff_user','gl_staff_login_time','gl_staff_token'].forEach(k => localStorage.removeItem(k));
  window.location.href = 'staff.html';
});

// Иконки по типу файла
function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const icons = {
    pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊',
    ppt: '📊', pptx: '📊', jpg: '🖼️', jpeg: '🖼️', png: '🖼️',
    gif: '🖼️', webp: '🖼️', mp4: '🎬', avi: '🎬', mov: '🎬',
    mp3: '🎵', zip: '🗜️', rar: '🗜️', txt: '📃', csv: '📊',
  };
  return icons[ext] || '📎';
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' КБ';
  return (bytes/1024/1024).toFixed(1) + ' МБ';
}

function fmtDate(d) {
  return new Date(d).toLocaleString('ru', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

// Загрузка списка
let allFiles = [];
async function loadFiles() {
  try {
    const r = await fetch(WORKER + '/api/files');
    allFiles = await r.json();
    renderFiles(allFiles);
  } catch(e) {
    document.getElementById('filesList').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Ошибка загрузки</p></div>`;
  }
}

function renderFiles(files) {
  const el = document.getElementById('filesList');
  const badge = document.getElementById('statsBadge');
  const totalSize = files.reduce((s,f) => s + (f.size||0), 0);
  badge.innerHTML = `<b>${files.length}</b> файлов · ${fmtSize(totalSize)}`;

  if (!files.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📂</div><p>Файлов нет. Загрузите первый!</p></div>`;
    return;
  }

  el.innerHTML = files.map(f => `
    <div class="file-row">
      <div class="file-icon">${fileIcon(f.name)}</div>
      <div class="file-info">
        <div class="file-name" title="${f.name}">${f.name}</div>
        <div class="file-meta">${fmtDate(f.uploaded)}</div>
      </div>
      <div class="file-size">${fmtSize(f.size)}</div>
      <div class="file-actions">
        <a class="btn-dl" href="${WORKER}/api/files/${encodeURIComponent(f.name)}" download="${f.name}" target="_blank">⬇ Скачать</a>
        <button class="btn-del" onclick="deleteFile('${f.name.replace(/'/g,"\\'")}')">🗑</button>
      </div>
    </div>`).join('');
}

// Поиск
document.getElementById('searchBox').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderFiles(q ? allFiles.filter(f => f.name.toLowerCase().includes(q)) : allFiles);
});

// Удаление
async function deleteFile(name) {
  if (!confirm('Удалить файл "' + name + '"?')) return;
  await fetch(WORKER + '/api/files/' + encodeURIComponent(name), { method: 'DELETE' });
  await loadFiles();
}
window.deleteFile = deleteFile;

// Загрузка файлов
async function uploadFiles(files) {
  const progress = document.getElementById('uploadProgress');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  progress.style.display = 'block';

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const pct = Math.round((i / files.length) * 100);
    fill.style.width = pct + '%';
    label.textContent = `Загрузка ${i+1}/${files.length}: ${file.name}`;

    try {
      await fetch(WORKER + '/api/files', {
        method: 'POST',
        headers: {
          'Content-Type': file.type || 'application/octet-stream',
          'X-File-Name': encodeURIComponent(file.name),
        },
        body: file,
      });
    } catch(e) {
      console.error('Upload error:', e);
    }
  }

  fill.style.width = '100%';
  label.textContent = '✅ Загружено!';
  setTimeout(() => { progress.style.display = 'none'; }, 1500);
  await loadFiles();
}

// Drag & Drop
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files.length) uploadFiles(Array.from(e.target.files)); });

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files);
  if (files.length) uploadFiles(files);
});

// Paste (Ctrl+V)
document.addEventListener('paste', e => {
  const files = Array.from(e.clipboardData.files);
  if (files.length) uploadFiles(files);
});

loadFiles();
</script>
<script src="js/dropzone.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
